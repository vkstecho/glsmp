// ═══ IndexedDB: persistent raw data storage (no size limit) ═══
const IDB_NAME='MetCostRaw',IDB_VER=1;
function idbOpen(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('raw'))db.createObjectStore('raw')};
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}
async function idbSave(key,val){
  try{const db=await idbOpen();const tx=db.transaction('raw','readwrite');tx.objectStore('raw').put(val,key);return new Promise((r,j)=>{tx.oncomplete=()=>r(true);tx.onerror=()=>j(tx.error)})}
  catch(e){console.warn('[MetCost] IDB save error:',e);return false}
}
async function idbLoad(key){
  try{const db=await idbOpen();const tx=db.transaction('raw','readonly');const req=tx.objectStore('raw').get(key);return new Promise((r,j)=>{req.onsuccess=()=>r(req.result||null);req.onerror=()=>j(req.error)})}
  catch(e){console.warn('[MetCost] IDB load error:',e);return null}
}
async function idbClear(){
  try{const db=await idbOpen();const tx=db.transaction('raw','readwrite');tx.objectStore('raw').clear();return new Promise(r=>{tx.oncomplete=()=>r(true)})}
  catch(e){return false}
}
// Save all raw data to IndexedDB after upload
async function saveRawToIDB(){
  const types=['mb51','zslit','zjumbo','electricity','consSpares'];
  let saved=0;
  for(const t of types){
    if(rawData[t]&&rawData[t].length>0){
      await idbSave('raw_'+t,rawData[t]);
      saved++;
      console.log('[MetCost] IDB saved '+t+': '+rawData[t].length+' rows');
    }
  }
  await idbSave('raw_meta',{savedAt:new Date().toISOString(),types:types.filter(t=>rawData[t]&&rawData[t].length>0),rowCounts:types.reduce((o,t)=>{o[t]=(rawData[t]||[]).length;return o},{})});
  console.log('[MetCost] ✅ IDB saved '+saved+' data types');
  return saved;
}
// Load raw data from IndexedDB (on app start)
async function loadRawFromIDB(){
  const meta=await idbLoad('raw_meta');
  if(!meta||!meta.types||meta.types.length===0) return false;
  console.log('[MetCost] IDB found saved data from '+meta.savedAt+': '+meta.types.join(', '));
  let loaded=0;
  for(const t of meta.types){
    const data=await idbLoad('raw_'+t);
    if(data&&data.length>0){rawData[t]=data;loaded++;console.log('[MetCost] IDB loaded '+t+': '+data.length+' rows')}
  }
  if(loaded>0){
    buildIndex();
    const months=findAllMonths();
    let computed=0;
    months.forEach(mk=>{
      try{const result=computeMonth(mk);if(result){savedMonths[mk]={...savedMonths[mk],...result,savedAt:new Date().toISOString()};computed++}}catch(err){}
    });
    if(computed) saveToStorage();
    lastComputeResult={months,computed};
    console.log('[MetCost] ✅ IDB recomputed '+computed+'/'+months.length+' months');
    initMonths();render();
    return true;
  }
  return false;
}

function saveToStorage(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(savedMonths))}catch(e){}

  try{
    const trimmed={};
    Object.keys(savedMonths).forEach(mk=>{
      const d=savedMonths[mk];if(!d) return;
      const t=Object.assign({},d);
      if(t.zsAgg){
        t.zsAgg={

          bySize:(t.zsAgg.bySize||[]).slice(0,8)
        };
      }
      // Remove heavy fields
      delete t.wt;
      trimmed[mk]=t;
    });
    const dataStr=JSON.stringify(trimmed);
    const sizeMB=(dataStr.length/1024/1024).toFixed(2);
    console.log('[MetCost] Syncing '+Object.keys(trimmed).length+' months to Firebase ('+sizeMB+'MB)');
    window._syncStatus='saving';
    window.parent.postMessage({type:'METCOST_SAVE',data:trimmed},'*');

function trimData(data,type){
  if(!data||!data.length||!KEEP_COLS[type]) return data;
  if(type==='zjumbo'||type==='zslit') return data; // don't trim — need all equiv columns
  const keep=new Set(KEEP_COLS[type]);
  return data.map(row=>{
    const out={};
    for(const k of Object.keys(row)){
      if(keep.has(k)) out[k]=row[k];
    }
    return out;
  });
}

function parseXL(file,cb,headerRow){
  const sizeMB=file.size/1024/1024;
  const r=new FileReader();
  r.onerror=()=>{cb(null,null,null,'Read failed: '+file.name)};
  r.onload=e=>{
    try{
      const opts={type:'array',cellDates:true,cellFormula:false,cellStyles:false,cellHTML:false,cellNF:false,cellText:false,
        bookVBA:false,bookProps:false,bookDeps:false,sheetStubs:false};
      if(sizeMB>22) opts.dense=true;
      if(sizeMB>80) opts.raw=true;
      const wb=XLSX.read(e.target.result,opts);
      e.target.result=null;
      
      // Multi-sheet support: if workbook has multiple sheets, try each
      if(wb.SheetNames.length>1){
        const sheets=[];
        wb.SheetNames.forEach(sn=>{
          try{
            const ws=wb.Sheets[sn];
            if(!ws) return;
            let data=XLSX.utils.sheet_to_json(ws,{defval:null,raw:sizeMB>80});
            if(!data||!data.length){
              // Try re-parsing from row 3 for electricity
              const elecRow=scanForElectricity(ws);
              if(elecRow>1) data=XLSX.utils.sheet_to_json(ws,{defval:null,range:elecRow-1});
            }
            if(data&&data.length>0){
              const headers=Object.keys(data[0]);
              const type=detectFileType(headers);
              if(type) sheets.push({data,type,sheetName:sn,ws});
            }
            wb.Sheets[sn]=null; // free memory
          }catch(ex){console.warn('[MetCost] Sheet '+sn+' error:',ex)}
        });
        if(sheets.length>0){
          cb(sheets,wb,null,null,'multi'); // multi-sheet flag
          return;
        }
      }
      
      // Single sheet (original behavior)
      const ws=wb.Sheets[wb.SheetNames[0]];
      let data;
      if(headerRow){
        data=XLSX.utils.sheet_to_json(ws,{defval:null,range:headerRow-1,raw:sizeMB>80});
      }else{
        data=XLSX.utils.sheet_to_json(ws,{defval:null,raw:sizeMB>80});
      }
      wb.Sheets[wb.SheetNames[0]]=null;
      cb(data,wb,ws,null);
    }catch(err){
      console.error('Parse error for '+file.name+' ('+sizeMB.toFixed(1)+'MB):', err);
      cb(null,null,null,'Parse error ('+sizeMB.toFixed(0)+'MB): '+(err.message||'Unknown').slice(0,80));
    }
  };
  r.readAsArrayBuffer(file);
}

function detectFileType(headers){
  const h=headers.map(x=>String(x||'').toLowerCase().trim());
  const has=(...keys)=>keys.every(k=>h.some(x=>x.includes(k)));
  // ELECTRICITY first — because re-parsed electricity row3 has extra cols that look like ZJUMBO
  if(has('met-1')&&has('met-2')) return 'electricity';
  if(has('met+%utility share')) return 'electricity';
  if(has('total met')&&has('process plant')) return 'electricity';
  if(has('process plant')&&has('chillers')&&has('utility')) return 'electricity';
  // MB51
  if(has('amt.in loc.cur')&&has('movement type')&&has('material')&&!has('cost center')&&!has('met-1')) return 'mb51';
  // ZJUMBO — require both machine AND setup time (not just date of production alone)
  if(has('date of production')&&has('machine')&&(has('setup time')||has('chamber open'))) return 'zjumbo';
  if(has('movment type')&&has('machine')&&has('setup time')) return 'zjumbo';
  // ZSLIT
  if(has('move type')&&has('net weight')&&has('grade')&&has('sales order')) return 'zslit';
  // Cons & Spares
  if(has('cost center')&&has('amt.in loc.cur')) return 'consSpares';
  // MB51 fallback
  if(has('material')&&has('amt.in loc.cur')&&h.some(x=>x.includes('posting date'))) return 'mb51';
  return null;
}

// Scan raw worksheet cells for electricity keywords (rows 1-5)
function scanForElectricity(ws){
  // Handle both normal and dense mode worksheets
  const range=XLSX.utils.decode_range(ws['!ref']||'A1');
  for(let r=0;r<=Math.min(4,range.e.r);r++){
    for(let c=0;c<=Math.min(25,range.e.c);c++){
      let v='';
      if(ws['!data']){
        // Dense mode
        v=String((ws['!data'][r]&&ws['!data'][r][c]&&ws['!data'][r][c].v)||'').toLowerCase();
      }else{
        // Normal mode
        const addr=XLSX.utils.encode_cell({r,c});
        const cell=ws[addr];
        v=cell?String(cell.v||'').toLowerCase():'';
      }
      if(v.includes('met-1')||v.includes('met-2')||v.includes('total met')||v.includes('process plant')||v.includes('met+%utility')) return r+1;
    }
  }
  return 0;
}

const FILE_LABELS={mb51:'MB51 (SAP Movements)',zjumbo:'ZJUMBO_PROD (Met Prod)',zslit:'ZSLIT_PROD (Slit Prod)',electricity:'Electricity Cost',consSpares:'Cons & Spares'};
const FILE_COLORS={mb51:'#0f52ba',zjumbo:'#0d9488',zslit:'#7c3aed',electricity:'#d97706',consSpares:'#16a34a'};

function handleMultiUpload(inp){
  if(!inp.files||!inp.files.length)return;
  const fileList=Array.from(inp.files);
  processing='multi';uploadLog=[];render();

  // Process files ONE AT A TIME to avoid browser memory crash on large files
  let idx=0;
  function processNext(){
    if(idx>=fileList.length){
      processing=null;
      // DEBUG: show what rawData contains
      const dbg=[];
      dbg.push('rawData keys: '+Object.keys(rawData).join(', '));

        const r0=rawData.mb51[0];

        dbg.push('MB51 months: '+Object.keys(_indexed.mb51||{}).join(', '));
        const months=findAllMonths();
        dbg.push('findAllMonths: '+months.length+' → '+months.slice(0,5).join(', ')+(months.length>5?'...':''));
        let computed=0,errors=[];
        months.forEach(mk=>{
          try{
            const result=computeMonth(mk);
            if(result){
              const existing=savedMonths[mk]||{};
              savedMonths[mk]={...existing,...result,savedAt:new Date().toISOString()};
              computed++;
            }else{
              errors.push(mk+': null');
            }
          }catch(err){errors.push(mk+': '+err.message)}
        });
        dbg.push('Computed: '+computed+'/'+months.length);
        if(errors.length) dbg.push('Errors: '+errors.slice(0,5).join(' | '));
        if(computed) saveToStorage();
        // Save raw data to IndexedDB for persistent storage (never re-upload)
        saveRawToIDB().then(n=>dbg.push('IDB: saved '+n+' types')).catch(()=>{});
        lastComputeResult={months:[...new Set([...months,...Object.keys(savedMonths)])].sort(),computed};
      }catch(err){
        dbg.push('CRASH: '+err.message+' at '+err.stack?.split('\n')[1]);
        lastComputeResult={months:[],computed:0};
      }
      // Show debug on screen
      window._lastDebug=dbg.join('\n');
      console.log('[MetCost DEBUG]\n'+dbg.join('\n'));
      initMonths();
      render();
      return;
    }
    const file=fileList[idx];
    const sizeMB=(file.size/1024/1024).toFixed(1);
    processing='multi ('+file.name+' · '+sizeMB+'MB)';render();

    parseXL(file,(data,wb,ws,err,multiFlag)=>{
      // Multi-sheet workbook: data is array of {data, type, sheetName}
      if(multiFlag==='multi'&&Array.isArray(data)){
        data.forEach(sheet=>{
          const type=sheet.type;
          const sData=trimData(sheet.data,type);
          if(rawData[type]){
            rawData[type]=rawData[type].concat(sData);
            uploads[type].rows+=sData.length;
            uploads[type].files=(uploads[type].files||1)+1;
          }else{
            rawData[type]=sData;
            uploads[type]={name:file.name+'→'+sheet.sheetName,rows:sData.length,size:sizeMB,files:1};
          }
          uploadLog.push({name:file.name+' ['+sheet.sheetName+']',status:'ok',type,size:'-',rows:sData.length});
          console.log(`[MetCost] ✅ ${file.name} → sheet "${sheet.sheetName}" → ${type} (${sData.length} rows)`);
        });
        idx++;setTimeout(processNext,file.size>20*1024*1024?500:100);
        return;
      }

      if(err||!data||!data.length){
        const failMsg=sizeMB>50?(err||'File too large for browser')+'<br>→ Open in Excel → Save As → CSV (.csv) → Upload CSV instead':err||'empty';
        uploadLog.push({name:file.name,status:failMsg,type:null,size:sizeMB});
        idx++;setTimeout(processNext,100); // small delay to let browser GC
        return;
      }
      const headers=Object.keys(data[0]);
      let type=detectFileType(headers);

      if(!type&&ws){
        const elecRow=scanForElectricity(ws);
        console.log(`[MetCost] ${file.name}: first detect=${type}, scanForElectricity=${elecRow}`);
        if(elecRow>1){
          try{
            const reData=XLSX.utils.sheet_to_json(ws,{defval:null,range:elecRow-1});
            console.log(`[MetCost] ${file.name}: re-parsed from row ${elecRow}, got ${reData?reData.length:0} rows, headers: ${reData&&reData[0]?Object.keys(reData[0]).slice(0,8).join(', '):'NONE'}`);
            if(reData&&reData.length){
              const reType=detectFileType(Object.keys(reData[0]));
              console.log(`[MetCost] ${file.name}: re-detect=${reType}`);
              if(reType){type=reType;data=reData}
            }
          }catch(e){console.error('[MetCost] Electricity re-parse error:',e)}
        }
      }

      if(type){
        // Trim unused columns to free memory (critical for 100MB+ files)
        data=trimData(data,type);
        // For raw-mode parsed files (>80MB), convert Excel serial dates to JS Date objects
        if(file.size>80*1024*1024){
          const dateKeys=type==='zslit'?['Date']:type==='mb51'?['Posting Date']:type==='zjumbo'?['Date of Production','Chamber Open Date']:['Date'];
          data.forEach(row=>{
            dateKeys.forEach(k=>{
              if(row[k]&&typeof row[k]==='number'&&row[k]>40000){
                row[k]=new Date((row[k]-25569)*86400000);
              }
            });
          });
        }
        // APPEND data — don't replace (supports multiple files of same type)
        if(rawData[type]){
          rawData[type]=rawData[type].concat(data);
          uploads[type].name+=' + '+file.name;
          uploads[type].rows+=data.length;
          uploads[type].size=((parseFloat(uploads[type].size)||0)+parseFloat(sizeMB)).toFixed(1);
          uploads[type].files=(uploads[type].files||1)+1;
        }else{
          rawData[type]=data;
          uploads[type]={name:file.name,rows:data.length,size:sizeMB,files:1};
        }
        uploadLog.push({name:file.name,status:'ok',type,size:sizeMB,rows:data.length});
        console.log(`[MetCost] ✅ ${file.name} → ${type} (${data.length} rows, ${sizeMB}MB)`);
      }else{
        uploadLog.push({name:file.name,status:'unknown',type:null,headers:headers.slice(0,5).join(', '),size:sizeMB});
        console.warn(`[MetCost] ❌ ${file.name}: NOT DETECTED. Headers: ${headers.slice(0,8).join(', ')}`);
      }
      idx++;setTimeout(processNext,file.size>20*1024*1024?500:100); // delay for GC on large files
    });
  }
  processNext();
}

function parseDate(v){
  if(v instanceof Date) return isNaN(v)?null:v;
  if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?null:d}
  if(typeof v==='string'){
    const s=v.trim();
    // Handle DD-MM-YYYY (Indian SAP format with 4-digit year)
    let m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if(m){return new Date(+m[3],+m[2]-1,+m[1])}
    // Fallback to native Date (handles M/D/YY, YYYY-MM-DD, ISO, etc.)
    const d=new Date(s);return isNaN(d)?null:d;
  }
  return null;
}

function getMonthKey(d){const dt=parseDate(d);if(!dt)return null;return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}

// Scan all uploaded data to find which months are present
function findAllMonths(){
  const months=new Set();
  const scan=(arr,dateCol)=>{
    if(!arr)return;
    arr.forEach(r=>{
      const mk=getMonthKey(r[dateCol]||r.Date||r.date||r['Posting Date']);
      if(mk)months.add(mk);
    });
  };
  scan(rawData.mb51,'Posting Date');
  scan(rawData.zslit,'Date');
  scan(rawData.zjumbo,'Date of Production');
  scan(rawData.electricity,'Date');
  scan(rawData.consSpares,'Posting Date');
  return Array.from(months).sort();
}

// Compute conversion cost for ONE specific month
// Pre-index raw data by month for fast computation
let _indexed={};
function buildIndex(){
  _indexed={};
  const idx=(arr,dateCol)=>{
    const m={};
    if(!arr) return m;
    arr.forEach(r=>{
      const mk=getMonthKey(r[dateCol]||r.Date||r.date||r['Posting Date']);
      if(mk){if(!m[mk])m[mk]=[];m[mk].push(r)}
    });
    return m;
  };
  if(rawData.mb51) _indexed.mb51=idx(rawData.mb51,'Posting Date');
  if(rawData.zslit) _indexed.zslit=idx(rawData.zslit,'Date');
  if(rawData.zjumbo) _indexed.zjumbo=idx(rawData.zjumbo,'Date of Production');
  if(rawData.electricity) _indexed.electricity=idx(rawData.electricity,'Date');
  if(rawData.consSpares) _indexed.consSpares=idx(rawData.consSpares,'Posting Date');
  console.log('[MetCost] Index built: mb51='+Object.keys(_indexed.mb51||{}).length+'mo, zslit='+Object.keys(_indexed.zslit||{}).length+'mo');
}

function computeMonth(monthKey){
  const{mb51,zslit,electricity,consSpares}=rawData;
  if(!mb51)return null;
  let denom=0,zsAgg=null; // declared early to prevent TDZ errors
  const ms=new Date(monthKey+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
  const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};

  // Use pre-indexed data if available (much faster for large datasets)
  const mb=_indexed.mb51?(_indexed.mb51[monthKey]||[]):mb51.filter(r=>inM(r['Posting Date']));
  const zs=_indexed.zslit?(_indexed.zslit[monthKey]||[]):zslit?zslit.filter(r=>inM(r.Date||r['Posting Date'])):[];
  const el=_indexed.electricity?(_indexed.electricity[monthKey]||[]):electricity?electricity.filter(r=>inM(r.Date||r.date||r['Posting Date'])):[];
  const cs=_indexed.consSpares?(_indexed.consSpares[monthKey]||[]):consSpares?consSpares.filter(r=>inM(r['Posting Date']||r.Date)):[];

  // Wire cost: All 3RM-ALW rows, raw sum (negative for consumption, positive for returns)
  let wireAmt=0,wireN=0,wireKgsTotal=0;
  mb.filter(r=>String(r.Material||'').toUpperCase().includes('3RM-ALW')).forEach(r=>{
    wireAmt+=Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0); // raw (negative)
    wireKgsTotal+=Number(r['Qty in unit of entry']||0); // raw (negative)
    wireN++;
  });
  wireAmt=-wireAmt; wireKgsTotal=-wireKgsTotal; // negate: consumption is positive

  // Boat cost: compute weighted rate from Libra vs OKOSU/Supervac batches
  let boatAmt=0,boatN=0,boatPcsTotal=0;
  const boatTypes={Libra:{qty:0,amt:0},OKOSU:{qty:0,amt:0},Supervac:{qty:0,amt:0}};
  mb.filter(r=>String(r.Material||'').toUpperCase().includes('3RM-EVB')).forEach(r=>{
    const amt=-Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0); // negate
    const qty=-Number(r['Qty in unit of entry']||0); // negate
    boatAmt+=amt;boatN++;boatPcsTotal+=qty;
    const batch=String(r.Batch||r['Valuation Type']||'').toUpperCase();
    if(batch.startsWith('LIB')){boatTypes.Libra.qty+=qty;boatTypes.Libra.amt+=amt}
    else if(batch.startsWith('OKO')){boatTypes.OKOSU.qty+=qty;boatTypes.OKOSU.amt+=amt}
    else if(batch.startsWith('SUP')){boatTypes.Supervac.qty+=qty;boatTypes.Supervac.amt+=amt}
  });
  // Compute actual weighted boat rate (₹/Pc)
  const boatRate=boatPcsTotal>0?boatAmt/boatPcsTotal:rates.boatRate;

  // SLIT PRODUCTION: MB51 Orders 304/306, Mvt 101+102
  let prodKg=0;
  mb.filter(r=>{
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    return(ord.startsWith('304')||ord.startsWith('306'))&&(mvt==='101'||mvt==='102');
  }).forEach(r=>{prodKg+=Number(r['Qty in unit of entry']||0)});

  // MET JUMBO PRODUCTION: MB51 Orders 303/305, Mvt 101
  let metJumboKg=0;
  mb.filter(r=>{
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    return(ord.startsWith('303')||ord.startsWith('305'))&&mvt==='101';
  }).forEach(r=>{metJumboKg+=Number(r['Qty in unit of entry']||0)});

  if(!prodKg||prodKg<1) return null;

  // GRADE CATEGORIZATION from ZSLIT (Move Type 101 only) — MUST be before bare/met waste
  let slitAKg=0,slitBKg=0,grade5Kg=0,grade6Kg=0,equivKg=0,exportKg=0,domesticKg=0,heatSealKg=0;
  let wtWirePerMT=rates.wireOD22,wtBoatPerMT=rates.boatOD22,wtWireCost=rates.tWire,wtBoatCost=rates.tBoat;
  let matBreakdown=[],matchedKg=0;
  if(zslit){
    const sm=zs;
    const p101=sm.filter(r=>String(r['Move Type']||'')=='101');
    // Log ZSLIT column names for equiv debugging
    if(sm.length>0){
      const keys=Object.keys(sm[0]);
      const eqCols=keys.filter(k=>k.toLowerCase().includes('equiv')||k.toLowerCase().includes('output'));
      console.log(`[MetCost] ${monthKey}: ZSLIT ${sm.length} rows, equivCols=[${eqCols.join(', ')}]`);
    }
    slitAKg=p101.filter(r=>{const g=String(r.Grade||'');return g==='2'||g==='7'||g==='8'}).reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    slitBKg=p101.filter(r=>String(r.Grade||'')==='3').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    grade5Kg=p101.filter(r=>String(r.Grade||'')==='5').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    grade6Kg=p101.filter(r=>String(r.Grade||'')==='6').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    // Equivalent output: ALWAYS compute from factors (OD Eqv × Mic Eqv × NW × Width/3000)
    // Column 'Equivalent Output' is unreliable in dense-mode parsed files
    const p101valid=p101.filter(r=>{const g=String(r.Grade||'');return g==='2'||g==='3'||g==='7'||g==='8'});
    // Equivalent output: only Grade 2,3,7,8 (same as effective production)
    equivKg=p101valid.reduce((s,r)=>{
      const raw=r['Equivalent Output']||r['Equivalent output']||r['EQUIVALENT OUTPUT'];
      if(raw===undefined||raw===null||raw==='') return s;
      const v=Number(raw);
      // Filter out NaN (#VALUE! errors) and error codes (<50)
      return s+((isFinite(v)&&v>50)?v:0);
    },0);
    if(equivKg<1){
      equivKg=p101valid.reduce((s,r)=>{
        const nw=Number(r['Net Weight']||0);
        const od=Number(r['OD Eqv.']||r['OD Eqv']||0);
        const mic=Number(r['Mic Eqv.']||r['Mic Eqv']||0);
        const w=Number(r['Width']||r['OD']||0);
        const wf=w>100?w/3000:1;
        if(nw>0&&od>0&&mic>0) return s+nw*od*mic*wf;
        return s+nw;
      },0);
    }
    // Export vs Domestic (Sales Order starting with 3302 = export) & Heat Seal (SLC/LCM in material)
    p101.filter(r=>{const g=String(r.Grade||'');return g!=='5'&&g!=='6'}).forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      const so=String(r['Sales Order']||'').trim();
      const mat=String(r.Material||'').toUpperCase();
      if(so.startsWith('3302')) exportKg+=nw; else domesticKg+=nw;
      if(mat.includes('SLC')||mat.includes('LCM')) heatSealKg+=nw;
    });

    // ═══ WEIGHTED TARGETS: Match ZSLIT material codes to BOM for mix-based targets ═══
    const bomMap={};
    targets.forEach(t=>{bomMap[t.c.toUpperCase()]=t});
    const matMix={}; // code → totalKg
    let unmatchedKg=0;
    p101.filter(r=>{const g=String(r.Grade||'');return g!=='5'&&g!=='6'}).forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      if(nw<=0) return;
      // Extract BOM code: 3SF-G12301M22 → G12301M22, or 3FG-G12301M22 → G12301M22
      let mat=String(r.Material||'').trim();
      let code=mat.replace(/^3[A-Z]{2}-/i,'').toUpperCase();
      if(bomMap[code]){
        matMix[code]=(matMix[code]||0)+nw;
        matchedKg+=nw;
      }else{
        unmatchedKg+=nw;
      }
    });
    // Compute weighted targets
    let wtWire=0,wtBoat=0,totalMixKg=0;
    matBreakdown=[];
    Object.entries(matMix).forEach(([code,kg])=>{
      const bom=bomMap[code];
      if(!bom) return;
      wtWire+=bom.w*kg/1000; // wire Kgs for this material
      wtBoat+=bom.b*kg/1000; // boat Pcs for this material
      totalMixKg+=kg;
      matBreakdown.push({code,kg,pct:0,wirePerMT:bom.w,boatPerMT:bom.b});
    });
    matBreakdown.forEach(m=>{m.pct=totalMixKg>0?m.kg/totalMixKg*100:0});
    matBreakdown.sort((a,b)=>b.kg-a.kg);
    // Weighted target ₹/Kg = (totalWireKgs × wireRate + totalBoatPcs × boatRate) / prodKg
    wtWirePerMT=totalMixKg>0?wtWire/(totalMixKg/1000):rates.wireOD22;
    wtBoatPerMT=totalMixKg>0?wtBoat/(totalMixKg/1000):rates.boatOD22;
    wtWireCost=wtWirePerMT*rates.wireRate/1000;
    wtBoatCost=wtBoatPerMT*(rates.boatRate||1087)/1000;
    console.log(`[MetCost] ${monthKey}: BOM match ${matchedKg.toFixed(0)}Kg (${unmatchedKg.toFixed(0)} unmatched), wtWire=${wtWirePerMT.toFixed(2)}Kg/MT, wtBoat=${wtBoatPerMT.toFixed(2)}Pcs/MT`);
  }

  // ═══ DETAILED ZSLIT AGGREGATION for AI Assistant ═══
  // VERSION: v3.6 — all fixes
  zsAgg=null;
  if(zslit&&zs.length>0){
   try{
    const byMat={},byCust={},bySize={},byCustMat={};
    let totalRolls=0;
    const p101prod=zs.filter(r=>{
      const mvt=String(r['Move Type']||'').trim();
      const g=String(r.Grade||'');
      return mvt==='101'&&g!=='5'&&g!=='6';
    });
    p101prod.forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      if(nw<=0) return;
      totalRolls++;
      let mat=String(r.Material||'').trim().replace(/^3[A-Z]{2}-/i,'');
      const desc=String(r['Material Description']||r['Material Group']||'').trim();
      const thick=String(r.Thickness||'');
      const od=String(r.OD||r['OD_1']||'');
      const width=Number(r.Width||0);
      const custName=String(r['Ship-To-Party Name']||'').trim();
      const custCity=String(r['Ship-To-Party City']||'').trim();
      const shift=String(r.Shift||'');
      const machine=String(r.Machine||'');
      // By Material — with A/B grade split for P&L
      if(!byMat[mat]) byMat[mat]={code:mat,desc,kg:0,rolls:0,widthSum:0,aKg:0,bKg:0};
      byMat[mat].kg+=nw; byMat[mat].rolls++; byMat[mat].widthSum+=width;
      const gr=String(r.Grade||'');
      if(gr==='3') byMat[mat].bKg+=nw; else byMat[mat].aKg+=nw;
      // By Customer — with size/OD/material breakdown
      if(custName){
        const ck=custName;
        if(!byCust[ck]) byCust[ck]={name:custName,city:custCity,kg:0,rolls:0,mats:{},sizes:{}};
        byCust[ck].kg+=nw; byCust[ck].rolls++;
        if(!byCust[ck].mats[mat]) byCust[ck].mats[mat]=0;
        byCust[ck].mats[mat]+=nw;
        const szk=thick+'µ×'+od+'OD×'+width+'mm';
        if(!byCust[ck].sizes[szk]) byCust[ck].sizes[szk]=0;
        byCust[ck].sizes[szk]+=nw;
      }
      // By Size (Thickness × OD)
      const sk=thick+'µ×'+od+'OD';
      if(!bySize[sk]) bySize[sk]={thick,od,kg:0,rolls:0};
      bySize[sk].kg+=nw; bySize[sk].rolls++;
    });
    // Convert to sorted arrays (top entries)
    const matArr=Object.values(byMat).sort((a,b)=>b.kg-a.kg);
    matArr.forEach(m=>{m.avgWidth=m.rolls>0?Math.round(m.widthSum/m.rolls):0;m.pct=totalRolls>0?m.kg/(matArr.reduce((s,x)=>s+x.kg,0))*100:0;delete m.widthSum});
    const custArr=Object.values(byCust).sort((a,b)=>b.kg-a.kg);
    const zsTotal=matArr.reduce((s,x)=>s+x.kg,0);
    custArr.forEach(c=>{
      c.pct=zsTotal>0?c.kg/zsTotal*100:0;
      c.topMats=Object.entries(c.mats).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([m,kg])=>m+':'+Math.round(kg)+'Kg');
      c.topSizes=Object.entries(c.sizes).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([s,kg])=>s+':'+Math.round(kg)+'Kg');
      delete c.mats; delete c.sizes;
    });
    const sizeArr=Object.values(bySize).sort((a,b)=>b.kg-a.kg);
    sizeArr.forEach(s=>{s.pct=zsTotal>0?s.kg/zsTotal*100:0});
    zsAgg={
      byMaterial:matArr.slice(0,30),
      byCustomer:custArr.slice(0,30),
      bySize:sizeArr.slice(0,20),
      totalRolls,totalKg:zsTotal
    };

    // ═══ REVENUE & P&L COMPUTATION ═══
    const bomMap2={};
    targets.forEach(t=>{bomMap2[t.c.toUpperCase()]={spDelta:t.spDelta||0,bom:t.bom||1005}});
    let revenue=0,bGradeRevenue=0,baseFilmCost=0,revenueMatched=0;
    matArr.forEach(m=>{
      const bom=bomMap2[m.code.toUpperCase()];
      if(!bom) return;
      const sp=rates.baseFilmRate+(bom.spDelta||0); // Selling price = base + delta
      const aRev=m.aKg*sp; // A-grade at full price
      const bRev=m.bKg*Math.max(0,sp-10); // B-grade at ₹10 less
      revenue+=aRev; bGradeRevenue+=bRev;
      baseFilmCost+=(m.aKg+m.bKg)*rates.baseFilmRate*bom.bom/1000;
      revenueMatched+=m.aKg+m.bKg;
    });
    zsAgg.revenue=revenue+bGradeRevenue;
    zsAgg.aGradeRevenue=revenue;
    zsAgg.bGradeRevenue=bGradeRevenue;
    zsAgg.baseFilmCost=baseFilmCost;
    zsAgg.revenueMatched=revenueMatched;
   }catch(zsErr){console.warn('[MetCost] zsAgg error (non-fatal):',zsErr.message)}
  }

  // WASTE from MB51 materials:
  // Bare = 3SC-TW (trim waste), Met = 3SC-MSW + 3SC-MTW + Grade6
  // I-O: Input = 3FG material (261+262), Output = 3SF material (101+102)
  let metWasteKg=0,bareWasteKg=0,twKg=0;
  let bareIn=0,bareOut=0;
  mb.forEach(r=>{
    const mat=String(r.Material||'').toUpperCase().trim();
    const qty=Math.abs(Number(r['Qty in unit of entry']||0));
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    if(mat==='3SC-MSW'||mat==='3SC-MTW') metWasteKg+=qty;
    if(mat==='3SC-TW') twKg+=qty;
    // I-O tracking: 3FG input (261+262) vs 3SF output (101+102) in metalliser orders 303/305
    if(ord.startsWith('303')||ord.startsWith('305')){
      if((mvt==='261'||mvt==='262')&&mat.startsWith('3FG')) bareIn+=qty;
      if((mvt==='101'||mvt==='102')&&mat.startsWith('3SF')) bareOut+=qty;
    }
  });
  bareWasteKg=twKg; // bare waste = 3SC-TW
  metWasteKg+=grade6Kg; // add ZSLIT Grade 6
  const ioWasteKg=Math.max(0,bareIn-bareOut); // input-output bare
  const wasteKg=bareWasteKg+metWasteKg;

  // Effective production: ZSLIT A+B grade (Excel: "Exc. 5 &6 Grade")
  // Use ZSLIT sum when available (more accurate), MB51 as fallback
  const zslitProd=slitAKg+slitBKg; // Grade 2,3,7,8 — excludes 5 and 6
  const effectiveProd=zslitProd>0?zslitProd:(prodKg-grade5Kg-grade6Kg);
  denom=effectiveProd>0?effectiveProd:prodKg;

  const bareWastePct=bareIn>0?bareWasteKg/bareIn*100:0; // 3SC-TW ÷ Base Film Input (3FG 261/262 in 303/305)
  const ioPct=bareIn>0?ioWasteKg/bareIn*100:0; // (3FG input - 3SF output) ÷ 3FG input
  const metWastePct=prodKg>0?metWasteKg/prodKg*100:0; // Met waste ÷ Slit Production (304+306 Mvt 101+102)

  // SCRAP from MB51: 3SC-ALWW (scrap wire), 3SC-AD (al dust)
  let scrapWireKg=0,scrapDustKg=0;
  mb.forEach(r=>{
    const mat=String(r.Material||'').toUpperCase().trim();
    const qty=Math.abs(Number(r['Qty in unit of entry']||0));
    if(mat==='3SC-ALWW') scrapWireKg+=qty;
    else if(mat==='3SC-AD') scrapDustKg+=qty;
  });
  // If no scrap data in MB51, estimate from wire consumption
  if(!scrapWireKg&&wireKgsTotal>0) scrapWireKg=wireKgsTotal*0.037;
  if(!scrapDustKg&&wireKgsTotal>0) scrapDustKg=wireKgsTotal*0.382;
  // Scrap values: ALWW = scrapAlPct% of wire rate, AD = alDustRate/Kg
  const scrapWireAmt=scrapWireKg*rates.wireRate*(rates.scrapAlPct||70)/100;
  const scrapDustAmt=scrapDustKg*(rates.alDustRate||239);

  // ═══ WEIGHTED AVERAGES FROM ZSLIT (exact Excel Met-1&2!G6/G7 formulas) ═══
  // G6 = SUM(ZSLIT col AV "Mic Eqv.*Weight") / SUM(ZSLIT col L "Net Weight") for Mvt 101 excl Gr5/6
  // G7 = SUM(ZSLIT col AT "OD Eqv.*Weight") / SUM(ZSLIT col L "Net Weight") for Mvt 101 excl Gr5/6
  // O21/P21/Q21 = SUM(ZSLIT col AV) grouped by OD (col AP), for target wire/boat calc
  let odEqWtSum=0,micEqWtSum=0,validNwSum=0;
  let odEq22=0,odEq25=0,odEq28=0; // OD-wise Mic Eqv*Weight sums (in Kg, convert to MT later)

  if(zslit){
    const sm=zs;
    const p101valid=sm.filter(r=>{
      const mvt=String(r['Move Type']||'');
      const g=String(r.Grade||'');
      return mvt==='101'&&g!=='5'&&g!=='6';
    });

    p101valid.forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      if(nw<=0||isNaN(nw)) return;
      // COMPUTE weighted values from base factor columns (reliable through SheetJS)
      // Instead of reading pre-computed *Weight columns which fail in raw/dense mode
      const odEqvFactor=Number(r['OD Eqv.']||0);
      const micEqvFactor=Number(r['Mic Eqv.']||0);
      if(!odEqvFactor||!micEqvFactor||isNaN(odEqvFactor)||isNaN(micEqvFactor)) return;
      const odEqvWt=odEqvFactor*nw;   // = OD Eqv. × Net Weight
      const micEqvWt=micEqvFactor*nw;  // = Mic Eqv. × Net Weight
      odEqWtSum+=odEqvWt;
      micEqWtSum+=micEqvWt;
      validNwSum+=nw;

      // OD grouping from OD Eqv. factor: 1.0→2.2, 1.24→2.5, 1.44→2.8
      if(odEqvFactor>1.3) odEq28+=micEqvWt;
      else if(odEqvFactor>1.1) odEq25+=micEqvWt;
      else if(odEqvFactor>0) odEq22+=micEqvWt;
    });
  }
  // Convert OD-wise sums to MT
  odEq22/=1000;odEq25/=1000;odEq28/=1000;

  // Weighted avg OD factor and Mic factor (Excel Met-1&2 G7 and G6)
  const avgODfactor=validNwSum>0?odEqWtSum/validNwSum:1;   // ~1.07-1.10
  const avgMicFactor=validNwSum>0?micEqWtSum/validNwSum:1;  // ~1.08-1.11
  const avgOD=2.2*avgODfactor;
  const avgMic=12/avgMicFactor;

  // Average width from ZJUMBO (jumbo rolls ~2900mm), NOT ZSLIT (slit rolls ~1000mm)
  const{zjumbo}=rawData;
  let avgWidth=3000;
  let avgLenNormal=0,avgLenRCM=0,avgLenAlOx=0;
  let _lenNormalSum=0,_lenNormalCt=0,_lenRCMSum=0,_lenRCMCt=0,_lenAlOxSum=0,_lenAlOxCt=0;
  const _lenBk={normal:{lt50:0,lt70:0,gte70:0},rcm:{lt30:0,gte32:0,mid:0},alox:{lt23:0,gte23:0}};
  if(zjumbo){
    let wSum=0,wCt=0;
    zjumbo.filter(r=>{
      const mvt=String(r['Movment Type']||r['Mvt type']||r['Movement type']||'').trim();
      return mvt==='101'&&inM(r['Date of Production']);
    }).forEach(r=>{
      // Width: SheetJS names duplicate 'Width' col as 'Width_1' (col AD = jumbo width ~2900mm)
      let w=Number(r['Width_1']||0);
      if(!w||w<100) w=Number(r.Width||0);
      if(w>500&&w<5000){wSum+=w;wCt++}
      // Length: col 'Length_1' (col AC) or 'Length' (col G)
      let len=Number(r['Length_1']||0);
      if(!len||len<100) len=Number(r.Length||0);
      if(typeof len==='string') len=Number(len);
      if(!len||len<500) return; // skip invalid
      // Categorize by material
      const mat=String(r.Material||'').toUpperCase();
      if(mat.includes('RCM')){
        _lenRCMSum+=len;_lenRCMCt++;
        if(len<30000) _lenBk.rcm.lt30++;
        else if(len>=32000) _lenBk.rcm.gte32++;
        else _lenBk.rcm.mid++;
      }else if(mat.includes('AL')&&mat.match(/AL\d/)){
        _lenAlOxSum+=len;_lenAlOxCt++;
        if(len<23000) _lenBk.alox.lt23++; else _lenBk.alox.gte23++;
      }else{
        _lenNormalSum+=len;_lenNormalCt++;
        if(len<50000) _lenBk.normal.lt50++;
        else if(len<70000) _lenBk.normal.lt70++;
        else _lenBk.normal.gte70++;
      }
    });
    if(wCt>0) avgWidth=wSum/wCt;
    if(_lenNormalCt>0) avgLenNormal=_lenNormalSum/_lenNormalCt;
    if(_lenRCMCt>0) avgLenRCM=_lenRCMSum/_lenRCMCt;
    if(_lenAlOxCt>0) avgLenAlOx=_lenAlOxSum/_lenAlOxCt;
    console.log(`[MetCost] ${monthKey}: JUMBO avgWidth=${avgWidth.toFixed(0)}mm, avgLen Normal=${avgLenNormal.toFixed(0)}m(${_lenNormalCt}), RCM=${avgLenRCM.toFixed(0)}m(${_lenRCMCt}), AlOx=${avgLenAlOx.toFixed(0)}m(${_lenAlOxCt})`);
  }

  // Target wire/boat for OD mix (Excel J18/J19):
  // J18 = O21*8.6 + P21*10.4 + Q21*11.8 (OD-wise Mic Eqv*Weight MT × base wire Kg/MT)
  // The micron equivalence is already baked into the Mic Eqv*Weight values from ZSLIT
  const targetWireForMix=odEq22*rates.wireOD22+odEq25*rates.wireOD25+odEq28*rates.wireOD28;
  const targetBoatForMix=odEq22*rates.boatOD22+odEq25*rates.boatOD25+odEq28*rates.boatOD28;

  // Electricity
  let pwrU=0;
  if(electricity){
    const elecRows=el;
    elecRows.forEach(r=>{
      pwrU+=Number(r['Met+%Utility Share']||r['Met+% Utility Share']||r['Total Met']||0);
    });
    console.log(`[MetCost] ${monthKey}: Electricity ${electricity.length} total, ${elecRows.length} in-month, pwrU=${pwrU.toFixed(0)}, keys=${Object.keys(electricity[0]||{}).slice(0,6).join(', ')}`);
    if(elecRows.length===0&&electricity.length>0){
      // Debug: check first row's date
      const d0=electricity[0];
      console.log(`[MetCost] Elec debug: first row Date=${JSON.stringify(d0.Date)} type=${typeof d0.Date}, date=${JSON.stringify(d0.date)}`);
    }
  }else{
    console.log(`[MetCost] ${monthKey}: NO electricity data in rawData`);
  }
  const pwrCost=pwrU*rates.electricityRate;

  // Cons & Spares (Cost Centers 3030010082 + 3030010083)
  let consAmt=0;
  if(consSpares){
    cs.filter(r=>{
      const cc=String(r['Cost Center']||r['Cost center']||'').trim();
      return(cc==='3030010082'||cc==='3030010083');
    }).forEach(r=>{consAmt+=-(Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0))});
    console.log(`[MetCost] ${monthKey}: Cons&Spares consAmt=${consAmt.toFixed(0)}`);
  }

  // MACHINE RUNNING DAYS — Hybrid: time-gap analysis + date-counting fallback
  const daysInMonth=me.getDate();
  let m1RunDays=0,m2RunDays=0;
  const m1Dates=new Set(),m2Dates=new Set();
  let m1PwrStopMins=0,m2PwrStopMins=0,m1PwrEvents=0,m2PwrEvents=0;
  const m1Rolls=[],m2Rolls=[];
  let m1RollCount=0,m2RollCount=0;

  // Time parser for SheetJS
  const parseT=(t)=>{
    if(t==null||t==='') return null;
    if(t instanceof Date) return{h:t.getHours(),m:t.getMinutes()};
    if(typeof t==='object'&&typeof t.getHours==='function') return{h:t.getHours(),m:t.getMinutes()};
    if(typeof t==='object'){try{const s=t.toString();const p=s.match(/(\d{1,2}):(\d{2})/);if(p)return{h:+p[1],m:+p[2]}}catch(e){}}
    if(typeof t==='number'){const f=t>=1?t-Math.floor(t):t;const h=Math.floor(f*24);return{h,m:Math.round((f*24-h)*60)}}
    const s=String(t);const p=s.match(/(\d{1,2})\s*[:.\-]\s*(\d{2})/);
    if(p) return{h:+p[1],m:+p[2]};
    try{const d=new Date(s);if(!isNaN(d))return{h:d.getHours(),m:d.getMinutes()}}catch(e){}
    return null;
  };

  if(zjumbo){
    if(zjumbo.length>0) console.log('[MetCost] ZJUMBO cols: '+Object.keys(zjumbo[0]).slice(0,15).join(', '));

    zjumbo.filter(r=>{
      const mvt=String(r['Movment Type']||r['Mvt type']||r['Movement type']||r['Movement Type']||'').trim();
      return mvt==='101'&&inM(r['Date of Production']||r['Date of production']);
    }).forEach(r=>{
      const machine=String(r.Machine||r.machine||'').trim();
      const prodDate=parseDate(r['Date of Production']||r['Date of production']);
      if(!prodDate) return;
      // Date counting (always works)
      const dateStr=prodDate.toISOString().slice(0,10);
      if(machine.includes('M1')){ m1Dates.add(dateStr); m1RollCount++; }
      else if(machine.includes('M2')){ m2Dates.add(dateStr); m2RollCount++; }
      // Time-based roll tracking
      const chOpenDate=parseDate(r['Chamber Open Date']||r['Chamber open Date']);
      if(!chOpenDate) return;
      const chHM=parseT(r['Chamber Open Time']||r['Chamber open Time']);
      const ventHM=parseT(r['Vent time']||r['Vent Time'])||parseT(r['Web End Time']);
      if(!chHM||!ventHM) return;
      const startDt=new Date(chOpenDate);startDt.setHours(chHM.h,chHM.m,0,0);
      const endDt=new Date(prodDate);endDt.setHours(ventHM.h,ventHM.m,0,0);
      if(endDt<startDt) endDt.setTime(endDt.getTime()+86400000);
      if(machine.includes('M1')) m1Rolls.push([startDt,endDt]);
      else if(machine.includes('M2')) m2Rolls.push([startDt,endDt]);
    });

    // 4hr gap analysis (if time parsing worked)
    function calcStopDays(rolls){
      if(!rolls.length) return daysInMonth;
      rolls.sort((a,b)=>a[0]-b[0]);
      let stopHrs=0,lastEnd=null;
      const mStart=new Date(ms),mEnd=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const fg=(rolls[0][0]-mStart)/3600000; if(fg>4) stopHrs+=fg;
      for(let i=0;i<rolls.length;i++){
        if(lastEnd){const g=(rolls[i][0]-lastEnd)/3600000;if(g>4)stopHrs+=g}
        if(!lastEnd||rolls[i][1]>lastEnd) lastEnd=rolls[i][1];
      }
      if(lastEnd){const lg=(mEnd-lastEnd)/3600000;if(lg>4)stopHrs+=lg}
      return stopHrs/24;
    }

    if(m1Rolls.length>0||m2Rolls.length>0){
      // Time-based approach worked
      const m1Stop=calcStopDays(m1Rolls);
      const m2Stop=calcStopDays(m2Rolls);
      m1RunDays=Math.max(0,daysInMonth-m1Stop);
      m2RunDays=Math.max(0,daysInMonth-m2Stop);
      console.log(`[MetCost] ${monthKey}: TIME-BASED M1=${m1RunDays.toFixed(1)}d(${m1Rolls.length} rolls), M2=${m2RunDays.toFixed(1)}d(${m2Rolls.length} rolls)`);
    }else{
      // Fallback: date counting
      m1RunDays=m1Dates.size;
      m2RunDays=m2Dates.size;
      console.log(`[MetCost] ${monthKey}: DATE-FALLBACK M1=${m1RunDays}d(${m1Dates.size} dates), M2=${m2RunDays}d`);
    }

    // Power shutdown detection
    const PWR_KEYS=['power fail','power cut','power dip','power trip','power shut','power off','power change',
      'poewr','pawer','powr fail','no power','eb cut','eb fail','grid fail','load shed','electr'];
    const isPwr=(txt)=>{const t=(txt||'').toLowerCase();return PWR_KEYS.some(k=>t.includes(k))};
    zjumbo.filter(r=>inM(r['Date of Production']||r['Date of production'])).forEach(r=>{
      if(!isPwr(r.Remarks||'')&&!isPwr(r['Downtime Remark']||'')) return;
      const machine=String(r.Machine||r.machine||'').trim();
      let mins=Math.max(Math.abs(Number(r['Down Time']||0)),Math.abs(Number(r['Down Time_1']||0)),Math.abs(Number(r['Down Time_2']||0)));
      if(machine.includes('M1')){m1PwrStopMins+=mins;m1PwrEvents++}
      else if(machine.includes('M2')){m2PwrStopMins+=mins;m2PwrEvents++}
    });
  }

  const m1PwrStopDays=m1PwrStopMins/60/24;
  const m2PwrStopDays=m2PwrStopMins/60/24;
  // Subtract power stoppage from running days
  m1RunDays=Math.max(0,m1RunDays-m1PwrStopDays);
  m2RunDays=Math.max(0,m2RunDays-m2PwrStopDays);
  const avgRunDays=(m1RunDays+m2RunDays)/2;
  // Rolls per day per machine
  const m1RollsPerDay=m1RunDays>0?m1RollCount/m1RunDays:0;
  const m2RollsPerDay=m2RunDays>0?m2RollCount/m2RunDays:0;
  const avgRollsPerDay=(m1RollsPerDay+m2RollsPerDay)/2;
  // Equivalent rolls per day: each roll weighted by OD Eqv factor
  // 2.2 OD=1.0, 2.5 OD=1.24, 2.8 OD=1.44, 8µ 2.2=1.24, 8µ 2.5=1.44
  // Uses avg OD Eqv from ZSLIT as proxy (ZJUMBO doesn't have per-roll OD)
  const eqRollFactor=avgODfactor>0?avgODfactor:1;
  const m1EqRollsPerDay=m1RollsPerDay*eqRollFactor;
  const m2EqRollsPerDay=m2RollsPerDay*eqRollFactor;
  const avgEqRollsPerDay=(m1EqRollsPerDay+m2EqRollsPerDay)/2;
  console.log(`[MetCost] ${monthKey}: FINAL M1=${m1RunDays.toFixed(1)}d, M2=${m2RunDays.toFixed(1)}d, avg=${avgRunDays.toFixed(1)}d`);


  // Manpower from parent app — ADJUSTED for machine running days
  // Only charge manpower for days machines were actually running
  const mpData=manpowerData[monthKey];
  const mpTotalFull=mpData?mpData.totalNet:0;
  const mpRunRatio=(avgRunDays>0&&daysInMonth>0)?avgRunDays/daysInMonth:1;
  const mpTotal=mpTotalFull*mpRunRatio; // prorated to running days

  // Wire/boat consumed

  // ═══ ACTUAL cost ₹/Kg (÷ effectiveProd) ═══
  const wireCKg=wireAmt/denom,boatCKg=boatAmt/denom,rmC=wireCKg+boatCKg;
  const wastePct=wasteKg/(denom+wasteKg)*100;
  const bGradePct=slitBKg/denom*100;
  // ═══ WASTAGE LOSS — NUCLEAR FIX v3.6 ═══
  // Bare loss = bareWaste% × 50/100 × baseFilmRate / 100
  // Met loss  = adjustedMet% × (baseFilmRate + 5) / 100
  // These 50 and 5 are LITERAL — cannot be corrupted by saved settings
  const BARE_RECOVERY=50; // % of bare film value lost (hardcoded)
  const MET_ADDON=5;      // ₹ addon over base film for met waste (hardcoded)
  const weightGainPct=Math.max(0,bareWastePct-ioPct);
  const adjustedMetPct=Math.max(0,metWastePct-weightGainPct);
  const bareLossComponent=bareWastePct*(BARE_RECOVERY/100)*rates.baseFilmRate/100;
  const metLossComponent=adjustedMetPct*(rates.baseFilmRate+MET_ADDON)/100;
  const wasteLoss=bareLossComponent+metLossComponent;
  console.log(`[MetCost] ${monthKey}: WASTE v3.6: bare%=${bareWastePct.toFixed(3)}, met%=${metWastePct.toFixed(3)}, IO%=${ioPct.toFixed(3)}, wGain=${weightGainPct.toFixed(3)}, adjMet=${adjustedMetPct.toFixed(3)}, bareLoss=${bareLossComponent.toFixed(3)}(${BARE_RECOVERY}%), metLoss=${metLossComponent.toFixed(3)}(+${MET_ADDON}), TOTAL=${wasteLoss.toFixed(3)}`);
  const bGradeLoss=bGradePct*10/100;
  const mpKg=mpTotal/denom;
  const pwrKg=pwrCost/denom,consKg=consAmt/denom;
  const convC=wasteLoss+bGradeLoss+mpKg+pwrKg+consKg+rates.indirectExpense;
  const totalC=rmC+convC,totalWP=totalC+rates.packingFreight;
  // Scrap sale (by-product, deducted from cost)
  const scrapWireSale=scrapWireAmt/denom;
  const scrapDustSale=scrapDustAmt/denom;
  const totalAfterScrap=totalWP-scrapWireSale-scrapDustSale;

  // ═══ EQUIVALENT cost ₹/Kg (Excel-exact formulas) ═══
  // Only compute equiv if we have valid ZSLIT equivalence data
  const hasEquivData=validNwSum>0&&equivKg>0&&(odEq22+odEq25+odEq28)>0;
  console.log(`[MetCost] ${monthKey}: hasEquiv=${hasEquivData}, validNw=${validNwSum.toFixed(0)}, equivKg=${equivKg.toFixed(0)}, avgOD=${validNwSum>0?(odEqWtSum/validNwSum).toFixed(4):'N/A'}, avgMic=${validNwSum>0?(micEqWtSum/validNwSum).toFixed(4):'N/A'}, odEq22=${(odEq22/1000).toFixed(1)}MT`);
  let eqWirePerMT=wireCKg, eqBoatPerMT=boatCKg; // default: equiv = actual
  if(hasEquivData){
    // Wire G8 = (8.6 + (wireKgs - J18) * 1000 / (avgMicFactor * avgODfactor) / F3) * N8 / 1000
    const eqFactor=1/(avgMicFactor*avgODfactor);
    eqWirePerMT=(rates.wireOD22+(wireKgsTotal-targetWireForMix)*1000*eqFactor/denom)*(rates.wireRate||355)/1000;
    eqBoatPerMT=(rates.boatOD22+(boatPcsTotal-targetBoatForMix)*1000*eqFactor/denom)*(boatRate||rates.boatRate||1087)/1000;
  }
  const ratio=hasEquivData&&equivKg>0?denom/equivKg:1;
  // Equivalent wastage (Excel-exact formulas)
  const widthRatio=avgWidth/3000;
  const eqBareWPct=bareWastePct;
  const eqMetWPct=metWastePct*widthRatio;
  const eqWeightGain=Math.max(0,eqBareWPct-ioPct);
  const eqAdjMetPct=Math.max(0,eqMetWPct-eqWeightGain);
  const eqWastePct=eqBareWPct+eqMetWPct;
  const eqBGradePct=bGradePct*widthRatio;
  const eqWasteLoss=(eqBareWPct*(50/100)*rates.baseFilmRate+eqAdjMetPct*(rates.baseFilmRate+5))/100;
  const eqBGradeLoss=eqBGradePct*10/100;
  // G14/G15/G16: Manpower/Power/Cons equiv = actual × (prodKg/equivKg)
  const eqMpKg=mpKg*ratio;
  const eqPwrKg=pwrKg*ratio;
  const eqConsKg=consKg*ratio;
  const eqRM=eqWirePerMT+eqBoatPerMT;
  const eqConvC=eqWasteLoss+eqBGradeLoss+eqMpKg+eqPwrKg+eqConsKg+rates.indirectExpense;
  const eqTotalC=eqRM+eqConvC,eqTotalWP=eqTotalC+rates.packingFreight;
  const eqTotalAfterScrap=eqTotalWP-scrapWireSale-scrapDustSale;

  return{month:monthKey,prodKg,effectiveProd,equivKg,eqRatio:equivKg/denom,metJumboKg,prodMT:denom/1000,slitAKg,slitBKg,grade5Kg,grade6Kg,wasteKg,
    bareWasteKg,metWasteKg,bareWastePct,metWastePct,bareIn,bareOut,twKg,ioWasteKg,ioPct,weightGainPct,adjustedMetPct,bareLossComponent,metLossComponent,boatRate,
    wt:{wirePerMT:wtWirePerMT,boatPerMT:wtBoatPerMT,wireCost:wtWireCost,boatCost:wtBoatCost,breakdown:matBreakdown.slice(0,15),matched:matchedKg},

// Compute ALL months found in uploaded data and auto-save
function computeAndSaveAll(){
  try{
  buildIndex(); // pre-index for fast per-month lookups
  const months=findAllMonths();
  console.log(`[MetCost] computeAndSaveAll: ${months.length} months found: ${months.join(', ')}`);
  console.log(`[MetCost] rawData: mb51=${rawData.mb51?rawData.mb51.length:0}, zslit=${rawData.zslit?rawData.zslit.length:0}, zjumbo=${rawData.zjumbo?rawData.zjumbo.length:0}, elec=${rawData.electricity?rawData.electricity.length:0}, cons=${rawData.consSpares?rawData.consSpares.length:0}`);
  let computed=0;
  months.forEach(mk=>{
    try{
    const result=computeMonth(mk);
    if(result){
      const existing=savedMonths[mk]||{};
      savedMonths[mk]={...existing,...result,savedAt:new Date().toISOString()};
      computed++;
      console.log(`[MetCost] ✅ ${mk}: prod=${result.prodMT?.toFixed(1)}MT, wire=${result.wireCKg?.toFixed(2)}, total=${result.totalC?.toFixed(2)}`);
    }else{
      console.log(`[MetCost] ⚠️ ${mk}: computeMonth returned null`);
    }
    }catch(err){console.error(`[MetCost] ❌ ${mk} compute error:`,err)}
  });
  // Also update existing saved months with partial data (e.g. only electricity uploaded)
  // If a saved month has production data but we have new rawData for power/cons/manpower
  Object.keys(savedMonths).forEach(mk=>{
    if(months.includes(mk)) return; // already computed above
    const existing=savedMonths[mk];
    if(!existing||!existing.effectiveProd) return;
    const denom=existing.effectiveProd;
    let updated=false;
    // Update power if electricity data available for this month
    const{electricity,consSpares}=rawData;
    if(electricity){
      const ms=new Date(mk+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      let pwrU=0;
      electricity.filter(r=>inM(r.Date||r.date||r['Posting Date']||null)).forEach(r=>{
        pwrU+=Number(r['Met+%Utility Share']||r['Met+% Utility Share']||r['Total Met']||0);
      });
      if(pwrU>0){
        const pwrCost=pwrU*rates.electricityRate;
        existing.pwrU=pwrU;existing.pwrCost=pwrCost;existing.pwrKg=pwrCost/denom;
        updated=true;
      }
    }
    // Update cons & spares if available
    if(consSpares){
      const ms=new Date(mk+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      let consAmt=0;
      consSpares.filter(r=>{
        const cc=String(r['Cost Center']||r['Cost center']||'').trim();
        return(cc==='3030010082'||cc==='3030010083')&&inM(r['Posting Date']||r.Date||r['date']);
      }).forEach(r=>{consAmt+=-(Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0))});
      if(consAmt!==0){
        existing.consAmt=consAmt;existing.consKg=consAmt/denom;
        updated=true;
      }
    }
    // Recalculate totals if anything updated
    if(updated){
      existing.convC=(existing.wasteLoss||0)+(existing.bGradeLoss||0)+(existing.mpKg||0)+(existing.pwrKg||0)+(existing.consKg||0)+(existing.rates||rates).indirectExpense;
      existing.totalC=(existing.rmC||0)+existing.convC;
      existing.totalWP=existing.totalC+(existing.rates||rates).packingFreight;
      existing.totalAfterScrap=existing.totalWP-(existing.scrapWireSale||0)-(existing.scrapDustSale||0);
      if(existing.eq){
        existing.eq.pwr=(existing.pwrKg||0)*(existing.effectiveProd/(existing.equivKg||existing.effectiveProd));
        existing.eq.cons=(existing.consKg||0)*(existing.effectiveProd/(existing.equivKg||existing.effectiveProd));
        existing.eq.convC=(existing.eq.wasteLoss||0)+(existing.eq.bGradeLoss||0)+(existing.eq.mp||0)+existing.eq.pwr+existing.eq.cons+(existing.rates||rates).indirectExpense;
        existing.eq.totalC=(existing.eq.rm||0)+existing.eq.convC;
        existing.eq.totalWP=existing.eq.totalC+(existing.rates||rates).packingFreight;
        existing.eq.totalAfterScrap=existing.eq.totalWP-(existing.scrapWireSale||0)-(existing.scrapDustSale||0);
      }
      existing.savedAt=new Date().toISOString();
      computed++;
    }
  });
  if(computed) saveToStorage();
  saveRawToIDB().catch(()=>{});
  console.log(`[MetCost] computeAndSaveAll DONE: ${computed} months computed, ${Object.keys(savedMonths).length} total saved`);
  return{months:[...new Set([...months,...Object.keys(savedMonths)])].sort(),computed};
  }catch(err){console.error('[MetCost] computeAndSaveAll CRASH:',err);return{months:[],computed:0}}
}

function openTrend(metricKey){

function renderTrendModal(){
  const all=Object.keys(savedMonths).sort();
  if(!all.length){alert('No saved months. Upload files first.');return}
  const metric=TREND_METRICS.find(m=>m.key===trendMetric)||TREND_METRICS[0];
  // Safe index calculation
  let fromIdx=all.indexOf(trendFrom);
  let toIdx=all.indexOf(trendTo);
  if(fromIdx<0) fromIdx=Math.max(0,all.length-6);
  if(toIdx<0) toIdx=all.length-1;
  if(fromIdx>toIdx){const t=fromIdx;fromIdx=toIdx;toIdx=t}
  trendFrom=all[fromIdx];trendTo=all[toIdx];
  const months=all.slice(fromIdx,toIdx+1);
  if(!months.length) return;
  const vals=months.map(m=>{const d=savedMonths[m];return d?Number(d[metric.key])||0:0});
  const tgtVal=metric.target?rates[metric.target]:0;
  const maxV=Math.max(...vals,tgtVal||0)*1.2||1;
  const minV=Math.min(...vals,tgtVal||maxV)*0.9;

  // Build SVG chart
  const w=600,h=280,padL=48,padR=12,padT=24,padB=44;
  const cw=w-padL-padR,ch=h-padT-padB;
  const barW=Math.min(36,Math.floor(cw/months.length*0.7));
  const gap=(cw-barW*months.length)/(months.length+1);
  let svg='';

  // Grid lines
  const steps=5;
  for(let i=0;i<=steps;i++){
    const y=padT+ch-ch/steps*i;
    const v=(maxV/steps*i).toFixed(maxV>10?1:2);
    svg+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e2e8f0" stroke-width="0.5"/>`;
    svg+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#94a3b8">${v}</text>`;
  }

  // Target line
  if(tgtVal>0){
    const ty=padT+ch-((tgtVal/maxV)*ch);
    svg+=`<line x1="${padL}" y1="${ty}" x2="${w-padR}" y2="${ty}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>`;
    svg+=`<text x="${w-padR+2}" y="${ty-4}" font-size="9" fill="#ef4444" font-weight="700">Target ${tgtVal}</text>`;
  }

  // Bars + values
  months.forEach((m,i)=>{
    const x=padL+gap+(gap+barW)*i;
    const v=vals[i];
    const bh=Math.max(2,(v/maxV)*ch);
    const y=padT+ch-bh;
    const isOver=tgtVal>0&&v>tgtVal;
    svg+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${isOver?'#ef4444':metric.color}" opacity=".8"/>`;
    svg+=`<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="${isOver?'#ef4444':'#1e293b'}">${v>=100?Math.round(v):v.toFixed(2)}</text>`;

    svg+=`<text x="${x+barW/2}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="#64748b">${lbl}</text>`;
    // Highlight selected month
    if(m===selMonth) svg+=`<rect x="${x-2}" y="${padT}" width="${barW+4}" height="${ch}" rx="4" fill="rgba(15,82,186,.06)" stroke="#0f52ba" stroke-width="1" stroke-dasharray="3,3"/>`;
  });

  // Metric selector buttons
  let metricBtns='';
  TREND_METRICS.forEach(mt=>{
    const isOn=mt.key===trendMetric;
    metricBtns+=`<button onclick="trendMetric='${mt.key}';renderTrendModal()" style="padding:5px 10px;border-radius:6px;border:1.5px solid ${isOn?mt.color:'var(--bd)'};background:${isOn?mt.color+'18':'var(--sf)'};color:${isOn?mt.color:'var(--tx3)'};font-size:10px;font-weight:${isOn?'700':'500'};cursor:pointer;font-family:var(--fn);white-space:nowrap">${mt.label}</button>`;
  });

  // Month range selectors
  let fromOpts='',toOpts='';
  all.forEach(m=>{
    fromOpts+=`<option value="${m}"${m===trendFrom?' selected':''}>${monthLabel(m)}</option>`;
    toOpts+=`<option value="${m}"${m===trendTo?' selected':''}>${monthLabel(m)}</option>`;
  });

  // Stats
  const avg=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
  const best=Math.min(...vals);
  const worst=Math.max(...vals);

  document.getElementById('trendModal').innerHTML=`<div class="mo" onclick="document.getElementById('trendModal').innerHTML=''">
    <div style="background:var(--sf);width:100%;max-width:700px;max-height:95vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">

      </div>

        <tr class="tt"><td>Total cost</td><td class="n">₹${fmt(d.totalC)}</td><td class="n">₹${fmt(e.totalC)}</td><td class="n">100%</td></tr>
        <tr><td>+ Packing+Freight</td><td class="n">${fmt(r.packingFreight)}</td><td class="n">${fmt(r.packingFreight)}</td><td class="n"></td></tr>
        <tr class="tt"><td>Total with P+F</td><td class="n">₹${fmt(d.totalWP)}</td><td class="n">₹${fmt(e.totalWP)}</td><td class="n"></td></tr>
        <tr style="color:var(--gn)"><td>− Scrap Wire (3SC-ALWW)</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n"></td></tr>
        <tr style="color:var(--gn)"><td>− Al Dust (3SC-AD)</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n"></td></tr>
        <tr class="tt"><td>Net cost after scrap</td><td class="n">₹${fmt(d.totalAfterScrap)}</td><td class="n">₹${fmt(e.totalAfterScrap)}</td><td class="n"></td></tr>
      </tbody></table>`;
    }
    // With targets: Actual | Equivalent | Target (12µ 2.2) | W.TGT (mix) | Variance
    const tg=(actual,t)=>{const v=t-actual;return `<span class="tg ${v<0?'tg-r':'tg-g'}">${v>=0?'+':''}${fmt(v)}</span>`};
    const tRM=r.tWire+r.tBoat;
    const tConvC=r.tWaste+0+r.tManpower+r.tPower+r.tCons+r.indirectExpense;
    const tTotal=tRM+tConvC;
    const tTotalWP=tTotal+r.packingFreight;
    // Weighted targets from BOM × production mix
    const wt=d.wt||{};
    const wtRM=(wt.wireCost||r.tWire)+(wt.boatCost||r.tBoat);
    const wtConvC=r.tWaste+0+r.tManpower+r.tPower+r.tCons+r.indirectExpense;
    const wtTotal=wtRM+wtConvC;
    const wtTotalWP=wtTotal+r.packingFreight;
    const hasMix=wt.matched>0;
    return `<table class="tb" style="font-size:11px">
      <thead><tr style="font-size:11px"><th>Component</th><th class="n">Actual</th><th class="n" style="cursor:pointer;color:var(--pp)" onclick="document.getElementById('eqvDetail').style.display=document.getElementById('eqvDetail').style.display==='none'?'block':'none'">Eqv. ▾</th><th class="n">Target<br><span style="font-size:8px;color:var(--tx3)">(12µ 2.2) ${rates.targetDate||''}</span></th>${hasMix?'<th class="n">W.Tgt<br><span style="font-size:8px;color:var(--pp)">(mix)</span></th>':''}
      <th class="n">Var</th></tr></thead><tbody>
      <tr><td>Wire (${fmt(d.wireKgsTotal||0,0)} Kg)</td><td class="n">${fmt(d.wireCKg)}</td><td class="n">${fmt(e.wire)}</td><td class="n">${fmt(r.tWire)}</td>${hasMix?'<td class="n" style="color:var(--pp);cursor:pointer" onclick="document.getElementById(\'mixDetail\').style.display=document.getElementById(\'mixDetail\').style.display===\'none\'?\'block\':\'none\'">'+fmt(wt.wireCost)+'</td>':''}<td class="n">${tg(d.wireCKg,hasMix?wt.wireCost:r.tWire)}</td></tr>
      <tr><td>Boat (${fmt(d.boatPcsTotal||0,0)} Pcs)</td><td class="n">${fmt(d.boatCKg)}</td><td class="n">${fmt(e.boat)}</td><td class="n">${fmt(r.tBoat)}</td>${hasMix?'<td class="n" style="color:var(--pp)">'+fmt(wt.boatCost)+'</td>':''}<td class="n">${tg(d.boatCKg,hasMix?wt.boatCost:r.tBoat)}</td></tr>
      <tr class="st"><td>Raw material</td><td class="n">${fmt(d.rmC)}</td><td class="n">${fmt(e.rm)}</td><td class="n">${fmt(tRM)}</td>${hasMix?'<td class="n" style="color:var(--pp);font-weight:700">'+fmt(wtRM)+'</td>':''}<td class="n">${tg(d.rmC,hasMix?wtRM:tRM)}</td></tr>
      <tr><td>Wastage loss<br><span style="font-size:9px;color:var(--tx3)">Bare ${fmt(d.bareWastePct,2)}% · Met ${fmt(d.metWastePct,2)}%</span></td><td class="n">${fmt(d.wasteLoss)}<br><span style="font-size:9px;color:var(--tx3)">${fmt(d.bareLossComponent||0,2)}+${fmt(d.metLossComponent||0,2)}</span></td><td class="n">${fmt(e.wasteLoss)}</td><td class="n">${fmt(r.tWaste)}</td>${hasMix?'<td class="n">'+fmt(r.tWaste)+'</td>':''}<td class="n">${tg(d.wasteLoss,r.tWaste)}</td></tr>
      <tr><td>B-grade loss</td><td class="n">${fmt(d.bGradeLoss)}</td><td class="n">${fmt(e.bGradeLoss)}</td><td class="n">0.00</td>${hasMix?'<td class="n">0.00</td>':''}<td class="n">${tg(d.bGradeLoss,0)}</td></tr>
      <tr><td>Manpower</td><td class="n">${fmt(d.mpKg)}</td><td class="n">${fmt(e.mp)}</td><td class="n">${fmt(r.tManpower)}</td>${hasMix?'<td class="n">'+fmt(r.tManpower)+'</td>':''}<td class="n">${tg(d.mpKg,r.tManpower)}</td></tr>
      <tr><td>Power</td><td class="n">${fmt(d.pwrKg)}</td><td class="n">${fmt(e.pwr)}</td><td class="n">${fmt(r.tPower)}</td>${hasMix?'<td class="n">'+fmt(r.tPower)+'</td>':''}<td class="n">${tg(d.pwrKg,r.tPower)}</td></tr>
      <tr><td>Cons & spares</td><td class="n">${fmt(d.consKg)}</td><td class="n">${fmt(e.cons)}</td><td class="n">${fmt(r.tCons)}</td>${hasMix?'<td class="n">'+fmt(r.tCons)+'</td>':''}<td class="n">${tg(d.consKg,r.tCons)}</td></tr>
      <tr><td>Indirect</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense)}</td>${hasMix?'<td class="n">'+fmt(r.indirectExpense)+'</td>':''}<td class="n"><span class="tg tg-g">+0.00</span></td></tr>
      <tr class="st"><td>Conversion cost</td><td class="n">${fmt(d.convC)}</td><td class="n">${fmt(e.convC)}</td><td class="n">${fmt(tConvC)}</td>${hasMix?'<td class="n" style="color:var(--pp)">'+fmt(wtConvC)+'</td>':''}<td class="n">${tg(d.convC,hasMix?wtConvC:tConvC)}</td></tr>
      <tr class="tt"><td>Total cost</td><td class="n">₹${fmt(d.totalC)}</td><td class="n">₹${fmt(e.totalC)}</td><td class="n">₹${fmt(tTotal)}</td>${hasMix?'<td class="n" style="color:var(--pp);font-weight:700">₹'+fmt(wtTotal)+'</td>':''}<td class="n">${tg(d.totalC,hasMix?wtTotal:tTotal)}</td></tr>
      <tr><td>+ Packing+Freight</td><td class="n">${fmt(r.packingFreight)}</td><td class="n">${fmt(r.packingFreight)}</td><td class="n">${fmt(r.packingFreight)}</td>${hasMix?'<td class="n">'+fmt(r.packingFreight)+'</td>':''}<td class="n"></td></tr>
      <tr class="tt"><td>Total with P+F</td><td class="n">₹${fmt(d.totalWP)}</td><td class="n">₹${fmt(e.totalWP)}</td><td class="n">₹${fmt(tTotalWP)}</td>${hasMix?'<td class="n" style="color:var(--pp);font-weight:700">₹'+fmt(wtTotalWP)+'</td>':''}<td class="n">${tg(d.totalWP,hasMix?wtTotalWP:tTotalWP)}</td></tr>
      <tr style="color:var(--gn)"><td>− Scrap Al Wire (3SC-ALWW)</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n"></td>${hasMix?'<td class="n"></td>':''}<td class="n"></td></tr>
      <tr style="color:var(--gn)"><td>− Al Dust (3SC-AD)</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n"></td>${hasMix?'<td class="n"></td>':''}<td class="n"></td></tr>
      <tr class="tt"><td>Net cost after scrap</td><td class="n">₹${fmt(d.totalAfterScrap)}</td><td class="n">₹${fmt(e.totalAfterScrap)}</td><td class="n"></td>${hasMix?'<td class="n"></td>':''}<td class="n"></td></tr>
    </tbody></table>
    ${hasMix?'<div id="mixDetail" style="display:none;margin-top:8px;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:10px"><div style="font-weight:700;margin-bottom:6px;color:var(--pp)">📦 Material Mix → Weighted Target ('+fmt(wt.matched/1000,1)+' MT matched)</div><table class="tb" style="font-size:10px"><thead><tr><th>Material</th><th class="n">Kg</th><th class="n">%</th><th class="n">Wire Kg/MT</th><th class="n">Boat Pc/MT</th></tr></thead><tbody>'+wt.breakdown.map(m=>'<tr><td>'+m.code+'</td><td class="n">'+fmt(m.kg,0)+'</td><td class="n">'+fmt(m.pct,1)+'%</td><td class="n">'+fmt(m.wirePerMT,1)+'</td><td class="n">'+fmt(m.boatPerMT,1)+'</td></tr>').join('')+'<tr class="st"><td>Weighted Avg</td><td class="n">'+fmt(wt.matched,0)+'</td><td class="n">100%</td><td class="n" style="color:var(--pp);font-weight:700">'+fmt(wt.wirePerMT,2)+' Kg/MT</td><td class="n" style="color:var(--pp);font-weight:700">'+fmt(wt.boatPerMT,2)+' Pcs/MT</td></tr></tbody></table></div>':''}
    <div id="eqvDetail" style="display:none;margin-top:8px;background:var(--sf);border:1px solid rgba(168,85,247,.2);border-radius:8px;padding:10px;font-size:10px">
      <div style="font-weight:700;margin-bottom:6px;color:var(--pp)">📐 Equivalent Cost Formula</div>
      <table class="tb" style="font-size:10px">
        <tr><td>Effective Production</td><td class="n" style="font-weight:700">${fmt(d.effectiveProd,0)} Kg (${fmt(d.prodMT,1)} MT)</td></tr>
        <tr><td>Equivalent Output</td><td class="n" style="font-weight:700;color:var(--pp)">${fmt(d.equivKg,0)} Kg (${fmt(d.equivKg/1000,1)} MT)</td></tr>
        <tr><td>Eq Ratio (Prod ÷ Equiv)</td><td class="n">${fmt(e.ratio||1,4)}</td></tr>
        <tr><td>Avg OD Factor</td><td class="n">${fmt(d.odEq?d.odEq.avgODfactor:1,4)}</td></tr>
        <tr><td>Avg Mic Factor</td><td class="n">${fmt(d.odEq?d.odEq.avgMicFactor:1,4)}</td></tr>
        <tr><td>Eq Factor = 1/(MicF × ODF)</td><td class="n">${fmt(e.eqFactor||1,4)}</td></tr>
      </table>
      <div style="font-weight:700;margin:8px 0 4px;color:#3b82f6">Wire Equivalent</div>
      <table class="tb" style="font-size:10px">
        <tr><td>Actual Wire consumed</td><td class="n">${fmt(d.wireKgsTotal,0)} Kg = ${fmt(d.wireKgsTotal/d.prodMT,1)} Kg/MT</td></tr>
        <tr><td>Eqv. Wire Kg/MT</td><td class="n" style="font-weight:700;color:var(--pp)">${fmt(e.eqWireKgMT||0,2)} Kg/MT</td></tr>
        <tr><td>Eqv. Wire ₹/Kg</td><td class="n">= ${fmt(e.eqWireKgMT||0,2)} × ₹${rates.wireRate} / 1000 = <b>₹${fmt(e.wire,2)}</b></td></tr>
      </table>
      <div style="font-weight:700;margin:8px 0 4px;color:#f59e0b">Boat Equivalent</div>
      <table class="tb" style="font-size:10px">
        <tr><td>Actual Boat consumed</td><td class="n">${fmt(d.boatPcsTotal,0)} Pcs = ${fmt(d.boatPcsTotal/d.prodMT,1)} Pcs/MT</td></tr>
        <tr><td>Eqv. Boat Pcs/MT</td><td class="n" style="font-weight:700;color:var(--pp)">${fmt(e.eqBoatPcMT||0,2)} Pcs/MT</td></tr>
        <tr><td>Eqv. Boat ₹/Kg</td><td class="n">= ${fmt(e.eqBoatPcMT||0,2)} × ₹${fmt(d.boatRate||rates.boatRate,0)} / 1000 = <b>₹${fmt(e.boat,2)}</b></td></tr>
      </table>
      <div style="font-weight:700;margin:8px 0 4px;color:#10b981">Other Equivalents (× ratio ${fmt(e.ratio||1,3)})</div>
      <table class="tb" style="font-size:10px">
        <tr><td>Manpower</td><td class="n">${fmt(d.mpKg,2)} × ${fmt(e.ratio||1,3)} = <b>₹${fmt(e.mp,2)}</b></td></tr>
        <tr><td>Power</td><td class="n">${fmt(d.pwrKg,2)} × ${fmt(e.ratio||1,3)} = <b>₹${fmt(e.pwr,2)}</b></td></tr>
        <tr><td>Cons & Spares</td><td class="n">${fmt(d.consKg,2)} × ${fmt(e.ratio||1,3)} = <b>₹${fmt(e.cons,2)}</b></td></tr>
      </table>
    </div>`;
  }

  // Helper: save button + download image button
  function saveBtn(d){
    if(!d)return'';
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <button class="btn bp" onclick="downloadCostImage()" style="font-size:11px">📷 Download as Image</button>
    </div>`;
  }

  // Helper: history cards
  function historySection(){
    if(!allMonths.length) return '<div style="text-align:center;padding:20px;color:var(--tx3);font-size:13px">No months computed yet. Upload Excel files to auto-calculate all months.</div>';
    let html='';
    allMonths.forEach(m=>{
      const d=savedMonths[m];
      const isActive=m===selMonth;
      html+=`<div style="background:var(--sf);border:1px solid ${isActive?'var(--ac)':'var(--bd)'};border-radius:var(--r);padding:12px;margin-bottom:8px;${isActive?'border-left:3px solid var(--ac)':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:14px;font-weight:700">${monthLabel(m)}</div>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="btn bo" style="padding:4px 10px;font-size:10px" onclick="selMonth='${m}';document.getElementById('monthSel').value='${m}';tab='cost';render()">View</button>
            <button style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px" onclick="if(confirm('Delete ${monthLabel(m)}?'))deleteSavedMonth('${m}')">×</button>
          </div>

          <div><div style="color:var(--tx3);font-size:9px;text-transform:uppercase">Total cost</div><div style="font-weight:700;font-family:var(--mn);color:${d.totalC>10.84?'var(--rd)':'var(--gn)'}">₹${fmt(d.totalC)}</div></div>
          <div><div style="color:var(--tx3);font-size:9px;text-transform:uppercase">Waste %</div><div style="font-weight:700;font-family:var(--mn);color:${d.wastePct>1?'var(--am)':'var(--gn)'}">${fmt(d.wastePct,2)}%</div></div>
          <div><div style="color:var(--tx3);font-size:9px;text-transform:uppercase">With pkg</div><div style="font-weight:700;font-family:var(--mn)">₹${fmt(d.totalWP)}</div></div>
        </div>
      </div>`;

  if(tab==='dash'){
    // Show last compute summary if just uploaded
    let computeMsg='';
    if(lastComputeResult&&lastComputeResult.computed>0){
      computeMsg=`<div style="background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.3);border-radius:var(--r);padding:10px 14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--gn);font-size:16px">✓</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--gn)">Auto-computed ${lastComputeResult.computed} months</div>
          <div style="font-size:11px;color:var(--tx2)">${lastComputeResult.months.map(m=>monthLabel(m)).join(' · ')}</div></div>
          <button id="saveCloudBtn" onclick="saveToStorage();saveAllSettings();this.innerHTML='✓ Synced to Cloud';this.style.color='var(--gn)';this.style.borderColor='var(--gn)'" style="padding:6px 14px;border-radius:8px;border:1.5px solid var(--ac);background:rgba(15,82,186,.08);color:var(--ac);font-size:11px;font-weight:700;cursor:pointer;font-family:var(--fn);white-space:nowrap">☁️ Sync All to Cloud (${Object.keys(savedMonths).length} months)</button>
        </div>
      </div>`;
    }
    ct.innerHTML=`${computeMsg}
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:15px;font-weight:700">${monthLabel(selMonth)}</div>
        ${c?'<span class="tg tg-g" style="font-size:9px">Computed</span>':''}
      </div>
      <div class="mg">
        <div class="mc" style="border-left-color:${c?'var(--ac)':'var(--tx3)'}"><div class="ml">Production</div><div class="mv">${c?fmt(c.prodMT,1)+' MT':'—'}</div><div class="ms">Slit output</div></div>
        <div class="mc" style="border-left-color:${c&&c.totalC>12?'var(--rd)':'var(--gn)'}"><div class="ml">Conv. cost</div><div class="mv">${c?'₹'+fmt(c.totalC):'—'}</div><div class="ms">per Kg</div></div>
        <div class="mc" style="border-left-color:${c&&c.bareWastePct>2?'var(--rd)':'var(--gn)'}"><div class="ml">Bare waste</div><div class="mv">${c?fmt(c.bareWastePct,2)+'%':'—'}</div><div class="ms">${c?fmt(c.bareWasteKg,0)+' Kg':'—'}</div></div>
        <div class="mc" style="border-left-color:${c&&c.metWastePct>2?'var(--am)':'var(--gn)'}"><div class="ml">Met waste</div><div class="mv">${c?fmt(c.metWastePct,2)+'%':'—'}</div><div class="ms">${c?fmt(c.metWasteKg,0)+' Kg (inc. Gr6)':'—'}</div></div>
        <div class="mc" style="border-left-color:var(--pp)"><div class="ml">Total+P&F</div><div class="mv">${c?'₹'+fmt(c.totalWP):'—'}</div><div class="ms">with packing+freight</div></div>
        <div class="mc" style="border-left-color:var(--tl)"><div class="ml">Net (after scrap)</div><div class="mv">${c?'₹'+fmt(c.totalAfterScrap):'—'}</div><div class="ms">−₹${c?fmt(c.scrapWireSale+c.scrapDustSale):'0'} scrap</div></div>
      </div>
      ${c?`<div class="mg">
        <div class="mc" style="border-left-color:#0ea5e9"><div class="ml">Export</div><div class="mv">${fmt((c.exportKg||0)/1000,1)} MT</div><div class="ms">${c.effectiveProd>0?fmt(c.exportKg/c.effectiveProd*100,1):0}% of production</div></div>
        <div class="mc" style="border-left-color:#f59e0b"><div class="ml">Heat Seal (SLC/LC)</div><div class="mv">${fmt((c.heatSealKg||0)/1000,1)} MT</div><div class="ms">${c.effectiveProd>0?fmt(c.heatSealKg/c.effectiveProd*100,1):0}% of production</div></div>
      </div>`:''}
      ${!c&&!hasData?'<div class="cd"><div class="nd"><p>Upload your SAP Excel files</p><p style="font-size:11px;margin-top:4px;color:var(--tx3)">All months in the data will be auto-computed</p></div></div>':''}
      ${c?'<div class="cd"><div class="ct2">Cost breakdown — '+monthLabel(selMonth)+'</div><div class="sx">'+costTable(c,true)+'</div></div>':''}

      ${c&&c.pl&&c.pl.revenue>0?(()=>{

        const _totalProdCost=c.totalC*_ep;

          <div class="mc" style="border-left-color:#f87171"><div class="ml">Production cost</div><div class="mv">₹${fmt((_totalProdCost+_packCost)/100000,1)}L</div><div class="ms">₹${fmt(c.totalWP)}/Kg × ${fmt(c.prodMT,0)} MT</div></div>
          <div class="mc" style="border-left-color:${_profit>=0?'#22c55e':'#ef4444'}"><div class="ml">${_profit>=0?'Profit':'Loss'}</div><div class="mv" style="color:${_profit>=0?'#22c55e':'#ef4444'}">₹${fmt(Math.abs(_profit)/100000,1)}L</div><div class="ms">${c.pl.matched>0?fmt(c.pl.matched/_ep*100,0)+'% SP matched':'Set selling prices in Targets tab'}</div></div>
        </div>
        <div class="sx"><table class="tb" style="font-size:11px">
          <tr><td>Total revenue</td><td class="n" style="color:#22c55e;font-weight:700">₹${fmt(c.pl.revenue,0)}</td><td class="n">${fmt(c.pl.revenue/_ep,2)} ₹/Kg</td></tr>

        <div style="font-size:11px;color:var(--tx2);padding:6px 0;border-top:1px solid var(--bd)">
          ${(()=>{
            const m1d=getRunDayOvr(selMonth,'m1',c.runDays?c.runDays.m1:0);
            const m2d=getRunDayOvr(selMonth,'m2',c.runDays?c.runDays.m2:0);
            const avgD=(m1d+m2d)/2;
            const totalD=c.runDays?c.runDays.total:28;
            const ratio=avgD/totalD;
            const adjusted=Math.round((c.mpTotalFull||0)*ratio);
            const mpPerKg=c.effectiveProd>0?adjusted/c.effectiveProd:0;
            return `Full salary: ₹${fmt(c.mpTotalFull||0,0)} × ${fmt(avgD,1)}/${totalD} days = <b style="color:var(--ac)">₹${fmt(adjusted,0)} charged</b> (₹${fmt(mpPerKg,2)}/Kg)
            ${ratio<1?'<br><span style="color:var(--gn)">↓ Saved ₹'+fmt((c.mpTotalFull||0)-adjusted,0)+' — stoppage excluded</span>':''}`;

        <tr style="background:var(--pp2)"><td style="color:var(--pp);font-weight:700">Equivalent output (ZSLIT BA)</td><td class="n" style="color:var(--pp);font-weight:700">${fmt(c.equivKg||0,0)} Kg (${fmt((c.equivKg||0)/1000,2)} MT) · ×${fmt(c.eqRatio||0,3)}</td></tr>

        <tr><td style="padding-left:16px;font-size:11px;color:#f59e0b">Met loss: ${fmt(c.adjustedMetPct||0,2)}% × ₹${rates.baseFilmRate+(rates.metWasteAddon||5)} / 100</td><td class="n" style="font-size:11px;color:#f59e0b">₹${fmt(c.metLossComponent||0,3)}</td></tr>

      ${insights}
      ${(()=>{
        // P&L section — Revenue vs Cost
        const za=c.zsAgg;
        if(!za||!za.revenue) return '<div class="cd" style="border-left:3px solid #a855f7"><div class="ct2" style="color:#a855f7">💰 Revenue & P/L</div><div style="font-size:11px;color:var(--tx3);padding:8px 0">Set selling prices in Targets tab → BOM table → Sell ₹/Kg column. Then re-upload files.</div></div>';
        const convCostTotal=c.effectiveProd*(c.totalWP||0);
        const scrapRev=(c.scrapWireSale||0)*c.effectiveProd+(c.scrapDustSale||0)*c.effectiveProd;
        const totalCost=za.baseFilmCost+convCostTotal;
        const totalRev=za.revenue;
        const grossProfit=totalRev-totalCost+scrapRev;
        const margin=totalRev>0?grossProfit/totalRev*100:0;
        const matchPct=c.effectiveProd>0?za.revenueMatched/c.effectiveProd*100:0;
        return `<div class="cd" style="border-left:3px solid #a855f7">
          <div class="ct2" style="color:#a855f7">💰 Revenue & Profit/Loss — ${monthLabel(selMonth)}</div>
          ${matchPct<90?'<div style="font-size:10px;color:var(--am);background:var(--am2);padding:4px 8px;border-radius:6px;margin-bottom:8px">⚠️ Only '+fmt(matchPct,0)+'% of production has sell price set. Complete BOM sell prices in Targets tab.</div>':''}

            <div class="mc" style="border-left-color:#22c55e"><div class="ml">Revenue</div><div class="mv" style="color:#22c55e">₹${fmt(totalRev/100000,1)}L</div><div class="ms">A: ₹${fmt(za.aGradeRevenue/100000,1)}L · B: ₹${fmt(za.bGradeRevenue/100000,1)}L</div></div>
            <div class="mc" style="border-left-color:#ef4444"><div class="ml">Total Cost</div><div class="mv" style="color:#ef4444">₹${fmt(totalCost/100000,1)}L</div><div class="ms">Film: ₹${fmt(za.baseFilmCost/100000,1)}L · Conv: ₹${fmt(convCostTotal/100000,1)}L</div></div>
            <div class="mc" style="border-left-color:${grossProfit>=0?'#22c55e':'#ef4444'}"><div class="ml">${grossProfit>=0?'Profit':'Loss'}</div><div class="mv" style="color:${grossProfit>=0?'#22c55e':'#ef4444'}">₹${fmt(Math.abs(grossProfit)/100000,1)}L</div><div class="ms">Margin: ${fmt(margin,1)}% · Scrap: ₹${fmt(scrapRev/100000,2)}L</div></div>
          </div>
          <div class="sx"><table class="tb" style="font-size:11px">
            <tr><td>A-grade revenue (Gr 2,7,8)</td><td class="n" style="color:#22c55e">₹${fmt(za.aGradeRevenue,0)}</td><td class="n">${fmt(c.slitAKg,0)} Kg</td></tr>
            <tr><td>B-grade revenue (Gr 3, sell−₹10)</td><td class="n" style="color:#86efac">₹${fmt(za.bGradeRevenue,0)}</td><td class="n">${fmt(c.slitBKg,0)} Kg</td></tr>
            <tr class="st"><td>Total Revenue</td><td class="n" style="font-weight:700;color:#22c55e">₹${fmt(totalRev,0)}</td><td class="n">${fmt(za.revenueMatched,0)} Kg matched</td></tr>
            <tr><td>Base film cost (BOM × ₹${rates.baseFilmRate}/Kg)</td><td class="n" style="color:#ef4444">₹${fmt(za.baseFilmCost,0)}</td></tr>
            <tr><td>Conversion cost (${fmt(c.prodMT,1)}MT × ₹${fmt(c.totalWP)}/Kg)</td><td class="n" style="color:#ef4444">₹${fmt(convCostTotal,0)}</td></tr>
            <tr class="st"><td>Total Cost</td><td class="n" style="font-weight:700;color:#ef4444">₹${fmt(totalCost,0)}</td></tr>
