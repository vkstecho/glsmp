            <tr class="tt"><td style="font-weight:800;font-size:13px">${grossProfit>=0?'PROFIT':'LOSS'}</td><td class="n" style="font-weight:800;font-size:13px;color:${grossProfit>=0?'#22c55e':'#ef4444'}">₹${fmt(Math.abs(grossProfit),0)} (${fmt(margin,1)}%)</td></tr>
          </table></div>
        </div>`;
      })()}
      ${(()=>{
        // Multi-month P&L comparison
        const plMonths=allMonths.filter(m=>savedMonths[m]&&savedMonths[m].zsAgg&&savedMonths[m].zsAgg.revenue>0);
        if(plMonths.length<2) return '';
        return `<div class="cd" style="border-left:3px solid #8b5cf6"><div class="ct2" style="color:#8b5cf6">📊 P/L Comparison — All Months</div>
          <div class="sx"><table class="tb" style="font-size:10px">
          <thead><tr><th>Month</th><th class="n">Prod MT</th><th class="n" style="color:#22c55e">Revenue</th><th class="n" style="color:#ef4444">Cost</th><th class="n" style="color:#a855f7">Profit</th><th class="n">Margin</th></tr></thead><tbody>
          ${plMonths.map(m=>{
            const d=savedMonths[m],za=d.zsAgg;
            const conv=d.effectiveProd*(d.totalWP||0);
            const cost=za.baseFilmCost+conv;
            const rev=za.revenue;
            const profit=rev-cost;
            const mg=rev>0?profit/rev*100:0;
            const isThis=m===selMonth;
            return '<tr style="'+(isThis?'background:var(--ac2);font-weight:700':'')+'"><td'+(isThis?' style="color:var(--ac)"':'')+'>'
              +monthLabel(m)+'</td><td class="n">'+fmt(d.prodMT,0)+'</td>'
              +'<td class="n" style="color:#22c55e">₹'+fmt(rev/100000,1)+'L</td>'
              +'<td class="n" style="color:#ef4444">₹'+fmt(cost/100000,1)+'L</td>'
              +'<td class="n" style="color:'+(profit>=0?'#22c55e':'#ef4444')+'">₹'+fmt(Math.abs(profit)/100000,1)+'L</td>'
              +'<td class="n" style="color:'+(mg>5?'#22c55e':mg>0?'#fbbf24':'#ef4444')+'">'+fmt(mg,1)+'%</td></tr>';
          }).join('')}
          ${(()=>{
            const totals=plMonths.reduce((s,m)=>{const d=savedMonths[m],za=d.zsAgg;const conv=d.effectiveProd*(d.totalWP||0);s.rev+=za.revenue;s.cost+=za.baseFilmCost+conv;s.prod+=d.prodMT||0;return s},{rev:0,cost:0,prod:0});
            return '<tr class="tt"><td>TOTAL ('+plMonths.length+' months)</td><td class="n">'+fmt(totals.prod,0)+'</td><td class="n" style="color:#22c55e">₹'+fmt(totals.rev/100000,1)+'L</td><td class="n" style="color:#ef4444">₹'+fmt(totals.cost/100000,1)+'L</td><td class="n" style="color:'+(totals.rev-totals.cost>=0?'#22c55e':'#ef4444')+'">₹'+fmt(Math.abs(totals.rev-totals.cost)/100000,1)+'L</td><td class="n">'+fmt(totals.rev>0?(totals.rev-totals.cost)/totals.rev*100:0,1)+'%</td></tr>';
          })()}
          </tbody></table></div></div>`;
      })()}
      ${compHtml}
      ${allMonths.length>=2?`<div class="cd"><div class="ct2" style="display:flex;align-items:center;justify-content:space-between">📈 Cost trends <span style="font-size:10px;color:var(--tx3);font-weight:400">Tap any metric to view</span></div>

            const tgt=mt.target?rates[mt.target]:0;
            const isOver=tgt>0&&v>tgt;
            return `<button onclick="openTrend('${mt.key}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sf);border:1.5px solid ${isOver?'rgba(239,68,68,.3)':'var(--bd)'};border-radius:10px;cursor:pointer;font-family:var(--fn);text-align:left">
              <div><div style="font-size:10px;font-weight:700;color:${mt.color}">${mt.label}</div><div style="font-size:16px;font-weight:800;color:${isOver?'#ef4444':'var(--tx)'}">${v>=100?Math.round(v):v.toFixed(2)}</div></div>
              <div style="font-size:16px;color:var(--tx3)">›</div>
            </button>`;
          }).join('')}
        </div>
      </div>`:''}`;

  else if(tab==='waste'){
    if(!c){ct.innerHTML='<div class="cd"><div class="nd"><p>Upload production data</p></div></div>';return}
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:12px">Wastage tracking</div>
      <div class="mg">
        <div class="mc" style="border-left-color:${c.bareWastePct>1.5?'var(--rd)':'var(--gn)'}"><div class="ml">Bare waste (3SC-TW)</div><div class="mv">${fmt(c.bareWastePct,2)}%</div><div class="ms">÷ Base film input</div></div>
        <div class="mc" style="border-left-color:${c.metWastePct>1.5?'var(--am)':'var(--gn)'}"><div class="ml">Met waste (MSW+MTW+Gr6)</div><div class="mv">${fmt(c.metWastePct,2)}%</div><div class="ms">÷ Slit production</div></div>
        <div class="mc" style="border-left-color:${c.bGradePct>0.5?'var(--am)':'var(--gn)'}"><div class="ml">B-grade (Gr 3)</div><div class="mv">${fmt(c.bGradePct,2)}%</div><div class="ms">÷ Effective prod</div></div>
      </div>

      <div class="cd"><div class="ct2">Wastage vs target</div>
        ${[
          {l:'Bare waste %',a:c.bareWastePct,t:1.0},
          {l:'Met waste %',a:c.metWastePct,t:1.0},
          {l:'B-grade %',a:c.bGradePct,t:0.5}
        ].map(w=>`
          <div class="wb"><div class="wl"><span>${w.l}</span><span>${fmt(w.a,2)}% / ${w.t}% target</span></div>
          <div class="wt"><div class="wf" style="width:${Math.min(w.a/w.t/2*100,100)}%;background:${w.a>w.t?'var(--rd)':'var(--gn)'}"></div></div></div>`).join('')}
      </div>

      <div class="cd"><div class="ct2">Waste breakdown</div><div class="sx"><table class="tb">
        <thead><tr><th>Type</th><th class="n">Kg</th><th class="n">%</th><th class="n">Loss ₹/Kg</th></tr></thead><tbody>
        <tr><td>Bare waste (3SC-TW)</td><td class="n">${fmt(c.bareWasteKg||0,0)}</td><td class="n">${fmt(c.bareWastePct,2)}%</td><td class="n">${fmt(c.bareLossComponent||0,2)}</td></tr>
        <tr><td>Met waste (MSW+MTW+Gr6)</td><td class="n">${fmt(c.metWasteKg||0,0)}</td><td class="n">${fmt(c.metWastePct,2)}%</td><td class="n">${fmt(c.metLossComponent||0,2)}</td></tr>
        <tr class="st"><td>Total waste loss</td><td class="n">${fmt((c.bareWasteKg||0)+(c.metWasteKg||0),0)}</td><td class="n"></td><td class="n" style="font-weight:700;color:var(--rd)">₹${fmt(c.wasteLoss,2)}/Kg</td></tr>
        <tr><td>B-grade (Gr 3)</td><td class="n">${fmt(c.slitBKg,0)}</td><td class="n">${fmt(c.bGradePct,2)}%</td><td class="n">${fmt(c.bGradeLoss,2)}</td></tr>
      </tbody></table></div></div>

      <div class="cd"><div class="ct2">Waste formula detail</div><div class="sx"><table class="tb" style="font-size:11px">
        <tr><td>Base film input (3FG 261/262)</td><td class="n">${fmt(c.bareIn||0,0)} Kg</td></tr>
        <tr><td>Met output (3SF 101/102)</td><td class="n">${fmt(c.bareOut||0,0)} Kg</td></tr>
        <tr><td>I-O % = (input−output)/input</td><td class="n">${fmt(c.ioPct||0,2)}%</td></tr>
        <tr><td>Weight gain = bare% − I-O%</td><td class="n">${fmt(c.weightGainPct||0,2)}%</td></tr>
        <tr><td>Adjusted Met % = met% − weightGain</td><td class="n" style="font-weight:700">${fmt(c.adjustedMetPct||0,2)}%</td></tr>
        <tr style="color:#3b82f6"><td>Bare loss = ${fmt(c.bareWastePct||0,2)}% × 50% × ₹${rates.baseFilmRate} / 100</td><td class="n" style="font-weight:700">₹${fmt(c.bareLossComponent||0,3)}</td></tr>
        <tr style="color:#f59e0b"><td>Met loss = ${fmt(c.adjustedMetPct||0,2)}% × ₹${rates.baseFilmRate+5} / 100</td><td class="n" style="font-weight:700">₹${fmt(c.metLossComponent||0,3)}</td></tr>
        <tr class="tt" style="color:var(--rd)"><td>Total waste loss</td><td class="n" style="font-weight:800">₹${fmt(c.wasteLoss,2)}/Kg</td></tr>
      </table></div></div>`;
  }

  else if(tab==='emp'){
    const mp=manpowerData[selMonth];
    if(!mp||!mp.perEmployee){ct.innerHTML=`<div class="cd"><div class="nd"><p>Manpower data not yet received from MET Power</p>
      <button class="btn bp" onclick="requestManpower()" style="margin-top:10px;font-size:11px">🔄 Request from MET Power</button>
      <p style="font-size:10px;color:var(--tx3);margin-top:6px">Make sure MetCost Pro is opened from MR Skill hub inside the parent app</p></div></div>`;return}
    const emps=mp.perEmployee.sort((a,b)=>b.netSalary-a.netSalary);

    // ═══ TEAM PERFORMANCE: Map ZJUMBO rolls + ZSLIT output to workers ═══
    const perf={}; // empId → {rolls, eqRolls, outputKg, days, section}
    emps.forEach(e=>{perf[e.id]={name:e.name,section:e.section,role:e.role||'assist',rolls:0,eqRolls:0,outputKg:0,rollDates:new Set(),slitDates:new Set()}});

    // Metalliser: ZJUMBO rolls → M1/M2 workers by date+shift
    const zjumbo=rawData.zjumbo;
    const zs=rawData.zslit;
    if(zjumbo&&mp.perEmployee.some(e=>e.shifts)){
      const ms=new Date(selMonth+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      const m1Workers=emps.filter(e=>e.section==='M1');
      const m2Workers=emps.filter(e=>e.section==='M2');

      // Group rolls by date+machine+shift
      const rollsByDMS={}; // "2026-02-01_M1_D" → count
      zjumbo.filter(r=>{
        const mvt=String(r['Movment Type']||r['Movement type']||'').trim();
        return mvt==='101'&&inM(r['Date of Production']||r['Date of production']);
      }).forEach(r=>{
        const machine=String(r.Machine||'').trim();
        const sec=machine.includes('M1')?'M1':machine.includes('M2')?'M2':null;
        if(!sec) return;
        const d=parseDate(r['Date of Production']||r['Date of production']);
        if(!d) return;
        const dateStr=d.toISOString().slice(0,10);
        // Determine shift from Chamber Open Time
        let shift='D';
        const t=r['Chamber Open Time']||r['Chamber open Time'];
        if(t){
          let h=-1;
          if(t instanceof Date) h=t.getHours();
          else if(typeof t==='number'){const f=t>=1?t-Math.floor(t):t;h=Math.floor(f*24)}
          else if(typeof t==='string'){const p=t.match(/(\\d{1,2}):/);if(p)h=parseInt(p[1])}
          if(h>=19||h<7) shift='N';
        }
        const key=dateStr+'_'+sec+'_'+shift;
        rollsByDMS[key]=(rollsByDMS[key]||0)+1;
      });

      // Distribute rolls to workers
      Object.entries(rollsByDMS).forEach(([key,count])=>{
        const[dateStr,sec,shift]=key.split('_');
        const workers=(sec==='M1'?m1Workers:m2Workers).filter(e=>{
          if(!e.shifts) return false;
          const sh=e.shifts[dateStr];
          return sh===shift;
        });
        if(!workers.length) return;
        const share=count/workers.length;
        const avgODF=c&&c.odEq?c.odEq.avgODfactor:1;
        workers.forEach(w=>{
          if(!perf[w.id]) return;
          perf[w.id].rolls+=share;
          perf[w.id].eqRolls+=share*avgODF;
          perf[w.id].rollDates.add(dateStr);
        });
      });
    }

    // Slitter: ZSLIT output → S1/S2 workers by date+machine
    if(zs&&mp.perEmployee.some(e=>e.shifts)){
      const ms=new Date(selMonth+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      const s1Workers=emps.filter(e=>e.section==='S1');
      const s2Workers=emps.filter(e=>e.section==='S2');

      // Group output by date+machine
      const outByDM={}; // "2026-02-01_S1" → totalKg
      const zsMo=(_indexed.zslit&&_indexed.zslit[selMonth])||zs.filter(r=>inM(r.Date||r['Posting Date']));
      zsMo.filter(r=>{
        const mvt=String(r['Move Type']||'').trim();
        const g=String(r.Grade||'');
        return mvt==='101'&&g!=='5'&&g!=='6';
      }).forEach(r=>{
        const machine=String(r.Machine||'').trim();
        const sec=machine.includes('M1_S')||machine.includes('M1-S')?'S1':
                  machine.includes('M2_S')||machine.includes('M2-S')?'S2':null;
        if(!sec) return;
        const d=parseDate(r.Date||r['Posting Date']);
        if(!d) return;
        const dateStr=d.toISOString().slice(0,10);
        const nw=Number(r['Net Weight']||0);
        const key=dateStr+'_'+sec;
        outByDM[key]=(outByDM[key]||0)+nw;
      });

      // Distribute output to workers equally across D+N shift
      Object.entries(outByDM).forEach(([key,kg])=>{
        const[dateStr,sec]=key.split('_');
        const workers=(sec==='S1'?s1Workers:s2Workers).filter(e=>{
          if(!e.shifts) return false;
          const sh=e.shifts[dateStr];
          return sh==='D'||sh==='N';
        });
        if(!workers.length) return;
        const share=kg/workers.length;
        workers.forEach(w=>{
          if(!perf[w.id]) return;
          perf[w.id].outputKg+=share;
          perf[w.id].slitDates.add(dateStr);
        });
      });
    }

    // Build performance tables
    const metPerf=Object.values(perf).filter(p=>['M1','M2'].includes(p.section)&&(p.rolls>0||p.role==='main'));
    const slitPerf=Object.values(perf).filter(p=>['S1','S2'].includes(p.section)&&(p.outputKg>0||p.role==='main'));
    metPerf.sort((a,b)=>b.rolls-a.rolls);
    slitPerf.sort((a,b)=>b.outputKg-a.outputKg);

    let metHtml='';
    if(metPerf.length){
      const avgRolls=metPerf.reduce((s,p)=>s+p.rolls,0)/metPerf.filter(p=>p.rolls>0).length||0;
      metHtml=`<div class="cd" style="border-left:3px solid #3b82f6"><div class="ct2" style="color:#3b82f6">🧵 Metalliser Performance — ${monthLabel(selMonth)}</div>
        <div class="sx"><table class="tb" style="font-size:12px">
        <thead><tr><th>#</th><th>Name</th><th>Sec</th><th class="n">Rolls</th><th class="n">Eq Rolls</th><th class="n">Roll/Day</th><th class="n">Rating</th></tr></thead><tbody>
        ${metPerf.map((p,i)=>{
          const daysWorked=Math.max(1,p.rollDates?p.rollDates.size:1);
          const rpd=daysWorked>0?p.rolls/daysWorked:0;
          const pct=avgRolls>0?p.rolls/avgRolls*100:0;
          const color=pct>110?'#22c55e':pct>90?'#3b82f6':pct>70?'#f59e0b':'#ef4444';
          return `<tr><td style="font-weight:700">${i+1}</td><td style="font-weight:700">${p.name}</td>
            <td><span class="tg tg-a" style="font-size:9px">${p.section}</span></td>
            <td class="n" style="font-weight:800;color:#3b82f6;font-size:13px">${fmt(p.rolls,0)}</td>
            <td class="n">${fmt(p.eqRolls,0)}</td>
            <td class="n" style="font-weight:600">${fmt(rpd,1)}</td>
            <td class="n"><span style="color:${color};font-weight:800;font-size:13px">${pct>0?fmt(pct,0)+'%':'—'}</span></td></tr>`;
        }).join('')}
        </tbody></table></div></div>`;
    }

    let slitHtml='';
    if(slitPerf.length){
      const avgOut=slitPerf.reduce((s,p)=>s+p.outputKg,0)/slitPerf.filter(p=>p.outputKg>0).length||0;
      slitHtml=`<div class="cd" style="border-left:3px solid #10b981"><div class="ct2" style="color:#10b981">✂️ Slitter Performance — ${monthLabel(selMonth)}</div>
        <div class="sx"><table class="tb" style="font-size:12px">
        <thead><tr><th>#</th><th>Name</th><th>Sec</th><th class="n">Output Kg</th><th class="n">MT</th><th class="n">Kg/Day</th><th class="n">Rating</th></tr></thead><tbody>
        ${slitPerf.map((p,i)=>{
          const daysWorked=Math.max(1,p.slitDates?p.slitDates.size:1);
          const kpd=daysWorked>0?p.outputKg/daysWorked:0;
          const pct=avgOut>0?p.outputKg/avgOut*100:0;
          const color=pct>110?'#22c55e':pct>90?'#10b981':pct>70?'#f59e0b':'#ef4444';
          return `<tr><td style="font-weight:700">${i+1}</td><td style="font-weight:700">${p.name}</td>
            <td><span class="tg tg-a" style="font-size:9px">${p.section}</span></td>
            <td class="n" style="font-weight:800;color:#10b981;font-size:13px">${fmt(p.outputKg,0)}</td>
            <td class="n">${fmt(p.outputKg/1000,1)}</td>
            <td class="n" style="font-weight:600">${fmt(kpd,0)}</td>
            <td class="n"><span style="color:${color};font-weight:800;font-size:13px">${pct>0?fmt(pct,0)+'%':'—'}</span></td></tr>`;
        }).join('')}
        </tbody></table></div></div>`;
    }

    const noShiftData=!mp.perEmployee.some(e=>e.shifts);
    const noProductionData=!rawData.zjumbo&&!rawData.zslit;

    ct.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="font-size:16px;font-weight:700">Team Performance — ${monthLabel(selMonth)}</div>
        <button class="btn bo" onclick="requestManpower()" style="font-size:10px;padding:4px 10px">🔄 Refresh</button>
      </div>
      ${noShiftData?'<div style="font-size:11px;color:var(--am);background:var(--am2);padding:8px 12px;border-radius:8px;margin-bottom:10px">⚠️ Shift schedule not available. Deploy latest parent app (index__16___6_.html) to enable team performance mapping.</div>':''}
      ${noProductionData?'<div style="font-size:11px;color:var(--am);background:var(--am2);padding:8px 12px;border-radius:8px;margin-bottom:10px">⚠️ Upload ZJUMBO + ZSLIT files to see production performance per person.</div>':''}
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">${mp.employeeCount} employees · Shift: Day 7AM-7PM · Night 7PM-7AM</p>

      <div class="mg">
        <div class="mc" style="border-left-color:var(--am)"><div class="ml">Gross salary</div><div class="mv">₹${fmt(mp.totalGross,0)}</div></div>
        <div class="mc" style="border-left-color:var(--rd)"><div class="ml">Deductions</div><div class="mv">₹${fmt(mp.totalDeduct,0)}</div></div>
        <div class="mc" style="border-left-color:var(--gn)"><div class="ml">Net pay</div><div class="mv">₹${fmt(mp.totalNet,0)}</div></div>
        <div class="mc" style="border-left-color:var(--pp)"><div class="ml">₹/Kg</div><div class="mv">${c?'₹'+fmt(c.mpKg):'—'}</div></div>
      </div>

      ${metHtml}
      ${slitHtml}

      <div class="cd" style="border-left:3px solid #f59e0b"><div class="ct2" style="color:#f59e0b">💰 Salary & Attendance</div><div class="sx"><table class="tb" style="font-size:12px">
        <thead><tr><th>#</th><th>Name</th><th>Sec</th><th>Role</th><th class="n">Salary</th><th class="n">Ab</th><th class="n">Net</th></tr></thead><tbody>
        ${emps.map((e,i)=>{
          return `<tr>
          <td style="font-weight:700">${i+1}</td>
          <td style="font-weight:700">${e.name}</td>
          <td><span class="tg tg-a" style="font-size:9px">${e.section}</span></td>
          <td style="font-size:10px;color:var(--tx2);font-weight:600">${e.role||'—'}</td>
          <td class="n" style="font-size:12px">₹${Number(e.monthlySalary).toLocaleString('en-IN')}</td>
          <td class="n">${e.absentDays>0?'<span class="tg tg-r">'+e.absentDays+'</span>':'<span style="color:var(--tx3)">0</span>'}</td>
          <td class="n" style="font-weight:700;font-size:12px;color:#22c55e">₹${Number(e.netSalary).toLocaleString('en-IN')}</td>
        </tr>`}).join('')}
      </tbody></table></div></div>`;
  }

  else if(tab==='target'){
    const filtered=targets.filter(t=>{
      if(!tgtSearch)return true;
      const q=tgtSearch.toLowerCase();
      return t.c.toLowerCase().includes(q)||t.d.toLowerCase().includes(q);
    });

    // 1440 min bifurcation
    const cy=MACHINE_DATA.met1.cycle;
    const oneRoll=cy.setup+cy.vacuum+cy.heating+cy.running+cy.vent;
    const bc=MACHINE_DATA.met1.boatChange;
    const sc=MACHINE_DATA.met1.sourceCleaning;
    const rollsPerDay=Math.floor((1440-bc-sc)/(oneRoll));
    const runMin=rollsPerDay*cy.running;
    const setupMin=rollsPerDay*cy.setup;
    const vacMin=rollsPerDay*(cy.vacuum+cy.heating);
    const ventMin=rollsPerDay*cy.vent;
    const totalUsed=rollsPerDay*oneRoll+bc+sc;
    const idle=1440-totalUsed;

    // 1440 bar segments
    const pcts=[
      {l:'Running',m:runMin,col:'var(--gn)'},
      {l:'Setup',m:setupMin,col:'var(--am)'},
      {l:'Vacuum+Heat',m:vacMin,col:'var(--ac)'},
      {l:'Vent',m:ventMin,col:'var(--tl)'},
      {l:'Boat change',m:bc,col:'var(--pp)'},
      {l:'Source clean',m:sc,col:'var(--rd)'},
      {l:'Idle/buffer',m:idle,col:'var(--bd)'},
    ];

    let barHtml='<div style="display:flex;height:20px;border-radius:6px;overflow:hidden;margin:10px 0">';
    pcts.forEach(p=>{ barHtml+=`<div style="width:${(p.m/1440*100).toFixed(1)}%;background:${p.col}" title="${p.l}: ${p.m} min"></div>`; });
    barHtml+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px">';
    pcts.forEach(p=>{ barHtml+=`<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:${p.col};display:inline-block"></span>${p.l} ${p.m}m</span>`; });
    barHtml+='</div>';

    // Capacity table
    let capHtml='<div class="sx"><table class="tb"><thead><tr><th>Mic</th><th>OD</th><th class="n">M-1 MT</th><th class="n">M-2 MT</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">Waste%</th></tr></thead><tbody>';
    MACHINE_DATA.capacity.forEach(r=>{
      capHtml+=`<tr><td>${r.mic}µ</td><td>${r.od}</td><td class="n">${r.m1}</td><td class="n">${r.m2}</td><td class="n">${r.wire}</td><td class="n">${r.boat}</td><td class="n">${r.waste}%</td></tr>`;
    });
    capHtml+='</tbody></table></div>';

    // BOM table
    let bomHtml='<div class="sx"><table class="tb"><thead><tr><th>Code</th><th>Description</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">+Delta</th><th class="n" style="color:#22c55e">SP ₹/Kg</th><th></th></tr></thead><tbody>';
    filtered.forEach(t=>{
      const sp=rates.baseFilmRate+(t.spDelta||0);
      bomHtml+=`<tr><td style="font-family:var(--mn);font-size:11px;font-weight:600;color:var(--ac)">${t.c}</td><td style="font-size:11px">${t.d}</td><td class="n">${t.w}</td><td class="n">${t.b}</td>
      <td class="n"><input style="width:40px;text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:2px;color:#fbbf24;font-size:11px;font-family:var(--mn);font-weight:700" value="${t.spDelta||0}" onchange="var tgt=targets.find(x=>x.id===${t.id});if(tgt){tgt.spDelta=parseFloat(this.value)||0;saveAllSettings();render()}"></td>
      <td class="n" style="color:#22c55e;font-weight:700;font-size:12px">₹${sp}</td>
      <td><button onclick="removeTarget(${t.id})" style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px">×</button></td></tr>`;
    });
    bomHtml+='</tbody></table></div>';
    bomHtml+='<div style="font-size:10px;color:var(--tx3);margin-top:4px;padding:4px 8px;background:rgba(34,197,94,.06);border-radius:6px">SP = Base Film ₹'+rates.baseFilmRate+' + Delta. Change base in Settings → all SPs auto-update. B-grade sells at SP − ₹10.</div>';

    // Material-wise conversion cost target breakdown
    const mtInput=(k,field,val,w)=>`<input style="width:${w||'42px'};text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:2px;color:var(--tx);font-size:10px;font-family:var(--mn)" value="${typeof val==='number'?fmt(val,2):val}" onchange="MATERIAL_TARGETS['${k}'].${field}=parseFloat(this.value)||0;recalcMatTarget('${k}');saveMatTargets();render()">`;
    let matTgtHtml='<div class="sx"><table class="tb" style="font-size:10px"><thead><tr style="background:#1e293b">';
    matTgtHtml+='<th>Material</th><th class="n">Speed</th><th class="n">Rolls</th><th class="n">MT/Day</th>';
    matTgtHtml+='<th class="n">Wire<br>₹/Kg</th><th class="n">Boat<br>₹/Kg</th><th class="n">Waste<br>₹/Kg</th>';
    matTgtHtml+='<th class="n">Elec<br>₹/Kg</th><th class="n" style="color:#fbbf24">Total<br>₹/Kg</th><th class="n" style="color:#f87171">Grand<br>+P&F</th><th class="n" style="color:#22c55e">Sell<br>₹/Kg</th></tr></thead><tbody>';
    Object.entries(MATERIAL_TARGETS).forEach(([k,t],i)=>{
      const isBase=k==='M22';
      const bg=isBase?'background:rgba(34,197,94,.08);font-weight:700':i%2?'background:rgba(255,255,255,.02)':'';
      matTgtHtml+=`<tr style="${bg}">

function addTarget(){
  const c=document.getElementById('nc').value,d=document.getElementById('nd').value;
  if(!c||!d)return;
  targets.push({id:Date.now(),c,d,w:Number(document.getElementById('nw').value)||0,b:Number(document.getElementById('nb').value)||0,bom:Number(document.getElementById('nbom').value)||1005});
  document.getElementById('addModal').innerHTML='';
  saveAllSettings();
  render();
}
function removeTarget(id){targets=targets.filter(t=>t.id!==id);saveAllSettings();render()}

// Running day overrides per month — saved to localStorage + Firebase
function getRunDayOvr(month,machine,autoVal){
  if(!rates.runDayOverrides) return autoVal;
  const key=month+'_'+machine;
  return rates.runDayOverrides[key]!==undefined?rates.runDayOverrides[key]:autoVal;
}
function setRunDayOvr(month,machine,val){
  if(!rates.runDayOverrides) rates.runDayOverrides={};
  const v=parseFloat(val);
  rates.runDayOverrides[month+'_'+machine]=isNaN(v)?0:v;
  // Recalculate manpower for this month
  const c=savedMonths[month];
  if(c&&c.runDays&&c.mpTotalFull){
    const m1d=getRunDayOvr(month,'m1',c.runDays.m1);
    const m2d=getRunDayOvr(month,'m2',c.runDays.m2);
    const avgD=(m1d+m2d)/2;
    const ratio=avgD/c.runDays.total;
    c.mpTotal=Math.round(c.mpTotalFull*ratio);
    c.mpKg=c.effectiveProd>0?c.mpTotal/c.effectiveProd:0;
    c.runDays.avg=avgD;c.runDays.ratio=ratio;
    // Recalc conversion + total
    c.convC=(c.wasteLoss||0)+(c.bGradeLoss||0)+c.mpKg+(c.pwrKg||0)+(c.consKg||0)+(c.rates||rates).indirectExpense;
    c.totalC=(c.rmC||0)+c.convC;
    c.totalWP=c.totalC+(c.rates||rates).packingFreight;
    c.totalAfterScrap=c.totalWP-(c.scrapWireSale||0)-(c.scrapDustSale||0);
    saveToStorage();
  }
  saveRates();
  render();
}

function showPLComparison(period){
  const all=Object.keys(savedMonths).sort();
  let months=[];
  const now=new Date();
  if(period==='fy'){
    // FY Apr-Mar: if current month >= Apr, FY starts this year Apr, else last year Apr
    const fyStart=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
    months=all.filter(m=>{const[y,mo]=m.split('-').map(Number);return(y===fyStart&&mo>=4)||(y===fyStart+1&&mo<=3)});
  }else if(period==='cy'){
    const cy=now.getFullYear();
    months=all.filter(m=>m.startsWith(cy+'-')||m.startsWith((cy-1)+'-'));
    months=all.filter(m=>m.startsWith(String(now.getFullYear()-1)+'-')||m.startsWith(String(now.getFullYear())+'-'));
    // Actually just last full CY
    months=all.filter(m=>m.startsWith(String(now.getFullYear()-1)+'-'));
  }else if(period==='q4'){
    months=all.slice(-3);
  }else{
    months=all;
  }
  if(!months.length){document.getElementById('plCompare').innerHTML='<div style="font-size:11px;color:var(--tx3)">No data for this period</div>';return}

  let totalRev=0,totalCost=0,totalScrap=0,totalPacking=0,totalProd=0,totalProfit=0;
  let rows='';
  months.forEach(mk=>{
    const d=savedMonths[mk];if(!d||!d.pl) return;
    const rev=d.pl.revenue||0;
    const cost=d.pl.totalProdCost||0;
    const pack=d.pl.packingCost||0;
    const scrap=d.pl.scrapRevenue||0;
    const profit=d.pl.profit||0;
    totalRev+=rev;totalCost+=cost;totalPacking+=pack;totalScrap+=scrap;totalProfit+=profit;totalProd+=(d.prodMT||0);
    const pc=rev>0?profit>=0?'#22c55e':'#ef4444':'var(--tx3)';
    rows+=`<tr><td>${monthLabel(mk)}</td><td class="n">${fmt(d.prodMT,0)}</td>
      <td class="n" style="color:#22c55e">${rev>0?'₹'+fmt(rev/100000,1)+'L':'—'}</td>
      <td class="n" style="color:#f87171">₹${fmt((cost+pack)/100000,1)}L</td>
      <td class="n" style="color:${pc};font-weight:700">${rev>0?'₹'+fmt(Math.abs(profit)/100000,1)+'L':'—'}</td>
      <td class="n" style="color:${pc}">${rev>0?fmt(profit/((d.prodMT||1)*1000),2):'—'}</td></tr>`;
  });
  // Total row
  const tc=totalProfit>=0?'#22c55e':'#ef4444';
  rows+=`<tr class="tt"><td>TOTAL (${months.length} months)</td><td class="n">${fmt(totalProd,0)}</td>
    <td class="n" style="color:#22c55e">${totalRev>0?'₹'+fmt(totalRev/100000,1)+'L':'—'}</td>
    <td class="n" style="color:#f87171">₹${fmt((totalCost+totalPacking)/100000,1)}L</td>
    <td class="n" style="color:${tc};font-weight:800;font-size:13px">${totalRev>0?'₹'+fmt(Math.abs(totalProfit)/100000,1)+'L':'—'}</td>
    <td class="n" style="color:${tc}">${totalRev>0?fmt(totalProfit/(totalProd*1000),2):'—'}</td></tr>`;

  document.getElementById('plCompare').innerHTML=`<div class="sx"><table class="tb" style="font-size:11px">
    <thead><tr><th>Month</th><th class="n">MT</th><th class="n">Revenue</th><th class="n">Cost</th><th class="n">P&L</th><th class="n">₹/Kg</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${totalRev===0?'<div style="font-size:10px;color:var(--am);margin-top:6px">⚠️ Set selling prices in Targets → BOM → SP ₹/Kg column</div>':''}`;
}

async function sendAI(){
  const inp=document.getElementById('aiInput');
  const q=inp.value.trim();
  if(!q) return;
  inp.value='';
  aiChat.push({role:'user',text:q});
  aiChat.push({role:'assistant',text:'⏳ Analyzing '+Object.keys(savedMonths).length+' months of data...'});
  renderAIChat();

  // Build DETAILED context from all saved months
  const allMk=Object.keys(savedMonths).sort();
  
  // 1. Monthly cost summary (condensed)
  const costSummary=allMk.map(mk=>{
    const d=savedMonths[mk]; if(!d) return null;
    const od=d.odEq||{};const rd=d.runDays||{};const bt=d.boatTypes||{};
    return `${mk}: Prod=${(d.prodMT||0).toFixed(0)}MT(${(d.effectiveProd||0).toFixed(0)}Kg), EqvOut=${((d.equivKg||0)/1000).toFixed(0)}MT(ratio=${(d.eqRatio||1).toFixed(3)}), MJ=${((d.metJumboKg||0)/1000).toFixed(0)}MT, A=${((d.slitAKg||0)/1000).toFixed(0)}MT, B=${((d.slitBKg||0)/1000).toFixed(0)}MT, Gr5=${((d.grade5Kg||0)/1000).toFixed(0)}MT, Gr6=${((d.grade6Kg||0)/1000).toFixed(0)}MT, Export=${((d.exportKg||0)/1000).toFixed(1)}MT, HeatSeal=${((d.heatSealKg||0)/1000).toFixed(1)}MT`
    +`\n  Wire=${(d.wireCKg||0).toFixed(2)}(${(d.wireKgsTotal||0).toFixed(0)}Kg), Boat=${(d.boatCKg||0).toFixed(2)}(${(d.boatPcsTotal||0).toFixed(0)}Pcs, rate=₹${(d.boatRate||0).toFixed(0)})`
    +`\n  BareW=${(d.bareWastePct||0).toFixed(2)}%(${(d.bareWasteKg||0).toFixed(0)}Kg), MetW=${(d.metWastePct||0).toFixed(2)}%(${(d.metWasteKg||0).toFixed(0)}Kg), IO=${(d.ioPct||0).toFixed(2)}%, AdjMet=${(d.adjustedMetPct||0).toFixed(2)}%, WasteLoss=₹${(d.wasteLoss||0).toFixed(2)}(bare₹${(d.bareLossComponent||0).toFixed(2)}+met₹${(d.metLossComponent||0).toFixed(2)})`
    +`\n  RM=${(d.rmC||0).toFixed(2)}, Conv=${(d.convC||0).toFixed(2)}, Total=${(d.totalC||0).toFixed(2)}, Net=${(d.totalAfterScrap||0).toFixed(2)}, MP=${(d.mpKg||0).toFixed(2)}, Pwr=${(d.pwrKg||0).toFixed(2)}(${(d.pwrU||0).toFixed(0)}units), Cons=${(d.consKg||0).toFixed(2)}(₹${(d.consAmt||0).toFixed(0)})`
    +`\n  Scrap: Wire=${(d.scrapWireKg||0).toFixed(0)}Kg(₹${(d.scrapWireSale||0).toFixed(2)}/Kg), Dust=${(d.scrapDustKg||0).toFixed(0)}Kg(₹${(d.scrapDustSale||0).toFixed(2)}/Kg)`
    +`\n  RunDays: M1=${rd.m1||0}, M2=${rd.m2||0}, avg=${rd.avg||0}, Rolls/Day=${(d.avgRollsPerDay||0).toFixed(1)}`
    +(od.avgLenNormal?`\n  JumboLen: Normal=${od.avgLenNormal.toFixed(0)}m(${od.lenNormalCt}rolls), RCM=${(od.avgLenRCM||0).toFixed(0)}m(${od.lenRCMCt||0}), AlOx=${(od.avgLenAlOx||0).toFixed(0)}m(${od.lenAlOxCt||0}), AvgWidth=${(od.avgWidth||3000).toFixed(0)}mm`:'')
    +(d.pl&&d.pl.revenue?`\n  Rev=₹${(d.pl.revenue/100000).toFixed(1)}L, Profit=₹${(d.pl.profit/100000).toFixed(1)}L`:'');
  }).filter(Boolean).join('\n');

  // 2. Material production across months (aggregate all)
  const allMats={}, allCusts={}, allSizes={};
  allMk.forEach(mk=>{
    const d=savedMonths[mk];
    if(!d||!d.zsAgg) return;
    const agg=d.zsAgg;
    if(agg.byMaterial) agg.byMaterial.forEach(m=>{
      if(!allMats[m.code]) allMats[m.code]={code:m.code,desc:m.desc,kg:0,rolls:0,months:[]};
      allMats[m.code].kg+=m.kg; allMats[m.code].rolls+=m.rolls; allMats[m.code].months.push(mk+':'+Math.round(m.kg)+'Kg');
    });
    if(agg.byCustomer) agg.byCustomer.forEach(c=>{
      if(!allCusts[c.name]) allCusts[c.name]={name:c.name,city:c.city,kg:0,rolls:0,months:[],topMats:c.topMats||[]};
      allCusts[c.name].kg+=c.kg; allCusts[c.name].rolls+=c.rolls; allCusts[c.name].months.push(mk+':'+Math.round(c.kg)+'Kg');
    });
    if(agg.bySize) agg.bySize.forEach(s=>{
      const k=s.thick+'×'+s.od;
      if(!allSizes[k]) allSizes[k]={thick:s.thick,od:s.od,kg:0,rolls:0};
      allSizes[k].kg+=s.kg; allSizes[k].rolls+=s.rolls;
    });
  });
  const matList=Object.values(allMats).sort((a,b)=>b.kg-a.kg).slice(0,30);
  const custList=Object.values(allCusts).sort((a,b)=>b.kg-a.kg).slice(0,30);
  const sizeList=Object.values(allSizes).sort((a,b)=>b.kg-a.kg).slice(0,15);

  const matData=matList.map(m=>`${m.code} (${m.desc||''}): ${(m.kg/1000).toFixed(1)}MT, ${m.rolls} rolls [${m.months.slice(-6).join(', ')}]`).join('\n');
  const custData=custList.map(c=>`${c.name} (${c.city}): ${(c.kg/1000).toFixed(1)}MT, ${c.rolls} rolls\n  Materials: ${(c.topMats||[]).slice(0,5).join(', ')}\n  Sizes: ${(c.topSizes||[]).slice(0,5).join(', ')}\n  Months: ${c.months.slice(-4).join(', ')}`).join('\n');
  const sizeData=sizeList.map(s=>`${s.thick}µ ${s.od}OD: ${(s.kg/1000).toFixed(1)}MT, ${s.rolls} rolls`).join('\n');

  // 3. Per-month material detail (top 5 per month for recent 6 months)
  const recentMonths=allMk.slice(-6);
  const monthDetail=recentMonths.map(mk=>{
    const d=savedMonths[mk];
    if(!d||!d.zsAgg||!d.zsAgg.byMaterial) return '';
    const top=d.zsAgg.byMaterial.slice(0,8);
    const custTop=d.zsAgg.byCustomer?d.zsAgg.byCustomer.slice(0,5):[];
    return `\n[${mk}] Materials: ${top.map(m=>m.code+':'+Math.round(m.kg)+'Kg('+m.pct.toFixed(1)+'%)').join(', ')}` +
      (custTop.length?`\n[${mk}] Customers: ${custTop.map(c=>c.name+'('+c.city+'):'+Math.round(c.kg)+'Kg, Sizes:['+(c.topSizes||[]).slice(0,3).join(',')+']').join('; ')}`:'');
  }).filter(Boolean).join('');

  const sysPrompt=`You are MetCost AI, an expert production cost analyst and efficiency advisor for GLS Polyfilms metallised film plant.
You have COMPLETE data for ${allMk.length} months (${allMk[0]} to ${allMk[allMk.length-1]}).

ROLE: Help the manager optimize production costs, plan material scheduling, track customer requirements, and improve efficiency.

RULES:
- Answer with specific numbers from the data. Use ₹ symbol.
- Be concise but thorough. Use tables for comparisons.
- When asked about customers, show their materials, sizes (Thickness×OD×Width), and volumes.
- When asked about efficiency, suggest specific actions based on data trends.
- Material codes: G12301M22 = 12µ Met Plain 2.2OD, G10301ABM25 = 10µ AluBond 2.5OD, prefix 3SF- is removed.
- Costs are ₹/Kg. Production in MT. Grade 2,7,8=A-grade, 3=B-grade.
- Ship-To-Party Name = Customer name. City = their location.
- Customer sizes format: "10µ×2.2OD×600mm" means 10 micron, 2.2 OD, 600mm width.
- For efficiency advice: higher production MT reduces ₹/Kg for fixed costs (MP, Power, Cons). Lower waste% saves directly. Running more days spreads manpower cost.

═══ MONTHLY COST DATA ═══
${costSummary}

═══ MATERIAL PRODUCTION (All-time, top 30) ═══
${matData||'No material data — upload ZSLIT files'}

═══ CUSTOMER DATA with sizes (All-time, top 30) ═══
${custData||'No customer data — upload ZSLIT files'}

═══ SIZE DISTRIBUTION (Thickness × OD) ═══
${sizeData||'No size data'}

═══ RECENT MONTH DETAILS ═══
${monthDetail||'No detailed data'}

═══ RATES & TARGETS (effective ${rates.targetDate||'not set'}) ═══
Wire ₹${rates.wireRate}/Kg, Boat ₹${rates.boatRate}/Pc, Film ₹${rates.baseFilmRate}/Kg, Power ₹${rates.electricityRate}/unit
Targets: Wire ₹${rates.tWire}, Boat ₹${rates.tBoat}, Waste ₹${rates.tWaste}, MP ₹${rates.tManpower}, Power ₹${rates.tPower}, Cons ₹${rates.tCons}
Total target: ₹${(rates.tWire+rates.tBoat+rates.tWaste+rates.tManpower+rates.tPower+rates.tCons+rates.indirectExpense).toFixed(2)}/Kg

═══ BOM DATA (${targets.length} film types) ═══
${targets.slice(0,25).map(t=>t.c+' ('+t.d+'): Wire '+t.w+'Kg/MT, Boat '+t.b+'Pcs/MT').join('\n')}

═══ MATERIAL-WISE CONVERSION COST TARGETS (per product type) ═══
${Object.entries(MATERIAL_TARGETS).map(([k,t])=>k+' ('+t.desc+'): Speed='+t.speed+'m/min, '+t.rolls+' rolls/day, '+t.mt+'MT/day, Wire=₹'+t.wireC+'/Kg, Boat=₹'+t.boatC+'/Kg, Waste='+t.wasteP+'%, Elec=₹'+t.elecC+', Total=₹'+t.total+', Grand=₹'+t.grandTotal+(t.sellPrice?', SellPrice=₹'+t.sellPrice:'')).join('\n')}

═══ MONTHLY P&L DATA ═══
${allMk.map(mk=>{const d=savedMonths[mk];if(!d||!d.zsAgg||!d.zsAgg.revenue) return null;const za=d.zsAgg;const conv=d.effectiveProd*(d.totalWP||0);const cost=za.baseFilmCost+conv;const profit=za.revenue-cost;return mk+': Rev=₹'+Math.round(za.revenue/100000)+'L, Cost=₹'+Math.round(cost/100000)+'L, Profit=₹'+Math.round(profit/100000)+'L ('+((za.revenue>0?profit/za.revenue*100:0).toFixed(1))+'%)'}).filter(Boolean).join('\n')||'No P&L data — set sell prices in BOM table'}

═══ TARGET CHANGE LOG ═══
${(rates.targetRemarks||[]).map(r=>r.date+': '+r.text).join('\n')||'No changes recorded'}`;

  try{
    if(!rates.aiProxyUrl){
      aiChat[aiChat.length-1].text='⚠️ AI not configured.\n\nGo to Settings → AI Configuration:\nPaste your free Gemini API key\n\nGet it free: aistudio.google.com → API Keys → Create';
      renderAIChat();return;
    }
    const geminiUrl='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key='+rates.aiProxyUrl;
    // Build Gemini format: system instruction + conversation
    const history=aiChat.filter(m=>!m.text.startsWith('⏳')).map(m=>({
      role:m.role==='assistant'?'model':'user',
      parts:[{text:m.text}]
    }));
    const resp=await fetch(geminiUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:sysPrompt}]},
        contents:history,
        generationConfig:{maxOutputTokens:1500,temperature:0.3}
      })
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'No response received.';
    aiChat[aiChat.length-1].text=reply;
  }catch(err){
    aiChat[aiChat.length-1].text='⚠️ Error: '+err.message+'\n\nCheck Settings → AI Configuration → Gemini API key.';
  }
  renderAIChat();
}
