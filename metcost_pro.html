<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>MetCost Pro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f0f2f5;--sf:#fff;--tx:#1a1a2e;--tx2:#64748b;--tx3:#94a3b8;--bd:#e2e8f0;--ac:#0f52ba;--ac2:#e8f0fe;--gn:#16a34a;--gn2:#dcfce7;--rd:#dc2626;--rd2:#fee2e2;--am:#d97706;--am2:#fef3c7;--pp:#7c3aed;--pp2:#ede9fe;--tl:#0d9488;--r:12px;--sh:0 1px 3px rgba(0,0,0,.06);--mn:'JetBrains Mono',monospace;--fn:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hd{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.hd h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.hd p{font-size:11px;opacity:.6;margin-top:1px}
.msel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 8px;border-radius:7px;font-size:12px;font-family:var(--fn)}
.msel option{color:#1a1a2e}
.ct{padding:12px;max-width:900px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:100;padding:2px 0 env(safe-area-inset-bottom,2px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:none;background:none;color:var(--tx3);font-size:9px;font-family:var(--fn);cursor:pointer}
.nb.on{color:var(--ac)}
.nb svg{width:20px;height:20px}
.cd{background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:10px}
.ct2{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mc{background:var(--sf);border-radius:var(--r);padding:12px;box-shadow:var(--sh);border:1px solid var(--bd);border-left:3px solid var(--ac)}
.ml{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mv{font-size:20px;font-weight:700;margin-top:3px;font-family:var(--mn);letter-spacing:-.5px}
.ms{font-size:10px;color:var(--tx3);margin-top:1px}
.fu{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1.5px dashed var(--bd);border-radius:var(--r);cursor:pointer;margin-bottom:6px}
.fu:hover{border-color:var(--ac);background:var(--ac2)}
.fu.dn{border-style:solid;border-color:var(--gn);background:var(--gn2)}
.fi{flex:1;min-width:0}
.fl{font-size:13px;font-weight:700}
.fd{font-size:11px;color:var(--tx2);margin-top:1px}
.fb{font-size:10px;font-weight:700;color:var(--gn);background:rgba(22,163,74,.1);padding:2px 8px;border-radius:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);border-bottom:2px solid var(--bd);font-weight:700}
.tb td{padding:7px 8px;border-bottom:1px solid var(--bd)}
.tb .n{text-align:right;font-family:var(--mn);font-size:12px}
.tb .st td{font-weight:700;background:var(--ac2)}
.tb .tt td{font-weight:700;background:var(--bg);border-top:2px solid var(--tx)}
.tg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.tg-g{background:var(--gn2);color:var(--gn)}
.tg-r{background:var(--rd2);color:var(--rd)}
.tg-a{background:var(--am2);color:var(--am)}
.tgg{display:grid;gap:8px}
.tgc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;position:relative}
.tgc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tgco{font-family:var(--mn);font-size:12px;font-weight:700;color:var(--ac)}
.tgd{font-size:12px;color:var(--tx2);margin:3px 0 8px}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tgs-l{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
.tgs-v{font-weight:700;font-family:var(--mn);font-size:12px}
.tgx{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--tx3);cursor:pointer;padding:3px;border-radius:4px;font-size:16px}
.tgx:hover{color:var(--rd);background:var(--rd2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;font-family:var(--fn);font-size:12px;font-weight:700;cursor:pointer}
.bp{background:var(--ac);color:#fff}
.bo{background:none;border:1.5px solid var(--bd);color:var(--tx)}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fg input{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:var(--fn);background:var(--sf);color:var(--tx)}
.fg input:focus{outline:none;border-color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mo>.mx{background:var(--sf);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.mx h3{font-size:16px;font-weight:700;margin-bottom:14px}
.rc{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.rc:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:500}
.ru{font-size:11px;color:var(--tx3)}
.ri{width:90px;text-align:right;padding:6px 8px;border:1.5px solid var(--bd);border-radius:7px;font-family:var(--mn);font-size:13px;font-weight:600}
.ri:focus{outline:none;border-color:var(--ac)}
.nd{text-align:center;padding:32px 16px;color:var(--tx3)}
.nd p{font-size:13px}
.wb{margin:10px 0}
.wl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.wl span:last-child{font-family:var(--mn);font-weight:700}
.wt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.wf{height:100%;border-radius:4px;transition:width .5s}
.er{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800}
.e1{background:#fef3c7;color:#92400e}
.e2{background:#e2e8f0;color:#475569}
.e3{background:#fed7aa;color:#9a3412}
.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
body{padding-bottom:56px}
.pr{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--ac2);color:var(--ac);border-radius:7px;font-size:12px;font-weight:600;margin:6px 0}
@keyframes sp{to{transform:rotate(360deg)}}
.sn{width:14px;height:14px;border:2px solid var(--ac2);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite}
.mp-card{background:linear-gradient(135deg,rgba(168,85,247,.06),rgba(14,165,233,.04));border:1px solid rgba(168,85,247,.2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.mp-card .ct2{color:var(--pp)}
</style>
</head>
<body>
<div class="hd">
  <div><h1>MetCost Pro</h1><p>Production Cost Tracker</p></div>
  <select class="msel" id="monthSel"></select>
</div>

<div class="ct" id="content"></div>

<nav class="nav" id="bnav"></nav>

<script>
const TABS=[
  {id:'dash',l:'Dashboard',ic:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4'},
  {id:'upload',l:'Upload',ic:'M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12'},
  {id:'cost',l:'Cost',ic:'M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z'},
  {id:'waste',l:'Wastage',ic:'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6'},
  {id:'emp',l:'Team',ic:'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z'},
  {id:'target',l:'Targets',ic:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'},
  {id:'set',l:'Settings',ic:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z'}
];

let tab='dash', uploads={}, rawData={}, processing=null, manpowerData={};
let rates={electricityRate:8.25,indirectExpense:0.26,packingFreight:1.67,baseFilmRate:105};
let targets=[
  {id:1,c:'G12301M22',d:'12µ Met Plain 2.2OD',w:8.6,b:1.7,wp:1.0,bp:0},
  {id:2,c:'G10301M22',d:'10µ Met Plain 2.2OD',w:10.32,b:2.04,wp:1.0,bp:0},
  {id:3,c:'G12301M28',d:'12µ Met Plain 2.8OD',w:11.8,b:3.3,wp:1.1,bp:0},
  {id:4,c:'G10301ABM25',d:'10µ AluBond 2.5OD',w:12.48,b:3.48,wp:1.1,bp:0},
  {id:5,c:'G12360M22',d:'12µ Chemical 2.2OD',w:8.6,b:1.7,wp:1.0,bp:0},
  {id:6,c:'G08301M22',d:'8µ Met Plain 2.2OD',w:12.9,b:2.55,wp:1.2,bp:0},
  {id:7,c:'G12301ABM22',d:'12µ AluBond 2.2OD',w:8.6,b:1.7,wp:1.0,bp:0},
  {id:8,c:'G10301M25',d:'10µ Met Plain 2.5OD',w:12.48,b:3.48,wp:1.1,bp:0},
];

const now=new Date(),sm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
let selMonth=sm;

// Listen for manpower data from parent app
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='MANPOWER_DATA'){
    manpowerData=e.data.data||{};
    render();
  }
});

const fmt=(n,d=2)=>{if(n==null||isNaN(n))return'—';return Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d})};
const ic=d=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

function initMonths(){
  const s=document.getElementById('monthSel');
  let h='';
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(let i=0;i<12;i++){
    const d=new Date();d.setMonth(d.getMonth()-i);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    h+=`<option value="${v}"${v===selMonth?' selected':''}>${mn[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  s.innerHTML=h;
  s.onchange=function(){selMonth=this.value;render()};
}

function parseXL(file,cb){
  const r=new FileReader();
  r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:null}))};
  r.readAsArrayBuffer(file);
}

function detectFileType(headers){
  const h=headers.map(x=>String(x||'').toLowerCase().trim());
  const has=(...keys)=>keys.every(k=>h.some(x=>x.includes(k)));
  if(has('amt.in loc.cur')&&has('movement type')&&has('material')&&!has('cost center')) return 'mb51';
  if(has('date of production')||has('movment type')&&has('machine')&&has('setup time')) return 'zjumbo';
  if(has('move type')&&has('net weight')&&has('grade')&&has('sales order')) return 'zslit';
  if(has('met-1')&&has('met-2')||has('total met')||has('met+%utility share')) return 'electricity';
  if(has('cost center')&&has('amt.in loc.cur')) return 'consSpares';
  if(has('material')&&has('amt.in loc.cur')&&h.some(x=>x.includes('posting date'))) return 'mb51';
  return null;
}

const FILE_LABELS={mb51:'MB51 (SAP Movements)',zjumbo:'ZJUMBO_PROD (Met Prod)',zslit:'ZSLIT_PROD (Slit Prod)',electricity:'Electricity Cost',consSpares:'Cons & Spares'};
const FILE_COLORS={mb51:'#0f52ba',zjumbo:'#0d9488',zslit:'#7c3aed',electricity:'#d97706',consSpares:'#16a34a'};

function handleMultiUpload(inp){
  if(!inp.files||!inp.files.length)return;
  const fileList=Array.from(inp.files);
  processing='multi';uploadLog=[];render();
  let done=0;
  fileList.forEach(file=>{
    parseXL(file,data=>{
      if(!data||!data.length){uploadLog.push({name:file.name,status:'empty',type:null});done++;if(done===fileList.length){processing=null;render()}return}
      const headers=Object.keys(data[0]);
      const type=detectFileType(headers);
      if(type){
        rawData[type]=data;
        uploads[type]={name:file.name,rows:data.length};
        uploadLog.push({name:file.name,status:'ok',type});
      }else{
        uploadLog.push({name:file.name,status:'unknown',type:null,headers:headers.slice(0,5).join(', ')});
      }
      done++;
      if(done===fileList.length){processing=null;render()}
    });
  });
}
let uploadLog=[];

function parseDate(v){if(v instanceof Date)return v;if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?null:d}if(typeof v==='string'){const d=new Date(v);return isNaN(d)?null:d}return null}

function compute(){
  const{mb51,zslit,electricity,consSpares}=rawData;
  if(!mb51&&!zslit)return null;
  const ms=new Date(selMonth+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0);
  const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};

  // Wire
  let wireAmt=0,wireN=0;
  if(mb51){const r=mb51.filter(r=>String(r.Material||'').toLowerCase().includes('3rm-alw')&&inM(r['Posting Date']));wireAmt=-r.reduce((s,r)=>s+(Number(r['Amt.in Loc.Cur.'])||0),0);wireN=r.length}

  // Boat
  let boatAmt=0,boatN=0;
  if(mb51){const r=mb51.filter(r=>String(r.Material||'').toLowerCase().includes('3rm-evb')&&inM(r['Posting Date']));boatAmt=-r.reduce((s,r)=>s+(Number(r['Amt.in Loc.Cur.'])||0),0);boatN=r.length}

  // Slit production
  let prodKg=1,slitAKg=0,slitBKg=0,wasteKg=0;
  if(zslit){
    const sm=zslit.filter(r=>inM(r.Date||r['Posting Date']));
    const p101=sm.filter(r=>String(r['Move Type']||r['Movement type']||'')=='101');
    prodKg=p101.reduce((s,r)=>s+(Number(r['Net Weight'])||0),0)||1;
    slitAKg=p101.filter(r=>String(r.Grade||r.Quality||'')=='2').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    slitBKg=p101.filter(r=>String(r.Grade||r.Quality||'')!='2'&&Number(r['Net Weight']||0)>0).reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    wasteKg=sm.filter(r=>{const m=String(r['Move Type']||r['Movement type']||'');return m=='531'||m=='309'}).reduce((s,r)=>s+Math.abs(Number(r['Net Weight']||r['Gross Weight'])||0),0);
  }

  // Electricity
  let pwrU=0;
  if(electricity){electricity.filter(r=>inM(r.Date)).forEach(r=>{pwrU+=Number(r['Met+%Utility Share']||r['Total Met']||0)})}
  const pwrCost=pwrU*rates.electricityRate;

  // Cons & Spares
  let consAmt=0;
  if(consSpares){consSpares.filter(r=>{const cc=String(r['Cost Center']||'');return(cc=='3030010082'||cc=='3030010083')&&inM(r['Posting Date'])}).forEach(r=>{consAmt+=-( Number(r['Amt.in Loc.Cur.'])||0)})}

  // Manpower from parent
  const mpData=manpowerData[selMonth];
  const mpTotal=mpData?mpData.totalNet:0;

  const wireCKg=wireAmt/prodKg,boatCKg=boatAmt/prodKg,rmC=wireCKg+boatCKg;
  const wastePct=wasteKg/(prodKg+wasteKg)*100,bGradePct=slitBKg/prodKg*100;
  const wasteLoss=(wastePct*rates.baseFilmRate*0.5+bGradePct*(rates.baseFilmRate+5)*0.01);
  const bGradeLoss=bGradePct*10/100;
  const mpKg=mpTotal/prodKg;
  const pwrKg=pwrCost/prodKg,consKg=consAmt/prodKg;
  const convC=wasteLoss+bGradeLoss+mpKg+pwrKg+consKg+rates.indirectExpense;
  const totalC=rmC+convC,totalWP=totalC+rates.packingFreight;

  return{prodKg,prodMT:prodKg/1000,slitAKg,slitBKg,wasteKg,wireAmt,boatAmt,wireN,boatN,wireCKg,boatCKg,rmC,wastePct,bGradePct,wasteLoss,bGradeLoss,mpKg,mpTotal,pwrKg,pwrU,pwrCost,consKg,consAmt,convC,totalC,totalWP,mpData};
}

function render(){
  // Bottom nav
  document.getElementById('bnav').innerHTML=TABS.map(t=>
    `<button class="nb${tab===t.id?' on':''}" onclick="tab='${t.id}';render()">${ic(t.ic)}<span>${t.l}</span></button>`
  ).join('');

  const c=compute(),ct=document.getElementById('content');
  const hasData=Object.keys(uploads).length>=1;

  if(tab==='dash'){
    ct.innerHTML=`
      <div class="mg">
        <div class="mc" style="border-left-color:${c?'var(--ac)':'var(--tx3)'}"><div class="ml">Production</div><div class="mv">${c?fmt(c.prodMT,1)+' MT':'—'}</div><div class="ms">Slit output</div></div>
        <div class="mc" style="border-left-color:${c&&c.totalC>12?'var(--rd)':'var(--gn)'}"><div class="ml">Conv. cost</div><div class="mv">${c?'₹'+fmt(c.totalC):'—'}</div><div class="ms">per Kg</div></div>
        <div class="mc" style="border-left-color:${c&&c.wastePct>1?'var(--am)':'var(--gn)'}"><div class="ml">Wastage</div><div class="mv">${c?fmt(c.wastePct,2)+'%':'—'}</div><div class="ms">Target: 1.00%</div></div>
        <div class="mc" style="border-left-color:var(--pp)"><div class="ml">Total cost</div><div class="mv">${c?'₹'+fmt(c.totalWP):'—'}</div><div class="ms">with packing</div></div>
      </div>
      ${c&&c.mpData?`<div class="mp-card"><div class="ct2">👥 Manpower (from MET Power)</div>
        <div class="mg"><div class="mc" style="border-left-color:var(--pp)"><div class="ml">Net salary</div><div class="mv">₹${fmt(c.mpTotal,0)}</div><div class="ms">${c.mpData.employeeCount} employees</div></div>
        <div class="mc" style="border-left-color:var(--am)"><div class="ml">₹/Kg</div><div class="mv">₹${fmt(c.mpKg)}</div><div class="ms">Manpower cost</div></div></div></div>`:''}
      ${!hasData?'<div class="cd"><div class="nd"><p>Upload your SAP Excel files to begin</p><p style="font-size:11px;margin-top:4px;color:var(--tx3)">Go to Upload tab → Select all files at once</p></div></div>':''}
      ${c?`<div class="cd"><div class="ct2">Cost breakdown ₹/Kg</div><div class="sx"><table class="tb">
        <thead><tr><th>Component</th><th class="n">₹/Kg</th><th class="n">% total</th></tr></thead><tbody>
        <tr><td>Wire (Al)</td><td class="n">${fmt(c.wireCKg)}</td><td class="n">${fmt(c.wireCKg/c.totalC*100,1)}%</td></tr>
        <tr><td>Boat (EVB)</td><td class="n">${fmt(c.boatCKg)}</td><td class="n">${fmt(c.boatCKg/c.totalC*100,1)}%</td></tr>
        <tr class="st"><td>Raw material</td><td class="n">${fmt(c.rmC)}</td><td class="n">${fmt(c.rmC/c.totalC*100,1)}%</td></tr>
        <tr><td>Wastage loss</td><td class="n">${fmt(c.wasteLoss)}</td><td class="n">${fmt(c.wasteLoss/c.totalC*100,1)}%</td></tr>
        <tr><td>B-grade loss</td><td class="n">${fmt(c.bGradeLoss)}</td><td class="n">${fmt(c.bGradeLoss/c.totalC*100,1)}%</td></tr>
        <tr><td>Manpower</td><td class="n">${fmt(c.mpKg)}</td><td class="n">${fmt(c.mpKg/c.totalC*100,1)}%</td></tr>
        <tr><td>Power (${fmt(c.pwrU,0)} u)</td><td class="n">${fmt(c.pwrKg)}</td><td class="n">${fmt(c.pwrKg/c.totalC*100,1)}%</td></tr>
        <tr><td>Cons & spares</td><td class="n">${fmt(c.consKg)}</td><td class="n">${fmt(c.consKg/c.totalC*100,1)}%</td></tr>
        <tr><td>Indirect</td><td class="n">${fmt(rates.indirectExpense)}</td><td class="n">${fmt(rates.indirectExpense/c.totalC*100,1)}%</td></tr>
        <tr class="st"><td>Conversion cost</td><td class="n">${fmt(c.convC)}</td><td class="n">${fmt(c.convC/c.totalC*100,1)}%</td></tr>
        <tr class="tt"><td>Total cost</td><td class="n">₹${fmt(c.totalC)}</td><td class="n">100%</td></tr>
        <tr><td>+ Packing & freight</td><td class="n">${fmt(rates.packingFreight)}</td><td class="n"></td></tr>
        <tr class="tt"><td>Total with packing</td><td class="n">₹${fmt(c.totalWP)}</td><td class="n"></td></tr>
      </tbody></table></div></div>`:''}`;
  }

  else if(tab==='upload'){
    const detected=Object.keys(uploads).length;
    const statusList=['mb51','zjumbo','zslit','electricity','consSpares'];
    ct.innerHTML=`
      <div style="font-size:16px;font-weight:700;margin-bottom:4px">Upload data files</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:14px">Select all your monthly SAP Excel files at once. The app auto-detects which file is which.</p>

      <label style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px;background:var(--sf);border:2px dashed ${detected>=3?'var(--gn)':'var(--ac)'};border-radius:16px;cursor:pointer;transition:all .2s;text-align:center;margin-bottom:14px"
        onmouseover="this.style.background='var(--ac2)';this.style.borderColor='var(--ac)'" onmouseout="this.style.background='var(--sf)';this.style.borderColor='${detected>=3?'var(--gn)':'var(--ac)}'">
        <input type="file" accept=".xlsx,.xls,.csv" multiple style="display:none" onchange="handleMultiUpload(this)">
        <div style="width:56px;height:56px;border-radius:16px;background:${detected>=3?'rgba(22,163,74,.1)':'var(--ac2)'};display:flex;align-items:center;justify-content:center">
          ${detected>=3
            ?'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--gn)" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>'
            :'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.5"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>'}
        </div>
        <div>
          <div style="font-size:15px;font-weight:700;color:${detected>=3?'var(--gn)':'var(--ac)'}">${detected>=3?detected+' files detected — tap to add more':'Tap to select Excel files'}</div>
          <div style="font-size:12px;color:var(--tx3);margin-top:3px">MB51, ZJUMBO, ZSLIT, Electricity, Cons & Spares — select all at once</div>
        </div>
      </label>

      ${processing?'<div class="pr"><div class="sn"></div>Detecting & processing files...</div>':''}

      <div class="cd"><div class="ct2">Data sources (${detected}/5 detected)</div>
        ${statusList.map(k=>{
          const u=uploads[k];
          return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)">
            <div style="width:8px;height:8px;border-radius:50%;background:${u?'var(--gn)':'var(--bd)'};flex-shrink:0"></div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:${u?'var(--tx)':'var(--tx3)'}">${FILE_LABELS[k]}</div>
              ${u?`<div style="font-size:11px;color:var(--tx2)">${u.name} · ${u.rows} rows</div>`
                 :`<div style="font-size:11px;color:var(--tx3)">Not yet uploaded</div>`}
            </div>
            ${u?'<span class="fb">OK</span>':'<span style="font-size:10px;color:var(--tx3)">—</span>'}
          </div>`;
        }).join('')}
      </div>

      ${uploadLog.length?`<div class="cd"><div class="ct2">Last upload results</div>
        ${uploadLog.map(l=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-bottom:1px solid var(--bd)">
          <span style="font-size:14px">${l.status==='ok'?'✅':l.status==='unknown'?'⚠️':'❌'}</span>
          <span style="flex:1;font-weight:500">${l.name}</span>
          <span style="font-size:11px;color:${l.status==='ok'?'var(--gn)':l.status==='unknown'?'var(--am)':'var(--rd)'};font-weight:600">${l.status==='ok'?'→ '+FILE_LABELS[l.type]:l.status==='unknown'?'Not recognized':'Empty file'}</span>
        </div>`).join('')}
      </div>`:''}

      <div class="mp-card" style="margin-top:12px">
        <div class="ct2">Manpower data (auto from MET Power)</div>
        ${manpowerData[selMonth]?`<div style="font-size:12px;color:var(--gn);font-weight:700">✓ ${manpowerData[selMonth].employeeCount} employees · Net ₹${fmt(manpowerData[selMonth].totalNet,0)}</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:3px">Absent deductions: ₹${fmt(manpowerData[selMonth].totalDeduct,0)} · Gross: ₹${fmt(manpowerData[selMonth].totalGross,0)}</div>`
        :`<div style="font-size:12px;color:var(--am)">⏳ Waiting for data from parent app...</div>
        <div style="font-size:11px;color:var(--tx3);margin-top:3px">Salary & absenteeism data is automatically received from MET Power</div>`}
      </div>`;
  }

  else if(tab==='cost'){
    if(!c){ct.innerHTML='<div class="cd"><div class="nd"><p>Upload MB51 & ZSLIT first</p></div></div>';return}
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:12px">Conversion cost ₹/Kg</div>
      <div class="mg">
        <div class="mc" style="border-left-color:var(--ac)"><div class="ml">Wire</div><div class="mv">₹${fmt(c.wireCKg)}</div><div class="ms">₹${fmt(c.wireAmt,0)} total</div></div>
        <div class="mc" style="border-left-color:var(--pp)"><div class="ml">Boat</div><div class="mv">₹${fmt(c.boatCKg)}</div><div class="ms">₹${fmt(c.boatAmt,0)} total</div></div>
        <div class="mc" style="border-left-color:var(--am)"><div class="ml">Power</div><div class="mv">₹${fmt(c.pwrKg)}</div><div class="ms">${fmt(c.pwrU,0)} units</div></div>
        <div class="mc" style="border-left-color:var(--tl)"><div class="ml">Cons & spares</div><div class="mv">₹${fmt(c.consKg)}</div><div class="ms">₹${fmt(c.consAmt,0)} total</div></div>
      </div>
      <div class="cd"><div class="ct2">Actual vs target</div><div class="sx"><table class="tb">
        <thead><tr><th>Component</th><th class="n">Actual</th><th class="n">Target</th><th class="n">Var</th></tr></thead><tbody>
        <tr><td>Wire</td><td class="n">${fmt(c.wireCKg)}</td><td class="n">3.05</td><td class="n"><span class="tg ${c.wireCKg>3.05?'tg-r':'tg-g'}">${fmt(c.wireCKg-3.05)}</span></td></tr>
        <tr><td>Boat</td><td class="n">${fmt(c.boatCKg)}</td><td class="n">1.87</td><td class="n"><span class="tg ${c.boatCKg>1.87?'tg-r':'tg-g'}">${fmt(c.boatCKg-1.87)}</span></td></tr>
        <tr><td>Power</td><td class="n">${fmt(c.pwrKg)}</td><td class="n">3.56</td><td class="n"><span class="tg ${c.pwrKg>3.56?'tg-r':'tg-g'}">${fmt(c.pwrKg-3.56)}</span></td></tr>
        <tr><td>Manpower</td><td class="n">${fmt(c.mpKg)}</td><td class="n">0.80</td><td class="n"><span class="tg ${c.mpKg>0.8?'tg-r':'tg-g'}">${fmt(c.mpKg-0.8)}</span></td></tr>
        <tr><td>Cons & spares</td><td class="n">${fmt(c.consKg)}</td><td class="n">0.30</td><td class="n"><span class="tg ${c.consKg>0.3?'tg-r':'tg-g'}">${fmt(c.consKg-0.3)}</span></td></tr>
        <tr class="tt"><td>Total</td><td class="n">₹${fmt(c.totalC)}</td><td class="n">₹10.84</td><td class="n"><span class="tg ${c.totalC>10.84?'tg-r':'tg-g'}">${fmt(c.totalC-10.84)}</span></td></tr>
      </tbody></table></div></div>`;
  }

  else if(tab==='waste'){
    if(!c){ct.innerHTML='<div class="cd"><div class="nd"><p>Upload production data</p></div></div>';return}
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:12px">Wastage tracking</div>
      <div class="mg">
        <div class="mc" style="border-left-color:${c.wastePct>1?'var(--rd)':'var(--gn)'}"><div class="ml">Slitter waste</div><div class="mv">${fmt(c.wastePct,2)}%</div><div class="ms">Target: 1.00%</div></div>
        <div class="mc" style="border-left-color:${c.bGradePct>0.5?'var(--am)':'var(--gn)'}"><div class="ml">B-grade</div><div class="mv">${fmt(c.bGradePct,2)}%</div><div class="ms">Target: 0%</div></div>
      </div>
      <div class="cd"><div class="ct2">Wastage vs target</div>
        ${[{l:'Slitter waste %',a:c.wastePct,t:1.0},{l:'B-grade %',a:c.bGradePct,t:0.5}].map(w=>`
          <div class="wb"><div class="wl"><span>${w.l}</span><span>${fmt(w.a,2)}% / ${w.t}% target</span></div>
          <div class="wt"><div class="wf" style="width:${Math.min(w.a/w.t/2*100,100)}%;background:${w.a>w.t?'var(--rd)':'var(--gn)'}"></div></div></div>`).join('')}
      </div>
      <div class="cd"><div class="ct2">Waste breakdown</div><div class="sx"><table class="tb">
        <thead><tr><th>Type</th><th class="n">Kg</th><th class="n">%</th><th class="n">Loss ₹</th></tr></thead><tbody>
        <tr><td>Waste (531/309)</td><td class="n">${fmt(c.wasteKg,0)}</td><td class="n">${fmt(c.wastePct,2)}%</td><td class="n">${fmt(c.wasteKg*rates.baseFilmRate,0)}</td></tr>
        <tr><td>B-grade</td><td class="n">${fmt(c.slitBKg,0)}</td><td class="n">${fmt(c.bGradePct,2)}%</td><td class="n">${fmt(c.slitBKg*10,0)}</td></tr>
        <tr class="tt"><td>Total loss</td><td class="n">${fmt(c.wasteKg+c.slitBKg,0)}</td><td class="n"></td><td class="n">₹${fmt(c.wasteKg*rates.baseFilmRate+c.slitBKg*10,0)}</td></tr>
      </tbody></table></div></div>`;
  }

  else if(tab==='emp'){
    const mp=manpowerData[selMonth];
    if(!mp||!mp.perEmployee){ct.innerHTML='<div class="cd"><div class="nd"><p>Manpower data not yet received from MET Power</p></div></div>';return}
    const emps=mp.perEmployee.sort((a,b)=>b.netSalary-a.netSalary);
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:4px">Team — Salary & attendance</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">${mp.employeeCount} employees · ${mp.workingDays} working days</p>
      <div class="mg">
        <div class="mc" style="border-left-color:var(--am)"><div class="ml">Gross</div><div class="mv">₹${fmt(mp.totalGross,0)}</div></div>
        <div class="mc" style="border-left-color:var(--rd)"><div class="ml">Deductions</div><div class="mv">₹${fmt(mp.totalDeduct,0)}</div></div>
        <div class="mc" style="border-left-color:var(--gn)"><div class="ml">Net pay</div><div class="mv">₹${fmt(mp.totalNet,0)}</div></div>
        <div class="mc" style="border-left-color:var(--pp)"><div class="ml">₹/Kg</div><div class="mv">${c?'₹'+fmt(c.mpKg):'—'}</div></div>
      </div>
      <div class="cd"><div class="ct2">Employee details</div><div class="sx"><table class="tb">
        <thead><tr><th>#</th><th>Name</th><th>Sec</th><th class="n">Salary</th><th class="n">Ab</th><th class="n">Net</th></tr></thead><tbody>
        ${emps.map((e,i)=>`<tr>
          <td><span class="er${i<3?' e'+(i+1):''}">${i+1}</span></td>
          <td style="font-weight:600;font-size:11px">${e.name}</td>
          <td><span class="tg tg-a" style="font-size:9px">${e.section}</span></td>
          <td class="n" style="font-size:11px">₹${Number(e.monthlySalary).toLocaleString('en-IN')}</td>
          <td class="n">${e.absentDays>0?'<span class="tg tg-r">'+e.absentDays+'</span>':'<span style="color:var(--tx3)">0</span>'}</td>
          <td class="n" style="font-weight:700;font-size:11px;color:var(--gn)">₹${Number(e.netSalary).toLocaleString('en-IN')}</td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  }

  else if(tab==='target'){
    ct.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div><div style="font-size:16px;font-weight:700">Film type targets</div><p style="font-size:12px;color:var(--tx2)">BOM targets per MT for each product</p></div>
        <button class="btn bp" onclick="showAddTarget()" style="font-size:11px;padding:6px 12px">+ Add</button>
      </div>
      <div class="tgg">${targets.map(t=>`<div class="tgc">
        <button class="tgx" onclick="removeTarget(${t.id})">×</button>
        <div class="tgco">${t.c}</div><div class="tgd">${t.d}</div>
        <div class="tgs">
          <div><div class="tgs-l">Wire Kg/MT</div><div class="tgs-v">${t.w}</div></div>
          <div><div class="tgs-l">Boat Pcs/MT</div><div class="tgs-v">${t.b}</div></div>
          <div><div class="tgs-l">Waste %</div><div class="tgs-v">${t.wp}%</div></div>
          <div><div class="tgs-l">B-Grade %</div><div class="tgs-v">${t.bp}%</div></div>
        </div>
      </div>`).join('')}</div>
      <div id="addModal"></div>`;
  }

  else if(tab==='set'){
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:4px">Rate card settings</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Changes reflect in all calculations instantly</p>
      <div class="cd">${[
        {k:'electricityRate',l:'Electricity rate',u:'₹ per kWh'},
        {k:'baseFilmRate',l:'Base film rate',u:'₹ per Kg'},
        {k:'indirectExpense',l:'Indirect expense',u:'₹ per Kg'},
        {k:'packingFreight',l:'Packing & freight',u:'₹ per Kg'},
      ].map(r=>`<div class="rc"><div><div class="rn">${r.l}</div><div class="ru">${r.u}</div></div>
        <input class="ri" type="number" step="0.01" value="${rates[r.k]}" onchange="rates.${r.k}=Number(this.value)||0;render()"></div>`).join('')}
      </div>
      <div class="cd"><div class="ct2">Data management</div>
        <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Uploaded data is held in browser memory for this session.</p>
        <button class="btn bo" onclick="uploads={};rawData={};uploadLog=[];render()" style="font-size:11px">Clear all uploads</button>
      </div>`;
  }
}

function showAddTarget(){
  const m=document.getElementById('addModal');
  if(!m)return;
  m.innerHTML=`<div class="mo" onclick="document.getElementById('addModal').innerHTML=''">
    <div class="mx" onclick="event.stopPropagation()">
      <h3>Add film type target</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg"><label>Film code</label><input id="nc" placeholder="G15301M22"></div>
        <div class="fg"><label>Description</label><input id="nd" placeholder="15µ Met 2.2OD"></div>
        <div class="fg"><label>Wire Kg/MT</label><input id="nw" type="number" step="0.1"></div>
        <div class="fg"><label>Boat Pcs/MT</label><input id="nb" type="number" step="0.1"></div>
        <div class="fg"><label>Waste %</label><input id="nwp" type="number" step="0.1"></div>
        <div class="fg"><label>B-Grade %</label><input id="nbp" type="number" step="0.1" value="0"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button class="btn bo" onclick="document.getElementById('addModal').innerHTML=''">Cancel</button>
        <button class="btn bp" onclick="addTarget()">Add target</button>
      </div>
    </div></div>`;
}

function addTarget(){
  const c=document.getElementById('nc').value,d=document.getElementById('nd').value;
  if(!c||!d)return;
  targets.push({id:Date.now(),c,d,w:Number(document.getElementById('nw').value)||0,b:Number(document.getElementById('nb').value)||0,wp:Number(document.getElementById('nwp').value)||0,bp:Number(document.getElementById('nbp').value)||0});
  document.getElementById('addModal').innerHTML='';
  render();
}
function removeTarget(id){targets=targets.filter(t=>t.id!==id);render()}

initMonths();
render();

// Request data from parent on load
setTimeout(()=>{try{window.parent.postMessage({type:'REQUEST_MANPOWER'},'*')}catch(e){}},500);
</script>
</body>
</html>
