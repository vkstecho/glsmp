// Running day overrides per month — saved to localStorage + Firebase
function getRunDayOvr(month,machine,autoVal){
  if(!rates.runDayOverrides) return autoVal;
  const key=month+'_'+machine;
  return rates.runDayOverrides[key]!==undefined?rates.runDayOverrides[key]:autoVal;
}
function setRunDayOvr(month,machine,val){
  if(!rates.runDayOverrides) rates.runDayOverrides={};
  const v=parseFloat(val);
  rates.runDayOverrides[month+'_'+machine]=isNaN(v)?0:v;
  // Recalculate manpower for this month
  const c=savedMonths[month];
  if(c&&c.runDays&&c.mpTotalFull){
    const m1d=getRunDayOvr(month,'m1',c.runDays.m1);
    const m2d=getRunDayOvr(month,'m2',c.runDays.m2);
    const avgD=(m1d+m2d)/2;
    const ratio=avgD/c.runDays.total;
    c.mpTotal=Math.round(c.mpTotalFull*ratio);
    c.mpKg=c.effectiveProd>0?c.mpTotal/c.effectiveProd:0;
    c.runDays.avg=avgD;c.runDays.ratio=ratio;
    // Recalc conversion + total
    c.convC=(c.wasteLoss||0)+(c.bGradeLoss||0)+c.mpKg+(c.pwrKg||0)+(c.consKg||0)+(c.rates||rates).indirectExpense;
    c.totalC=(c.rmC||0)+c.convC;
    c.totalWP=c.totalC+(c.rates||rates).packingFreight;
    c.totalAfterScrap=c.totalWP-(c.scrapWireSale||0)-(c.scrapDustSale||0);
    saveToStorage();
  }
  saveRates();
  render();
}

function addRemark(){
  const inp=document.getElementById('remarkInput');
  const text=inp.value.trim();
  if(!text) return;
  if(!rates.targetRemarks) rates.targetRemarks=[];
  const today=new Date().toISOString().slice(0,10);
  rates.targetRemarks.push({date:today,text});
  inp.value='';
  saveRates();render();
}

function showPLComparison(period){
  const all=Object.keys(savedMonths).sort();
  let months=[];
  const now=new Date();
  if(period==='fy'){
    // FY Apr-Mar: if current month >= Apr, FY starts this year Apr, else last year Apr
    const fyStart=now.getMonth()>=3?now.getFullYear():now.getFullYear()-1;
    months=all.filter(m=>{const[y,mo]=m.split('-').map(Number);return(y===fyStart&&mo>=4)||(y===fyStart+1&&mo<=3)});
  }else if(period==='cy'){
    const cy=now.getFullYear();
    months=all.filter(m=>m.startsWith(cy+'-')||m.startsWith((cy-1)+'-'));
    months=all.filter(m=>m.startsWith(String(now.getFullYear()-1)+'-')||m.startsWith(String(now.getFullYear())+'-'));
    // Actually just last full CY
    months=all.filter(m=>m.startsWith(String(now.getFullYear()-1)+'-'));
  }else if(period==='q4'){
    months=all.slice(-3);
  }else{
    months=all;
  }
  if(!months.length){document.getElementById('plCompare').innerHTML='<div style="font-size:11px;color:var(--tx3)">No data for this period</div>';return}

  let totalRev=0,totalCost=0,totalScrap=0,totalPacking=0,totalProd=0,totalProfit=0;
  let rows='';
  months.forEach(mk=>{
    const d=savedMonths[mk];if(!d||!d.pl) return;
    const rev=d.pl.revenue||0;
    const cost=d.pl.totalProdCost||0;
    const pack=d.pl.packingCost||0;
    const scrap=d.pl.scrapRevenue||0;
    const profit=d.pl.profit||0;
    totalRev+=rev;totalCost+=cost;totalPacking+=pack;totalScrap+=scrap;totalProfit+=profit;totalProd+=(d.prodMT||0);
    const pc=rev>0?profit>=0?'#22c55e':'#ef4444':'var(--tx3)';
    rows+=`<tr><td>${monthLabel(mk)}</td><td class="n">${fmt(d.prodMT,0)}</td>
      <td class="n" style="color:#22c55e">${rev>0?'₹'+fmt(rev/100000,1)+'L':'—'}</td>
      <td class="n" style="color:#f87171">₹${fmt((cost+pack)/100000,1)}L</td>
      <td class="n" style="color:${pc};font-weight:700">${rev>0?'₹'+fmt(Math.abs(profit)/100000,1)+'L':'—'}</td>
      <td class="n" style="color:${pc}">${rev>0?fmt(profit/((d.prodMT||1)*1000),2):'—'}</td></tr>`;
  });
  // Total row
  const tc=totalProfit>=0?'#22c55e':'#ef4444';
  rows+=`<tr class="tt"><td>TOTAL (${months.length} months)</td><td class="n">${fmt(totalProd,0)}</td>
    <td class="n" style="color:#22c55e">${totalRev>0?'₹'+fmt(totalRev/100000,1)+'L':'—'}</td>
    <td class="n" style="color:#f87171">₹${fmt((totalCost+totalPacking)/100000,1)}L</td>
    <td class="n" style="color:${tc};font-weight:800;font-size:13px">${totalRev>0?'₹'+fmt(Math.abs(totalProfit)/100000,1)+'L':'—'}</td>
    <td class="n" style="color:${tc}">${totalRev>0?fmt(totalProfit/(totalProd*1000),2):'—'}</td></tr>`;

  document.getElementById('plCompare').innerHTML=`<div class="sx"><table class="tb" style="font-size:11px">
    <thead><tr><th>Month</th><th class="n">MT</th><th class="n">Revenue</th><th class="n">Cost</th><th class="n">P&L</th><th class="n">₹/Kg</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    ${totalRev===0?'<div style="font-size:10px;color:var(--am);margin-top:6px">⚠️ Set selling prices in Targets → BOM → SP ₹/Kg column</div>':''}`;
}
function removeRemark(idx){
  if(!rates.targetRemarks) return;
  rates.targetRemarks.splice(idx,1);
  saveRates();render();
}

// Download cost sheet as image
function downloadCostImage(){
  const el=document.getElementById('costPrintArea');

  const btn=document.getElementById('dlBtn');

// ═══ AI ASSISTANT ═══
let aiChat=[],aiOpen=false;
function toggleAI(){
  aiOpen=!aiOpen;
  document.getElementById('aiPanel').style.display=aiOpen?'flex':'none';
  document.getElementById('aiMonthCount').textContent=Object.keys(savedMonths).length+' months';
  if(aiOpen&&!aiChat.length){
    aiChat.push({role:'assistant',text:'Hi! I\'m your MetCost AI assistant. I have access to all your saved production data across '+Object.keys(savedMonths).length+' months.\n\nTry:\n• "Which month had highest cost?"\n• "Compare Feb 2026 vs Jan 2026"\n• "Wire cost trend last 6 months"\n• "Best and worst months for wastage"\n• "Average conversion cost 2025"'});
    renderAIChat();
  }
}

function renderAIChat(){
  const box=document.getElementById('aiMessages');
  box.innerHTML=aiChat.map(m=>{
    const isUser=m.role==='user';
    return `<div style="display:flex;${isUser?'justify-content:flex-end':''}">
      <div style="max-width:85%;padding:10px 14px;border-radius:${isUser?'14px 14px 4px 14px':'14px 14px 14px 4px'};
        background:${isUser?'#1d4ed8':'#1e293b'};color:#e2e8f0;font-size:12px;line-height:1.6;white-space:pre-wrap">${m.text}</div>
    </div>`;
  }).join('');
  box.scrollTop=box.scrollHeight;
}

async function sendAI(){
  const inp=document.getElementById('aiInput');
  const q=inp.value.trim();
  if(!q) return;
  inp.value='';
  aiChat.push({role:'user',text:q});
  aiChat.push({role:'assistant',text:'⏳ Analyzing '+Object.keys(savedMonths).length+' months of data...'});
  renderAIChat();

  // Build DETAILED context from all saved months
  const allMk=Object.keys(savedMonths).sort();
  
  // 1. Monthly cost summary (condensed)
  const costSummary=allMk.map(mk=>{
    const d=savedMonths[mk]; if(!d) return null;
    return `${mk}: Prod=${(d.prodMT||0).toFixed(0)}MT, Wire=${(d.wireCKg||0).toFixed(2)}, Boat=${(d.boatCKg||0).toFixed(2)}, RM=${(d.rmC||0).toFixed(2)}, WasteLoss=${(d.wasteLoss||0).toFixed(2)}, BareW%=${(d.bareWastePct||0).toFixed(2)}, MetW%=${(d.metWastePct||0).toFixed(2)}, BGrade%=${(d.bGradePct||0).toFixed(2)}, MP=${(d.mpKg||0).toFixed(2)}, Pwr=${(d.pwrKg||0).toFixed(2)}, Cons=${(d.consKg||0).toFixed(2)}, Total=${(d.totalC||0).toFixed(2)}, Net=${(d.totalAfterScrap||0).toFixed(2)}, Export=${((d.exportKg||0)/1000).toFixed(1)}MT, Revenue=${d.pl?'₹'+(d.pl.revenue/100000).toFixed(1)+'L':'?'}, Profit=${d.pl?'₹'+(d.pl.profit/100000).toFixed(1)+'L':'?'}, ProfitPerKg=${d.pl&&d.effectiveProd?(d.pl.profit/d.effectiveProd).toFixed(2):'?'}`;
  }).filter(Boolean).join('\n');

  // 2. Material production across months (aggregate all)
  const allMats={}, allCusts={}, allSizes={};
  allMk.forEach(mk=>{
    const d=savedMonths[mk];
    if(!d||!d.zsAgg) return;
    const agg=d.zsAgg;
    if(agg.byMaterial) agg.byMaterial.forEach(m=>{
      if(!allMats[m.code]) allMats[m.code]={code:m.code,desc:m.desc,kg:0,rolls:0,months:[]};
      allMats[m.code].kg+=m.kg; allMats[m.code].rolls+=m.rolls; allMats[m.code].months.push(mk+':'+Math.round(m.kg)+'Kg');
    });
    if(agg.byCustomer) agg.byCustomer.forEach(c=>{
      if(!allCusts[c.name]) allCusts[c.name]={name:c.name,city:c.city,kg:0,rolls:0,months:[],topMats:c.topMats||[]};
      allCusts[c.name].kg+=c.kg; allCusts[c.name].rolls+=c.rolls; allCusts[c.name].months.push(mk+':'+Math.round(c.kg)+'Kg');
    });
    if(agg.bySize) agg.bySize.forEach(s=>{
      const k=s.thick+'×'+s.od;
      if(!allSizes[k]) allSizes[k]={thick:s.thick,od:s.od,kg:0,rolls:0};
      allSizes[k].kg+=s.kg; allSizes[k].rolls+=s.rolls;
    });
  });
  const matList=Object.values(allMats).sort((a,b)=>b.kg-a.kg).slice(0,30);
  const custList=Object.values(allCusts).sort((a,b)=>b.kg-a.kg).slice(0,30);
  const sizeList=Object.values(allSizes).sort((a,b)=>b.kg-a.kg).slice(0,15);

  const matData=matList.map(m=>`${m.code} (${m.desc||''}): ${(m.kg/1000).toFixed(1)}MT, ${m.rolls} rolls [${m.months.slice(-6).join(', ')}]`).join('\n');
  const custData=custList.map(c=>`${c.name} (${c.city}): ${(c.kg/1000).toFixed(1)}MT, ${c.rolls} rolls\n  Materials: ${(c.topMats||[]).slice(0,5).join(', ')}\n  Sizes: ${(c.topSizes||[]).slice(0,5).join(', ')}\n  Months: ${c.months.slice(-4).join(', ')}`).join('\n');
  const sizeData=sizeList.map(s=>`${s.thick}µ ${s.od}OD: ${(s.kg/1000).toFixed(1)}MT, ${s.rolls} rolls`).join('\n');

  // 3. Per-month material detail (top 5 per month for recent 6 months)
  const recentMonths=allMk.slice(-6);
  const monthDetail=recentMonths.map(mk=>{
    const d=savedMonths[mk];
    if(!d||!d.zsAgg||!d.zsAgg.byMaterial) return '';
    const top=d.zsAgg.byMaterial.slice(0,8);
    const custTop=d.zsAgg.byCustomer?d.zsAgg.byCustomer.slice(0,5):[];
    return `\n[${mk}] Materials: ${top.map(m=>m.code+':'+Math.round(m.kg)+'Kg('+m.pct.toFixed(1)+'%)').join(', ')}` +
      (custTop.length?`\n[${mk}] Customers: ${custTop.map(c=>c.name+'('+c.city+'):'+Math.round(c.kg)+'Kg, Sizes:['+(c.topSizes||[]).slice(0,3).join(',')+']').join('; ')}`:'');
  }).filter(Boolean).join('');

  const sysPrompt=`You are MetCost AI, an expert production cost analyst and efficiency advisor for GLS Polyfilms metallised film plant.
You have COMPLETE data for ${allMk.length} months (${allMk[0]} to ${allMk[allMk.length-1]}).

ROLE: Help the manager optimize production costs, plan material scheduling, track customer requirements, and improve efficiency.

RULES:
- Answer with specific numbers from the data. Use ₹ symbol.
- Be concise but thorough. Use tables for comparisons.
- When asked about customers, show their materials, sizes (Thickness×OD×Width), and volumes.
- When asked about efficiency, suggest specific actions based on data trends.
- Material codes: G12301M22 = 12µ Met Plain 2.2OD, G10301ABM25 = 10µ AluBond 2.5OD, prefix 3SF- is removed.
- Costs are ₹/Kg. Production in MT. Grade 2,7,8=A-grade, 3=B-grade.
- Ship-To-Party Name = Customer name. City = their location.
- Customer sizes format: "10µ×2.2OD×600mm" means 10 micron, 2.2 OD, 600mm width.
- For efficiency advice: higher production MT reduces ₹/Kg for fixed costs (MP, Power, Cons). Lower waste% saves directly. Running more days spreads manpower cost.

═══ MONTHLY COST DATA ═══
${costSummary}

═══ MATERIAL PRODUCTION (All-time, top 30) ═══
${matData||'No material data — upload ZSLIT files'}

═══ CUSTOMER DATA with sizes (All-time, top 30) ═══
${custData||'No customer data — upload ZSLIT files'}

═══ SIZE DISTRIBUTION (Thickness × OD) ═══
${sizeData||'No size data'}

═══ RECENT MONTH DETAILS ═══
${monthDetail||'No detailed data'}

═══ RATES & TARGETS (effective ${rates.targetDate||'not set'}) ═══
Wire ₹${rates.wireRate}/Kg, Boat ₹${rates.boatRate}/Pc, Film ₹${rates.baseFilmRate}/Kg, Power ₹${rates.electricityRate}/unit
Targets: Wire ₹${rates.tWire}, Boat ₹${rates.tBoat}, Waste ₹${rates.tWaste}, MP ₹${rates.tManpower}, Power ₹${rates.tPower}, Cons ₹${rates.tCons}
Total target: ₹${(rates.tWire+rates.tBoat+rates.tWaste+rates.tManpower+rates.tPower+rates.tCons+rates.indirectExpense).toFixed(2)}/Kg

═══ BOM DATA (${targets.length} film types) ═══
${targets.slice(0,25).map(t=>t.c+' ('+t.d+'): Wire '+t.w+'Kg/MT, Boat '+t.b+'Pcs/MT').join('\n')}

═══ MATERIAL-WISE CONVERSION COST TARGETS (per product type) ═══
${Object.entries(MATERIAL_TARGETS).map(([k,t])=>k+' ('+t.desc+'): Speed='+t.speed+'m/min, '+t.rolls+' rolls/day, '+t.mt+'MT/day, Wire=₹'+t.wireC+'/Kg, Boat=₹'+t.boatC+'/Kg, Waste='+t.wasteP+'%, Elec=₹'+t.elecC+', Total=₹'+t.total+', Grand=₹'+t.grandTotal+(t.sellPrice?', SellPrice=₹'+t.sellPrice:'')).join('\n')}

═══ MONTHLY P&L DATA ═══
${allMk.map(mk=>{const d=savedMonths[mk];if(!d||!d.zsAgg||!d.zsAgg.revenue) return null;const za=d.zsAgg;const conv=d.effectiveProd*(d.totalWP||0);const cost=za.baseFilmCost+conv;const profit=za.revenue-cost;return mk+': Rev=₹'+Math.round(za.revenue/100000)+'L, Cost=₹'+Math.round(cost/100000)+'L, Profit=₹'+Math.round(profit/100000)+'L ('+((za.revenue>0?profit/za.revenue*100:0).toFixed(1))+'%)'}).filter(Boolean).join('\n')||'No P&L data — set sell prices in BOM table'}

═══ TARGET CHANGE LOG ═══
${(rates.targetRemarks||[]).map(r=>r.date+': '+r.text).join('\n')||'No changes recorded'}`;

  try{
    if(!rates.aiProxyUrl){
      aiChat[aiChat.length-1].text='⚠️ AI not configured.\n\nGo to Settings → AI Configuration:\nPaste your free Gemini API key\n\nGet it free: aistudio.google.com → API Keys → Create';
      renderAIChat();return;
    }
    const geminiUrl='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+rates.aiProxyUrl;
    // Build Gemini format: system instruction + conversation
    const history=aiChat.filter(m=>!m.text.startsWith('⏳')).map(m=>({
      role:m.role==='assistant'?'model':'user',
      parts:[{text:m.text}]
    }));
    const resp=await fetch(geminiUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:sysPrompt}]},
        contents:history,
        generationConfig:{maxOutputTokens:1500,temperature:0.3}
      })
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'No response received.';
    aiChat[aiChat.length-1].text=reply;
  }catch(err){
    aiChat[aiChat.length-1].text='⚠️ Error: '+err.message+'\n\nCheck Settings → AI Configuration → Gemini API key.';
  }
  renderAIChat();
}
</script>
