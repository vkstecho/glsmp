:root{--bg:#f0f2f5;--sf:#fff;--tx:#1a1a2e;--tx2:#64748b;--tx3:#94a3b8;--bd:#e2e8f0;--ac:#0f52ba;--ac2:#e8f0fe;--gn:#16a34a;--gn2:#dcfce7;--rd:#dc2626;--rd2:#fee2e2;--am:#d97706;--am2:#fef3c7;--pp:#7c3aed;--pp2:#ede9fe;--tl:#0d9488;--r:12px;--sh:0 1px 3px rgba(0,0,0,.06);--mn:'JetBrains Mono',monospace;--fn:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hd{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.hd h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.hd p{font-size:11px;opacity:.6;margin-top:1px}
.msel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 8px;border-radius:7px;font-size:12px;font-family:var(--fn)}
.msel option{color:#1a1a2e}
.ct{padding:12px;max-width:900px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:100;padding:2px 0 env(safe-area-inset-bottom,2px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:none;background:none;color:var(--tx3);font-size:9px;font-family:var(--fn);cursor:pointer}
.nb.on{color:var(--ac)}
.nb svg{width:20px;height:20px}
.cd{background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:10px}
.ct2{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mc{background:var(--sf);border-radius:var(--r);padding:12px;box-shadow:var(--sh);border:1px solid var(--bd);border-left:3px solid var(--ac)}
.ml{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mv{font-size:20px;font-weight:700;margin-top:3px;font-family:var(--mn);letter-spacing:-.5px}
.ms{font-size:10px;color:var(--tx3);margin-top:1px}
.fu{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1.5px dashed var(--bd);border-radius:var(--r);cursor:pointer;margin-bottom:6px}
.fu:hover{border-color:var(--ac);background:var(--ac2)}
.fu.dn{border-style:solid;border-color:var(--gn);background:var(--gn2)}
.fi{flex:1;min-width:0}
.fl{font-size:13px;font-weight:700}
.fd{font-size:11px;color:var(--tx2);margin-top:1px}
.fb{font-size:10px;font-weight:700;color:var(--gn);background:rgba(22,163,74,.1);padding:2px 8px;border-radius:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);border-bottom:2px solid var(--bd);font-weight:700}
.tb td{padding:7px 8px;border-bottom:1px solid var(--bd)}
.tb .n{text-align:right;font-family:var(--mn);font-size:12px}
.tb .st td{font-weight:700;background:var(--ac2)}
.tb .tt td{font-weight:700;background:var(--bg);border-top:2px solid var(--tx)}
.tg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.tg-g{background:var(--gn2);color:var(--gn)}
.tg-r{background:var(--rd2);color:var(--rd)}
.tg-a{background:var(--am2);color:var(--am)}
.tgg{display:grid;gap:8px}
.tgc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;position:relative}
.tgc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tgco{font-family:var(--mn);font-size:12px;font-weight:700;color:var(--ac)}
.tgd{font-size:12px;color:var(--tx2);margin:3px 0 8px}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tgs-l{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
.tgs-v{font-weight:700;font-family:var(--mn);font-size:12px}
.tgx{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--tx3);cursor:pointer;padding:3px;border-radius:4px;font-size:16px}
.tgx:hover{color:var(--rd);background:var(--rd2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;font-family:var(--fn);font-size:12px;font-weight:700;cursor:pointer}
.bp{background:var(--ac);color:#fff}
.bo{background:none;border:1.5px solid var(--bd);color:var(--tx)}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fg input{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:var(--fn);background:var(--sf);color:var(--tx)}
.fg input:focus{outline:none;border-color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mo>.mx{background:var(--sf);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.mx h3{font-size:16px;font-weight:700;margin-bottom:14px}
.rc{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.rc:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:500}
.ru{font-size:11px;color:var(--tx3)}
.ri{width:90px;text-align:right;padding:6px 8px;border:1.5px solid var(--bd);border-radius:7px;font-family:var(--mn);font-size:13px;font-weight:600}
.ri:focus{outline:none;border-color:var(--ac)}
.nd{text-align:center;padding:32px 16px;color:var(--tx3)}
.nd p{font-size:13px}
.wb{margin:10px 0}
.wl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.wl span:last-child{font-family:var(--mn);font-weight:700}
.wt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.wf{height:100%;border-radius:4px;transition:width .5s}
.er{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800}
.e1{background:#fef3c7;color:#92400e}
.e2{background:#e2e8f0;color:#475569}
.e3{background:#fed7aa;color:#9a3412}
.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
body{padding-bottom:56px}
.pr{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--ac2);color:var(--ac);border-radius:7px;font-size:12px;font-weight:600;margin:6px 0}
@keyframes sp{to{transform:rotate(360deg)}}
.sn{width:14px;height:14px;border:2px solid var(--ac2);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite}
.mp-card{background:linear-gradient(135deg,rgba(168,85,247,.06),rgba(14,165,233,.04));border:1px solid rgba(168,85,247,.2);border-radius:var(--r);padding:14px;margin-bottom:10px}

function initMonths(){
  const s=document.getElementById('monthSel');
  let h='';
  const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(let i=0;i<12;i++){
    const d=new Date();d.setMonth(d.getMonth()-i);
    const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    h+=`<option value="${v}"${v===selMonth?' selected':''}>${mn[d.getMonth()]} ${d.getFullYear()}</option>`;
  }
  s.innerHTML=h;
  s.onchange=function(){selMonth=this.value;render()};
}

function parseXL(file,cb){
  const r=new FileReader();
  r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:null}))};
  r.readAsArrayBuffer(file);
}

function detectFileType(headers){
  const h=headers.map(x=>String(x||'').toLowerCase().trim());
  const has=(...keys)=>keys.every(k=>h.some(x=>x.includes(k)));
  if(has('amt.in loc.cur')&&has('movement type')&&has('material')&&!has('cost center')) return 'mb51';
  if(has('date of production')||has('movment type')&&has('machine')&&has('setup time')) return 'zjumbo';
  if(has('move type')&&has('net weight')&&has('grade')&&has('sales order')) return 'zslit';
  if(has('met-1')&&has('met-2')||has('total met')||has('met+%utility share')) return 'electricity';
  if(has('cost center')&&has('amt.in loc.cur')) return 'consSpares';
  if(has('material')&&has('amt.in loc.cur')&&h.some(x=>x.includes('posting date'))) return 'mb51';
  return null;
}

const FILE_COLORS={mb51:'#0f52ba',zjumbo:'#0d9488',zslit:'#7c3aed',electricity:'#d97706',consSpares:'#16a34a'};

function handleMultiUpload(inp){
  if(!inp.files||!inp.files.length)return;
  const fileList=Array.from(inp.files);
  processing='multi';uploadLog=[];render();
  let done=0;
  fileList.forEach(file=>{
    parseXL(file,data=>{
      if(!data||!data.length){uploadLog.push({name:file.name,status:'empty',type:null});done++;if(done===fileList.length){processing=null;render()}return}
      const headers=Object.keys(data[0]);
      const type=detectFileType(headers);
      if(type){
        rawData[type]=data;
        uploads[type]={name:file.name,rows:data.length};
        uploadLog.push({name:file.name,status:'ok',type});
      }else{
        uploadLog.push({name:file.name,status:'unknown',type:null,headers:headers.slice(0,5).join(', ')});
      }
      done++;
      if(done===fileList.length){processing=null;render()}
    });
  });
}

function parseDate(v){if(v instanceof Date)return v;if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?null:d}if(typeof v==='string'){const d=new Date(v);return isNaN(d)?null:d}return null}

function compute(){
  const{mb51,zslit,electricity,consSpares}=rawData;
  if(!mb51&&!zslit)return null;
  const ms=new Date(selMonth+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0);
  const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};

  // Wire
  let wireAmt=0,wireN=0;
  if(mb51){const r=mb51.filter(r=>String(r.Material||'').toLowerCase().includes('3rm-alw')&&inM(r['Posting Date']));wireAmt=-r.reduce((s,r)=>s+(Number(r['Amt.in Loc.Cur.'])||0),0);wireN=r.length}

  // Boat
  let boatAmt=0,boatN=0;
  if(mb51){const r=mb51.filter(r=>String(r.Material||'').toLowerCase().includes('3rm-evb')&&inM(r['Posting Date']));boatAmt=-r.reduce((s,r)=>s+(Number(r['Amt.in Loc.Cur.'])||0),0);boatN=r.length}

  // Slit production
  let prodKg=1,slitAKg=0,slitBKg=0,wasteKg=0;
  if(zslit){
    const sm=zslit.filter(r=>inM(r.Date||r['Posting Date']));
    const p101=sm.filter(r=>String(r['Move Type']||r['Movement type']||'')=='101');
    prodKg=p101.reduce((s,r)=>s+(Number(r['Net Weight'])||0),0)||1;
    slitAKg=p101.filter(r=>String(r.Grade||r.Quality||'')=='2').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    slitBKg=p101.filter(r=>String(r.Grade||r.Quality||'')!='2'&&Number(r['Net Weight']||0)>0).reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    wasteKg=sm.filter(r=>{const m=String(r['Move Type']||r['Movement type']||'');return m=='531'||m=='309'}).reduce((s,r)=>s+Math.abs(Number(r['Net Weight']||r['Gross Weight'])||0),0);
  }

  // Electricity
  let pwrU=0;
  if(electricity){electricity.filter(r=>inM(r.Date)).forEach(r=>{pwrU+=Number(r['Met+%Utility Share']||r['Total Met']||0)})}
  const pwrCost=pwrU*rates.electricityRate;

  // Cons & Spares
  let consAmt=0;
  if(consSpares){consSpares.filter(r=>{const cc=String(r['Cost Center']||'');return(cc=='3030010082'||cc=='3030010083')&&inM(r['Posting Date'])}).forEach(r=>{consAmt+=-( Number(r['Amt.in Loc.Cur.'])||0)})}

  // Manpower from parent
  const mpData=manpowerData[selMonth];
  const mpTotal=mpData?mpData.totalNet:0;

  const wireCKg=wireAmt/prodKg,boatCKg=boatAmt/prodKg,rmC=wireCKg+boatCKg;
  const wastePct=wasteKg/(prodKg+wasteKg)*100,bGradePct=slitBKg/prodKg*100;
  const wasteLoss=(wastePct*rates.baseFilmRate*0.5+bGradePct*(rates.baseFilmRate+5)*0.01);
  const bGradeLoss=bGradePct*10/100;
  const mpKg=mpTotal/prodKg;
  const pwrKg=pwrCost/prodKg,consKg=consAmt/prodKg;
  const convC=wasteLoss+bGradeLoss+mpKg+pwrKg+consKg+rates.indirectExpense;
  const totalC=rmC+convC,totalWP=totalC+rates.packingFreight;

  return{prodKg,prodMT:prodKg/1000,slitAKg,slitBKg,wasteKg,wireAmt,boatAmt,wireN,boatN,wireCKg,boatCKg,rmC,wastePct,bGradePct,wasteLoss,bGradeLoss,mpKg,mpTotal,pwrKg,pwrU,pwrCost,consKg,consAmt,convC,totalC,totalWP,mpData};
}

    const vacMin=rollsPerDay*(cy.vacuum+cy.heating);
    const ventMin=rollsPerDay*cy.vent;
    const totalUsed=rollsPerDay*oneRoll+bc+sc;
    const idle=1440-totalUsed;

    // 1440 bar segments
    const pcts=[
      {l:'Running',m:runMin,col:'var(--gn)'},
      {l:'Setup',m:setupMin,col:'var(--am)'},
      {l:'Vacuum+Heat',m:vacMin,col:'var(--ac)'},
      {l:'Vent',m:ventMin,col:'var(--tl)'},
      {l:'Boat change',m:bc,col:'var(--pp)'},
      {l:'Source clean',m:sc,col:'var(--rd)'},
      {l:'Idle/buffer',m:idle,col:'var(--bd)'},
    ];

    let barHtml='<div style="display:flex;height:20px;border-radius:6px;overflow:hidden;margin:10px 0">';
    pcts.forEach(p=>{ barHtml+=`<div style="width:${(p.m/1440*100).toFixed(1)}%;background:${p.col}" title="${p.l}: ${p.m} min"></div>`; });
    barHtml+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px">';
    pcts.forEach(p=>{ barHtml+=`<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:${p.col};display:inline-block"></span>${p.l} ${p.m}m</span>`; });
    barHtml+='</div>';

    // Capacity table
    let capHtml='<div class="sx"><table class="tb"><thead><tr><th>Mic</th><th>OD</th><th class="n">M-1 MT</th><th class="n">M-2 MT</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">Waste%</th></tr></thead><tbody>';
    MACHINE_DATA.capacity.forEach(r=>{
      capHtml+=`<tr><td>${r.mic}µ</td><td>${r.od}</td><td class="n">${r.m1}</td><td class="n">${r.m2}</td><td class="n">${r.wire}</td><td class="n">${r.boat}</td><td class="n">${r.waste}%</td></tr>`;
    });
    capHtml+='</tbody></table></div>';

    // BOM table
    let bomHtml='<div class="sx"><table class="tb"><thead><tr><th>Code</th><th>Description</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">BOM</th><th></th></tr></thead><tbody>';
    filtered.forEach(t=>{
      bomHtml+=`<tr><td style="font-family:var(--mn);font-size:11px;font-weight:600;color:var(--ac)">${t.c}</td><td style="font-size:11px">${t.d}</td><td class="n">${t.w}</td><td class="n">${t.b}</td><td class="n">${fmt(t.bom,1)}</td><td><button onclick="removeTarget(${t.id})" style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px">×</button></td></tr>`;
    });
    bomHtml+='</tbody></table></div>';

    ct.innerHTML=`
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">Machine & targets</div>

      <div class="cd">
        <div class="ct2">1440 minutes — 24 hour cycle (Met-1)</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn);color:var(--gn)">${rollsPerDay}</div><div style="font-size:10px;color:var(--tx2)">Rolls/day</div></div>
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn)">${oneRoll}</div><div style="font-size:10px;color:var(--tx2)">Min/roll</div></div>
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn);color:var(--ac)">${runMin}</div><div style="font-size:10px;color:var(--tx2)">Running min</div></div>
        </div>
        ${barHtml}
        <div class="sx" style="margin-top:8px"><table class="tb"><thead><tr><th>Process</th><th class="n">Per roll</th><th class="n">×${rollsPerDay} rolls</th><th class="n">% of day</th></tr></thead><tbody>
          <tr><td>Setup time</td><td class="n">${cy.setup} min</td><td class="n">${setupMin} min</td><td class="n">${fmt(setupMin/1440*100,1)}%</td></tr>
          <tr><td>Vacuum + heating</td><td class="n">${cy.vacuum+cy.heating} min</td><td class="n">${vacMin} min</td><td class="n">${fmt(vacMin/1440*100,1)}%</td></tr>
          <tr><td>Running</td><td class="n">${cy.running} min</td><td class="n">${runMin} min</td><td class="n">${fmt(runMin/1440*100,1)}%</td></tr>
          <tr><td>Vent</td><td class="n">${cy.vent} min</td><td class="n">${ventMin} min</td><td class="n">${fmt(ventMin/1440*100,1)}%</td></tr>
          <tr><td>Boat change</td><td class="n">—</td><td class="n">${bc} min</td><td class="n">${fmt(bc/1440*100,1)}%</td></tr>
          <tr><td>Source cleaning</td><td class="n">—</td><td class="n">${sc} min</td><td class="n">${fmt(sc/1440*100,1)}%</td></tr>
          <tr class="tt"><td>Total</td><td class="n">${oneRoll} min</td><td class="n">${totalUsed} min</td><td class="n">${fmt(totalUsed/1440*100,1)}%</td></tr>
        </tbody></table></div>
      </div>

      <div class="cd">
        <div class="ct2">Machine capacity — daily output targets</div>
        <div style="font-size:11px;color:var(--tx2);margin-bottom:8px">M-1 width: ${MACHINE_DATA.met1.width}mm (met: ${MACHINE_DATA.met1.metWidth}mm) · M-2 width: ${MACHINE_DATA.met2.width}mm (met: ${MACHINE_DATA.met2.metWidth}mm)</div>
        ${capHtml}
      </div>

      <div class="cd">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="ct2" style="margin:0">BOM — all ${targets.length} film types</div>
          <button class="btn bp" onclick="showAddTarget()" style="font-size:10px;padding:5px 10px">+ Add</button>
        </div>
        <input id="tgtSearch" type="text" placeholder="Search film code or description..." value="${tgtSearch||''}" oninput="tgtSearch=this.value;render()" style="width:100%;padding:7px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:12px;font-family:var(--fn);margin-bottom:8px;background:var(--bg)">
        <div style="font-size:11px;color:var(--tx3);margin-bottom:6px">Showing ${filtered.length} of ${targets.length} · Wire Kg/MT · Boat Pcs/MT · BOM Qty/MT</div>
        ${bomHtml}
      </div>
      <div id="addModal"></div>`;

    if(tgtSearch){const el=document.getElementById('tgtSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  }

  else if(tab==='set'){
    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:4px">Rate card settings</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Changes reflect in all calculations instantly</p>
      <div class="cd">${[
        {k:'electricityRate',l:'Electricity rate',u:'₹ per kWh'},
        {k:'baseFilmRate',l:'Base film rate',u:'₹ per Kg'},
        {k:'indirectExpense',l:'Indirect expense',u:'₹ per Kg'},
        {k:'packingFreight',l:'Packing & freight',u:'₹ per Kg'},
      ].map(r=>`<div class="rc"><div><div class="rn">${r.l}</div><div class="ru">${r.u}</div></div>
        <input class="ri" type="number" step="0.01" value="${rates[r.k]}" onchange="rates.${r.k}=Number(this.value)||0;render()"></div>`).join('')}
      </div>
      <div class="cd"><div class="ct2">Data management</div>
        <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Uploaded data is held in browser memory for this session.</p>
        <button class="btn bo" onclick="uploads={};rawData={};uploadLog=[];render()" style="font-size:11px">Clear all uploads</button>
      </div>`;
  }
}

function showAddTarget(){
  const m=document.getElementById('addModal');
  if(!m)return;
  m.innerHTML=`<div class="mo" onclick="document.getElementById('addModal').innerHTML=''">
    <div class="mx" onclick="event.stopPropagation()">
      <h3>Add film type target</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg"><label>Film code</label><input id="nc" placeholder="G15301M22"></div>
        <div class="fg"><label>Description</label><input id="nd" placeholder="15µ Met 2.2OD"></div>
        <div class="fg"><label>Wire Kg/MT</label><input id="nw" type="number" step="0.01"></div>
        <div class="fg"><label>Boat Pcs/MT</label><input id="nb" type="number" step="0.01"></div>
        <div class="fg" style="grid-column:span 2"><label>BOM Qty/MT</label><input id="nbom" type="number" step="0.01" value="1005"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button class="btn bo" onclick="document.getElementById('addModal').innerHTML=''">Cancel</button>
        <button class="btn bp" onclick="addTarget()">Add target</button>
      </div>
    </div></div>`;
}

function addTarget(){
  const c=document.getElementById('nc').value,d=document.getElementById('nd').value;
  if(!c||!d)return;
  targets.push({id:Date.now(),c,d,w:Number(document.getElementById('nw').value)||0,b:Number(document.getElementById('nb').value)||0,bom:Number(document.getElementById('nbom').value)||1005});
  document.getElementById('addModal').innerHTML='';
  render();
}
function removeTarget(id){targets=targets.filter(t=>t.id!==id);render()}

initMonths();
render();

// Request data from parent on load
setTimeout(()=>{try{window.parent.postMessage({type:'REQUEST_MANPOWER'},'*')}catch(e){}},500);
</script>
</body>
</html>
