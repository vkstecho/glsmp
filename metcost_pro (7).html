<style>
:root{--bg:#f0f2f5;--sf:#fff;--tx:#1a1a2e;--tx2:#64748b;--tx3:#94a3b8;--bd:#e2e8f0;--ac:#0f52ba;--ac2:#e8f0fe;--gn:#16a34a;--gn2:#dcfce7;--rd:#dc2626;--rd2:#fee2e2;--am:#d97706;--am2:#fef3c7;--pp:#7c3aed;--pp2:#ede9fe;--tl:#0d9488;--r:12px;--sh:0 1px 3px rgba(0,0,0,.06);--mn:'JetBrains Mono',monospace;--fn:'DM Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hd{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.hd h1{font-size:16px;font-weight:700;letter-spacing:-.3px}
.hd p{font-size:11px;opacity:.6;margin-top:1px}
.msel{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:5px 8px;border-radius:7px;font-size:12px;font-family:var(--fn)}
.msel option{color:#1a1a2e}
.ct{padding:12px;max-width:900px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;z-index:100;padding:2px 0 env(safe-area-inset-bottom,2px)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:none;background:none;color:var(--tx3);font-size:9px;font-family:var(--fn);cursor:pointer}
.nb.on{color:var(--ac)}
.nb svg{width:20px;height:20px}
.cd{background:var(--sf);border-radius:var(--r);padding:14px;box-shadow:var(--sh);border:1px solid var(--bd);margin-bottom:10px}
.ct2{font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mc{background:var(--sf);border-radius:var(--r);padding:12px;box-shadow:var(--sh);border:1px solid var(--bd);border-left:3px solid var(--ac)}
.ml{font-size:10px;color:var(--tx2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.mv{font-size:20px;font-weight:700;margin-top:3px;font-family:var(--mn);letter-spacing:-.5px}
.ms{font-size:10px;color:var(--tx3);margin-top:1px}
.fu{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1.5px dashed var(--bd);border-radius:var(--r);cursor:pointer;margin-bottom:6px}
.fu:hover{border-color:var(--ac);background:var(--ac2)}
.fu.dn{border-style:solid;border-color:var(--gn);background:var(--gn2)}
.fi{flex:1;min-width:0}
.fl{font-size:13px;font-weight:700}
.fd{font-size:11px;color:var(--tx2);margin-top:1px}
.fb{font-size:10px;font-weight:700;color:var(--gn);background:rgba(22,163,74,.1);padding:2px 8px;border-radius:12px}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{text-align:left;padding:7px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tx3);border-bottom:2px solid var(--bd);font-weight:700}
.tb td{padding:7px 8px;border-bottom:1px solid var(--bd)}
.tb .n{text-align:right;font-family:var(--mn);font-size:12px}
.tb .st td{font-weight:700;background:var(--ac2)}
.tb .tt td{font-weight:700;background:var(--bg);border-top:2px solid var(--tx)}
.tg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700}
.tg-g{background:var(--gn2);color:var(--gn)}
.tg-r{background:var(--rd2);color:var(--rd)}
.tg-a{background:var(--am2);color:var(--am)}
.tgg{display:grid;gap:8px}
.tgc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px;position:relative}
.tgc:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tgco{font-family:var(--mn);font-size:12px;font-weight:700;color:var(--ac)}
.tgd{font-size:12px;color:var(--tx2);margin:3px 0 8px}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tgs-l{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
.tgs-v{font-weight:700;font-family:var(--mn);font-size:12px}
.tgx{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--tx3);cursor:pointer;padding:3px;border-radius:4px;font-size:16px}
.tgx:hover{color:var(--rd);background:var(--rd2)}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;font-family:var(--fn);font-size:12px;font-weight:700;cursor:pointer}
.bp{background:var(--ac);color:#fff}
.bo{background:none;border:1.5px solid var(--bd);color:var(--tx)}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fg input{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:13px;font-family:var(--fn);background:var(--sf);color:var(--tx)}
.fg input:focus{outline:none;border-color:var(--ac)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.mo>.mx{background:var(--sf);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto}
.mx h3{font-size:16px;font-weight:700;margin-bottom:14px}
.rc{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.rc:last-child{border-bottom:none}
.rn{font-size:13px;font-weight:500}
.ru{font-size:11px;color:var(--tx3)}
.ri{width:90px;text-align:right;padding:6px 8px;border:1.5px solid var(--bd);border-radius:7px;font-family:var(--mn);font-size:13px;font-weight:600}
.ri:focus{outline:none;border-color:var(--ac)}
.nd{text-align:center;padding:32px 16px;color:var(--tx3)}
.nd p{font-size:13px}
.wb{margin:10px 0}
.wl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.wl span:last-child{font-family:var(--mn);font-weight:700}
.wt{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.wf{height:100%;border-radius:4px;transition:width .5s}
.er{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800}
.e1{background:#fef3c7;color:#92400e}
.e2{background:#e2e8f0;color:#475569}
.e3{background:#fed7aa;color:#9a3412}
.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
body{padding-bottom:56px}
.pr{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--ac2);color:var(--ac);border-radius:7px;font-size:12px;font-weight:600;margin:6px 0}
@keyframes sp{to{transform:rotate(360deg)}}
.sn{width:14px;height:14px;border:2px solid var(--ac2);border-top-color:var(--ac);border-radius:50%;animation:sp .6s linear infinite}
.mp-card{background:linear-gradient(135deg,rgba(168,85,247,.06),rgba(14,165,233,.04));border:1px solid rgba(168,85,247,.2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.mp-card .ct2{color:var(--pp)}
</style>
</head>

// Columns needed per file type (strip everything else to save memory)
const KEEP_COLS={
  zslit:['Date','Order','Material','Thickness','Machine','OD','Move Type','Net Weight','Grade','Sales Order','Ship-To-Party City',
    'OD_1','Avg. Mic','OD Eqv.','Mic Eqv.','Equivalent Output','Width'],
  mb51:['Posting Date','Order','Material','Batch','Valuation Type','Material Description','Movement type','Qty in unit of entry','Amt.in Loc.Cur.','Cost Center','Remarks','Downtime Remark','Down Time','Down Time_1'],
  zjumbo:['Date of Production','Machine','Movment Type','Movement type','Quantity','Chamber Open Date','Chamber Open Time','Vent time','Web End Time','Setup Time','Remarks','Downtime Remark','Down Time','Down Time_1','Width','Width_1'],
};

function trimData(data,type){
  if(!data||!data.length||!KEEP_COLS[type]) return data;
  if(type==='zjumbo') return data; // don't trim ZJUMBO — small file, needs all cols for time parsing
  const keep=new Set(KEEP_COLS[type]);
  return data.map(row=>{
    const out={};
    for(const k of Object.keys(row)){
      if(keep.has(k)) out[k]=row[k];
    }
    return out;
  });
}

function parseXL(file,cb,headerRow){
  const sizeMB=file.size/1024/1024;
  const r=new FileReader();
  r.onerror=()=>{cb(null,null,null,'Read failed: '+file.name)};
  r.onload=e=>{
    try{
      const opts={type:'array',cellDates:true,cellFormula:false,cellStyles:false,cellHTML:false,cellNF:false,cellText:false,
        bookVBA:false,bookProps:false,bookDeps:false,sheetStubs:false};
      if(sizeMB>20) opts.dense=true; // ZSLIT (23-42MB) uses dense, ZJUMBO (10MB) stays normal
      // For very large files (>80MB), also use raw mode and skip type inference
      if(sizeMB>80) opts.raw=true;
      const wb=XLSX.read(e.target.result,opts);
      // Release ArrayBuffer immediately after XLSX.read
      e.target.result=null;
      const ws=wb.Sheets[wb.SheetNames[0]];
      let data;
      if(headerRow){
        data=XLSX.utils.sheet_to_json(ws,{defval:null,range:headerRow-1,raw:sizeMB>80});
      }else{
        data=XLSX.utils.sheet_to_json(ws,{defval:null,raw:sizeMB>80});
      }
      // Clear worksheet from workbook to free memory
      wb.Sheets[wb.SheetNames[0]]=null;
      cb(data,wb,ws,null);
    }catch(err){
      console.error('Parse error for '+file.name+' ('+sizeMB.toFixed(1)+'MB):', err);
      cb(null,null,null,'Parse error ('+sizeMB.toFixed(0)+'MB): '+(err.message||'Unknown').slice(0,80));
    }
  };
  r.readAsArrayBuffer(file);
}

function detectFileType(headers){
  const h=headers.map(x=>String(x||'').toLowerCase().trim());
  const has=(...keys)=>keys.every(k=>h.some(x=>x.includes(k)));
  // ELECTRICITY first — because re-parsed electricity row3 has extra cols that look like ZJUMBO
  if(has('met-1')&&has('met-2')) return 'electricity';
  if(has('met+%utility share')) return 'electricity';
  if(has('total met')&&has('process plant')) return 'electricity';
  if(has('process plant')&&has('chillers')&&has('utility')) return 'electricity';
  // MB51
  if(has('amt.in loc.cur')&&has('movement type')&&has('material')&&!has('cost center')&&!has('met-1')) return 'mb51';
  // ZJUMBO — require both machine AND setup time (not just date of production alone)
  if(has('date of production')&&has('machine')&&(has('setup time')||has('chamber open'))) return 'zjumbo';
  if(has('movment type')&&has('machine')&&has('setup time')) return 'zjumbo';
  // ZSLIT
  if(has('move type')&&has('net weight')&&has('grade')&&has('sales order')) return 'zslit';
  // Cons & Spares
  if(has('cost center')&&has('amt.in loc.cur')) return 'consSpares';
  // MB51 fallback
  if(has('material')&&has('amt.in loc.cur')&&h.some(x=>x.includes('posting date'))) return 'mb51';
  return null;
}

// Scan raw worksheet cells for electricity keywords (rows 1-5)
function scanForElectricity(ws){
  const range=XLSX.utils.decode_range(ws['!ref']||'A1');
  for(let r=0;r<=Math.min(4,range.e.r);r++){
    for(let c=0;c<=Math.min(25,range.e.c);c++){
      const addr=XLSX.utils.encode_cell({r,c});
      const cell=ws[addr];
      if(cell&&cell.v){
        const v=String(cell.v).toLowerCase();
        if(v.includes('met-1')||v.includes('met-2')||v.includes('total met')||v.includes('process plant')||v.includes('met+%utility')) return r+1;
      }
    }
  }
  return 0;
}

const FILE_LABELS={mb51:'MB51 (SAP Movements)',zjumbo:'ZJUMBO_PROD (Met Prod)',zslit:'ZSLIT_PROD (Slit Prod)',electricity:'Electricity Cost',consSpares:'Cons & Spares'};

function handleMultiUpload(inp){
  if(!inp.files||!inp.files.length)return;
  const fileList=Array.from(inp.files);
  processing='multi';uploadLog=[];render();

  // Process files ONE AT A TIME to avoid browser memory crash on large files
  let idx=0;
  function processNext(){
    if(idx>=fileList.length){
      processing=null;
      const result=computeAndSaveAll();
      lastComputeResult=result;
      render();
      return;
    }
    const file=fileList[idx];
    const sizeMB=(file.size/1024/1024).toFixed(1);
    processing='multi ('+file.name+' · '+sizeMB+'MB)';render();

    parseXL(file,(data,wb,ws,err)=>{
      if(err||!data||!data.length){
        const failMsg=sizeMB>50?(err||'File too large for browser')+'<br>→ Open in Excel → Save As → CSV (.csv) → Upload CSV instead':err||'empty';
        uploadLog.push({name:file.name,status:failMsg,type:null,size:sizeMB});
        idx++;setTimeout(processNext,100); // small delay to let browser GC
        return;
      }
      const headers=Object.keys(data[0]);
      let type=detectFileType(headers);

      if(!type&&ws){
        const elecRow=scanForElectricity(ws);
        console.log(`[MetCost] ${file.name}: first detect=${type}, scanForElectricity=${elecRow}`);
        if(elecRow>1){
          try{
            const reData=XLSX.utils.sheet_to_json(ws,{defval:null,range:elecRow-1});
            console.log(`[MetCost] ${file.name}: re-parsed from row ${elecRow}, got ${reData?reData.length:0} rows, headers: ${reData&&reData[0]?Object.keys(reData[0]).slice(0,8).join(', '):'NONE'}`);
            if(reData&&reData.length){
              const reType=detectFileType(Object.keys(reData[0]));
              console.log(`[MetCost] ${file.name}: re-detect=${reType}`);
              if(reType){type=reType;data=reData}
            }
          }catch(e){console.error('[MetCost] Electricity re-parse error:',e)}
        }
      }

      if(type){
        // Trim unused columns to free memory (critical for 100MB+ files)
        data=trimData(data,type);
        // For raw-mode parsed files (>80MB), convert Excel serial dates to JS Date objects
        if(file.size>80*1024*1024){
          const dateKeys=type==='zslit'?['Date']:type==='mb51'?['Posting Date']:type==='zjumbo'?['Date of Production','Chamber Open Date']:['Date'];
          data.forEach(row=>{
            dateKeys.forEach(k=>{
              if(row[k]&&typeof row[k]==='number'&&row[k]>40000){
                row[k]=new Date((row[k]-25569)*86400000);
              }
            });
          });
        }
        // APPEND data — don't replace (supports multiple files of same type)
        if(rawData[type]){
          rawData[type]=rawData[type].concat(data);
          uploads[type].name+=' + '+file.name;
          uploads[type].rows+=data.length;
          uploads[type].size=((parseFloat(uploads[type].size)||0)+parseFloat(sizeMB)).toFixed(1);
          uploads[type].files=(uploads[type].files||1)+1;
        }else{
          rawData[type]=data;
          uploads[type]={name:file.name,rows:data.length,size:sizeMB,files:1};
        }
        uploadLog.push({name:file.name,status:'ok',type,size:sizeMB,rows:data.length});
        console.log(`[MetCost] ✅ ${file.name} → ${type} (${data.length} rows, ${sizeMB}MB)`);
      }else{
        uploadLog.push({name:file.name,status:'unknown',type:null,headers:headers.slice(0,5).join(', '),size:sizeMB});
        console.warn(`[MetCost] ❌ ${file.name}: NOT DETECTED. Headers: ${headers.slice(0,8).join(', ')}`);
      }
      idx++;setTimeout(processNext,file.size>20*1024*1024?500:100); // delay for GC on large files
    });
  }
  processNext();
}

function parseDate(v){if(v instanceof Date)return v;if(typeof v==='number'){const d=new Date((v-25569)*86400000);return isNaN(d)?null:d}if(typeof v==='string'){const d=new Date(v);return isNaN(d)?null:d}return null}

// Scan all uploaded data to find which months are present

// Compute conversion cost for ONE specific month
function computeMonth(monthKey){
  const{mb51,zslit,electricity,consSpares}=rawData;
  if(!mb51)return null;
  const ms=new Date(monthKey+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
  const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};

  // Wire cost: MB51 Material contains 3RM-ALW, Col V (Amt) + Col H (Qty in Kgs)
  let wireAmt=0,wireN=0,wireKgsTotal=0;
  mb51.filter(r=>String(r.Material||'').toUpperCase().includes('3RM-ALW')&&inM(r['Posting Date'])).forEach(r=>{
    wireAmt+=-(Number(r['Amt.in Loc.Cur.'])||0);
    wireKgsTotal+=Math.abs(Number(r['Qty in unit of entry']||0));
    wireN++;
  });

  // Boat cost: MB51 Material contains 3RM-EVB, Col V + Col H (Qty in Pcs) — with type breakdown
  let boatAmt=0,boatN=0,boatPcsTotal=0;
  const boatTypes={Libra:{qty:0,amt:0},OKOSU:{qty:0,amt:0},Supervac:{qty:0,amt:0}};
  mb51.filter(r=>String(r.Material||'').toUpperCase().includes('3RM-EVB')&&inM(r['Posting Date'])).forEach(r=>{
    const amt=Math.abs(Number(r['Amt.in Loc.Cur.'])||0);
    const qty=Math.abs(Number(r['Qty in unit of entry'])||0);
    boatAmt+=amt;boatN++;boatPcsTotal+=qty;
    const batch=String(r.Batch||r['Valuation Type']||'').toUpperCase();
    if(batch.startsWith('LIB')){boatTypes.Libra.qty+=qty;boatTypes.Libra.amt+=amt}
    else if(batch.startsWith('OKO')){boatTypes.OKOSU.qty+=qty;boatTypes.OKOSU.amt+=amt}
    else if(batch.startsWith('SUP')){boatTypes.Supervac.qty+=qty;boatTypes.Supervac.amt+=amt}
  });

  // SLIT PRODUCTION: MB51 Orders 304/306, Mvt 101, Col H (Qty in unit of entry = KG)
  let prodKg=0;
  mb51.filter(r=>{
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    return(ord.startsWith('304')||ord.startsWith('306'))&&mvt==='101'&&inM(r['Posting Date']);
  }).forEach(r=>{prodKg+=Number(r['Qty in unit of entry']||0)});

  // MET JUMBO PRODUCTION: MB51 Orders 303/305, Mvt 101
  let metJumboKg=0;
  mb51.filter(r=>{
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    return(ord.startsWith('303')||ord.startsWith('305'))&&mvt==='101'&&inM(r['Posting Date']);
  }).forEach(r=>{metJumboKg+=Number(r['Qty in unit of entry']||0)});

  if(!prodKg||prodKg<1) return null;

  // GRADE CATEGORIZATION from ZSLIT (Move Type 101 only) — MUST be before bare/met waste
  let slitAKg=0,slitBKg=0,grade5Kg=0,grade6Kg=0,equivKg=0,exportKg=0,domesticKg=0,heatSealKg=0;
  if(zslit){
    const sm=zslit.filter(r=>inM(r.Date||r['Posting Date']));
    const p101=sm.filter(r=>String(r['Move Type']||'')=='101');
    slitAKg=p101.filter(r=>{const g=String(r.Grade||'');return g==='2'||g==='7'||g==='8'}).reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    slitBKg=p101.filter(r=>String(r.Grade||'')==='3').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    grade5Kg=p101.filter(r=>String(r.Grade||'')==='5').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    grade6Kg=p101.filter(r=>String(r.Grade||'')==='6').reduce((s,r)=>s+(Number(r['Net Weight'])||0),0);
    equivKg=p101.reduce((s,r)=>{const v=Number(r['Equivalent Output']||0);return s+(v>0?v:0)},0);
    // Export vs Domestic (Sales Order starting with 3302 = export) & Heat Seal (SLC/LCM in material)
    p101.filter(r=>{const g=String(r.Grade||'');return g!=='5'&&g!=='6'}).forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      const so=String(r['Sales Order']||'').trim();
      const mat=String(r.Material||'').toUpperCase();
      if(so.startsWith('3302')) exportKg+=nw; else domesticKg+=nw;
      if(mat.includes('SLC')||mat.includes('LCM')) heatSealKg+=nw;
    });
  }

  // BARE WASTE: MB51 Orders 303/305, Input(261+262 with 3FG* material) - Output(101+102)
  // MET WASTE: MB51 Orders 304/306, Input(261+262 with 3SF* material) - Output(101+102) + Grade 6
  // Excel only counts FILM materials in input (excludes wire/boat consumed in same order)
  let bareIn=0,bareOut=0,metSlitIn=0,metSlitOut=0;
  mb51.filter(r=>inM(r['Posting Date'])).forEach(r=>{
    const ord=String(r.Order||'').trim();
    const mvt=String(r['Movement type']||'').trim();
    const qty=Math.abs(Number(r['Qty in unit of entry']||0));
    const mat=String(r.Material||'').toUpperCase();
    const isBare=ord.startsWith('303')||ord.startsWith('305');
    const isMet=ord.startsWith('304')||ord.startsWith('306');
    if(isBare){
      if((mvt==='261'||mvt==='262')&&mat.startsWith('3FG')) bareIn+=qty; // only base film input
      else if(mvt==='101'||mvt==='102') bareOut+=qty; // all output
    }
    if(isMet){
      if((mvt==='261'||mvt==='262')&&mat.startsWith('3SF')) metSlitIn+=qty; // only met film input
      else if(mvt==='101'||mvt==='102') metSlitOut+=qty; // all slit output
    }
  });
  const bareWasteKg=Math.max(0,bareIn-bareOut);
  const metWasteKg=Math.max(0,metSlitIn-metSlitOut)+grade6Kg;
  const wasteKg=bareWasteKg+metWasteKg;
  const bareWastePct=bareIn>0?bareWasteKg/bareIn*100:0;
  const metWastePct=metSlitIn>0?metWasteKg/metSlitIn*100:0;

  // SCRAP from MB51: 3SC-ALWW (scrap wire), 3SC-AD (al dust)
  let scrapWireKg=0,scrapDustKg=0;
  mb51.filter(r=>inM(r['Posting Date'])).forEach(r=>{
    const mat=String(r.Material||'').toUpperCase().trim();
    const qty=Math.abs(Number(r['Qty in unit of entry']||0));
    if(mat==='3SC-ALWW') scrapWireKg+=qty;
    else if(mat==='3SC-AD') scrapDustKg+=qty;
  });
  // If no scrap data in MB51, estimate from wire consumption
  if(!scrapWireKg&&wireKgsTotal>0) scrapWireKg=wireKgsTotal*0.037;
  if(!scrapDustKg&&wireKgsTotal>0) scrapDustKg=wireKgsTotal*0.382;
  // Scrap values: ALWW = 70% of wire rate, AD = ₹105/Kg
  const scrapWireAmt=scrapWireKg*rates.wireRate*0.7;
  const scrapDustAmt=scrapDustKg*105;

  // Effective production = total slit output - Grade 5 (excluded)
  const effectiveProd=prodKg-grade5Kg;
  const denom=effectiveProd>0?effectiveProd:prodKg;

  // ═══ WEIGHTED AVERAGES FROM ZSLIT (exact Excel Met-1&2!G6/G7 formulas) ═══
  // G6 = SUM(ZSLIT col AV "Mic Eqv.*Weight") / SUM(ZSLIT col L "Net Weight") for Mvt 101 excl Gr5/6
  // G7 = SUM(ZSLIT col AT "OD Eqv.*Weight") / SUM(ZSLIT col L "Net Weight") for Mvt 101 excl Gr5/6
  // O21/P21/Q21 = SUM(ZSLIT col AV) grouped by OD (col AP), for target wire/boat calc
  let odEqWtSum=0,micEqWtSum=0,validNwSum=0;
  let odEq22=0,odEq25=0,odEq28=0; // OD-wise Mic Eqv*Weight sums (in Kg, convert to MT later)

  if(zslit){
    const sm=zslit.filter(r=>inM(r.Date||r['Posting Date']));
    const p101valid=sm.filter(r=>{
      const mvt=String(r['Move Type']||'');
      const g=String(r.Grade||'');
      return mvt==='101'&&g!=='5'&&g!=='6';
    });

    p101valid.forEach(r=>{
      const nw=Number(r['Net Weight']||0);
      if(nw<=0||isNaN(nw)) return;
      // COMPUTE weighted values from base factor columns (reliable through SheetJS)
      // Instead of reading pre-computed *Weight columns which fail in raw/dense mode
      const odEqvFactor=Number(r['OD Eqv.']||0);
      const micEqvFactor=Number(r['Mic Eqv.']||0);
      if(!odEqvFactor||!micEqvFactor||isNaN(odEqvFactor)||isNaN(micEqvFactor)) return;
      const odEqvWt=odEqvFactor*nw;   // = OD Eqv. × Net Weight
      const micEqvWt=micEqvFactor*nw;  // = Mic Eqv. × Net Weight
      odEqWtSum+=odEqvWt;
      micEqWtSum+=micEqvWt;
      validNwSum+=nw;

      // OD grouping from OD Eqv. factor: 1.0→2.2, 1.24→2.5, 1.44→2.8
      if(odEqvFactor>1.3) odEq28+=micEqvWt;
      else if(odEqvFactor>1.1) odEq25+=micEqvWt;
      else if(odEqvFactor>0) odEq22+=micEqvWt;
      if(odEqv>1.3) odEq28+=micEqvWt;       // 1.44 = 2.8 OD
      else if(odEqv>1.1) odEq25+=micEqvWt;   // 1.24 = 2.5 OD
      else if(odEqv>0) odEq22+=micEqvWt;     // 1.0 = 2.2 OD
    });
  }
  // Convert OD-wise sums to MT
  odEq22/=1000;odEq25/=1000;odEq28/=1000;

  // Weighted avg OD factor and Mic factor (Excel Met-1&2 G7 and G6)
  const avgODfactor=validNwSum>0?odEqWtSum/validNwSum:1;   // ~1.07-1.10
  const avgMicFactor=validNwSum>0?micEqWtSum/validNwSum:1;  // ~1.08-1.11
  const avgOD=2.2*avgODfactor;
  const avgMic=12/avgMicFactor;

  // Average width from ZJUMBO (jumbo rolls ~2900mm), NOT ZSLIT (slit rolls ~1000mm)
  const{zjumbo}=rawData;
  let avgWidth=3000;
  if(zjumbo){
    let wSum=0,wCt=0;
    zjumbo.filter(r=>{
      const mvt=String(r['Movment Type']||r['Mvt type']||r['Movement type']||'').trim();
      return mvt==='101'&&inM(r['Date of Production']);
    }).forEach(r=>{
      // SheetJS names duplicate 'Width' col as 'Width_1' (col AD = jumbo width ~2900mm)
      let w=Number(r['Width_1']||0);
      if(!w||w<100) w=Number(r.Width||0); // fallback
      if(w>500&&w<5000){wSum+=w;wCt++} // valid jumbo widths
    });
    if(wCt>0) avgWidth=wSum/wCt;
  }

  // Target wire/boat for OD mix (Excel J18/J19):
  // J18 = O21*8.6 + P21*10.4 + Q21*11.8 (OD-wise Mic Eqv*Weight MT × base wire Kg/MT)
  // The micron equivalence is already baked into the Mic Eqv*Weight values from ZSLIT
  const targetWireForMix=odEq22*rates.wireOD22+odEq25*rates.wireOD25+odEq28*rates.wireOD28;
  const targetBoatForMix=odEq22*rates.boatOD22+odEq25*rates.boatOD25+odEq28*rates.boatOD28;

  // Electricity
  let pwrU=0;
  if(electricity){
    const elecRows=electricity.filter(r=>inM(r.Date||r.date||r['Posting Date']||null));
    elecRows.forEach(r=>{
      pwrU+=Number(r['Met+%Utility Share']||r['Met+% Utility Share']||r['Total Met']||0);
    });
    console.log(`[MetCost] ${monthKey}: Electricity ${electricity.length} total, ${elecRows.length} in-month, pwrU=${pwrU.toFixed(0)}, keys=${Object.keys(electricity[0]||{}).slice(0,6).join(', ')}`);
    if(elecRows.length===0&&electricity.length>0){
      // Debug: check first row's date
      const d0=electricity[0];
      console.log(`[MetCost] Elec debug: first row Date=${JSON.stringify(d0.Date)} type=${typeof d0.Date}, date=${JSON.stringify(d0.date)}`);
    }
  }else{
    console.log(`[MetCost] ${monthKey}: NO electricity data in rawData`);
  }
  const pwrCost=pwrU*rates.electricityRate;

  // Cons & Spares (Cost Centers 3030010082 + 3030010083)
  let consAmt=0;
  if(consSpares){
    consSpares.filter(r=>{
      const cc=String(r['Cost Center']||r['Cost center']||'').trim();
      return(cc==='3030010082'||cc==='3030010083')&&inM(r['Posting Date']||r.Date||r['date']);
    }).forEach(r=>{consAmt+=-(Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0))});
    console.log(`[MetCost] ${monthKey}: Cons&Spares consAmt=${consAmt.toFixed(0)}`);
  }

  // MACHINE RUNNING DAYS — Hybrid: time-gap analysis + date-counting fallback
  const daysInMonth=me.getDate();
  let m1RunDays=0,m2RunDays=0;
  const m1Dates=new Set(),m2Dates=new Set();
  let m1PwrStopMins=0,m2PwrStopMins=0,m1PwrEvents=0,m2PwrEvents=0;
  const m1Rolls=[],m2Rolls=[];

  // Time parser for SheetJS
  const parseT=(t)=>{
    if(t==null||t==='') return null;
    if(t instanceof Date) return{h:t.getHours(),m:t.getMinutes()};
    if(typeof t==='object'&&typeof t.getHours==='function') return{h:t.getHours(),m:t.getMinutes()};
    if(typeof t==='object'){try{const s=t.toString();const p=s.match(/(\d{1,2}):(\d{2})/);if(p)return{h:+p[1],m:+p[2]}}catch(e){}}
    if(typeof t==='number'){const f=t>=1?t-Math.floor(t):t;const h=Math.floor(f*24);return{h,m:Math.round((f*24-h)*60)}}
    const s=String(t);const p=s.match(/(\d{1,2})\s*[:.\-]\s*(\d{2})/);
    if(p) return{h:+p[1],m:+p[2]};
    try{const d=new Date(s);if(!isNaN(d))return{h:d.getHours(),m:d.getMinutes()}}catch(e){}
    return null;
  };

  if(zjumbo){
    if(zjumbo.length>0) console.log('[MetCost] ZJUMBO cols: '+Object.keys(zjumbo[0]).slice(0,15).join(', '));

    zjumbo.filter(r=>{
      const mvt=String(r['Movment Type']||r['Mvt type']||r['Movement type']||r['Movement Type']||'').trim();
      return mvt==='101'&&inM(r['Date of Production']||r['Date of production']);
    }).forEach(r=>{
      const machine=String(r.Machine||r.machine||'').trim();
      const prodDate=parseDate(r['Date of Production']||r['Date of production']);
      if(!prodDate) return;
      // Date counting (always works)
      const dateStr=prodDate.toISOString().slice(0,10);
      if(machine.includes('M1')) m1Dates.add(dateStr);
      else if(machine.includes('M2')) m2Dates.add(dateStr);
      // Time-based roll tracking
      const chOpenDate=parseDate(r['Chamber Open Date']||r['Chamber open Date']);
      if(!chOpenDate) return;
      const chHM=parseT(r['Chamber Open Time']||r['Chamber open Time']);
      const ventHM=parseT(r['Vent time']||r['Vent Time'])||parseT(r['Web End Time']);
      if(!chHM||!ventHM) return;
      const startDt=new Date(chOpenDate);startDt.setHours(chHM.h,chHM.m,0,0);
      const endDt=new Date(prodDate);endDt.setHours(ventHM.h,ventHM.m,0,0);
      if(endDt<startDt) endDt.setTime(endDt.getTime()+86400000);
      if(machine.includes('M1')) m1Rolls.push([startDt,endDt]);
      else if(machine.includes('M2')) m2Rolls.push([startDt,endDt]);
    });

    // 4hr gap analysis (if time parsing worked)
    function calcStopDays(rolls){
      if(!rolls.length) return daysInMonth;
      rolls.sort((a,b)=>a[0]-b[0]);
      let stopHrs=0,lastEnd=null;
      const mStart=new Date(ms),mEnd=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const fg=(rolls[0][0]-mStart)/3600000; if(fg>4) stopHrs+=fg;
      for(let i=0;i<rolls.length;i++){
        if(lastEnd){const g=(rolls[i][0]-lastEnd)/3600000;if(g>4)stopHrs+=g}
        if(!lastEnd||rolls[i][1]>lastEnd) lastEnd=rolls[i][1];
      }
      if(lastEnd){const lg=(mEnd-lastEnd)/3600000;if(lg>4)stopHrs+=lg}
      return stopHrs/24;
    }

    if(m1Rolls.length>0||m2Rolls.length>0){
      // Time-based approach worked
      const m1Stop=calcStopDays(m1Rolls);
      const m2Stop=calcStopDays(m2Rolls);
      m1RunDays=Math.max(0,daysInMonth-m1Stop);
      m2RunDays=Math.max(0,daysInMonth-m2Stop);
      console.log(`[MetCost] ${monthKey}: TIME-BASED M1=${m1RunDays.toFixed(1)}d(${m1Rolls.length} rolls), M2=${m2RunDays.toFixed(1)}d(${m2Rolls.length} rolls)`);
    }else{
      // Fallback: date counting
      m1RunDays=m1Dates.size;
      m2RunDays=m2Dates.size;
      console.log(`[MetCost] ${monthKey}: DATE-FALLBACK M1=${m1RunDays}d(${m1Dates.size} dates), M2=${m2RunDays}d`);
    }

    // Power shutdown detection
    const PWR_KEYS=['power fail','power cut','power dip','power trip','power shut','power off','power change',
      'poewr','pawer','powr fail','no power','eb cut','eb fail','grid fail','load shed','electr'];
    const isPwr=(txt)=>{const t=(txt||'').toLowerCase();return PWR_KEYS.some(k=>t.includes(k))};
    zjumbo.filter(r=>inM(r['Date of Production']||r['Date of production'])).forEach(r=>{
      if(!isPwr(r.Remarks||'')&&!isPwr(r['Downtime Remark']||'')) return;
      const machine=String(r.Machine||r.machine||'').trim();
      let mins=Math.max(Math.abs(Number(r['Down Time']||0)),Math.abs(Number(r['Down Time_1']||0)),Math.abs(Number(r['Down Time_2']||0)));
      if(machine.includes('M1')){m1PwrStopMins+=mins;m1PwrEvents++}
      else if(machine.includes('M2')){m2PwrStopMins+=mins;m2PwrEvents++}
    });
  }

  const m1PwrStopDays=m1PwrStopMins/60/24;
  const m2PwrStopDays=m2PwrStopMins/60/24;
  // Subtract power stoppage from running days
  m1RunDays=Math.max(0,m1RunDays-m1PwrStopDays);
  m2RunDays=Math.max(0,m2RunDays-m2PwrStopDays);
  const avgRunDays=(m1RunDays+m2RunDays)/2;
  console.log(`[MetCost] ${monthKey}: FINAL M1=${m1RunDays.toFixed(1)}d, M2=${m2RunDays.toFixed(1)}d, avg=${avgRunDays.toFixed(1)}d`);


  // Manpower from parent app — ADJUSTED for machine running days
  // Only charge manpower for days machines were actually running
  const mpData=manpowerData[monthKey];
  const mpTotalFull=mpData?mpData.totalNet:0;
  const mpRunRatio=(avgRunDays>0&&daysInMonth>0)?avgRunDays/daysInMonth:1;
  const mpTotal=mpTotalFull*mpRunRatio; // prorated to running days

  // Wire/boat consumed

  // ═══ ACTUAL cost ₹/Kg (÷ effectiveProd) ═══
  const wireCKg=wireAmt/denom,boatCKg=boatAmt/denom,rmC=wireCKg+boatCKg;
  const wastePct=wasteKg/(denom+wasteKg)*100;
  const bGradePct=slitBKg/denom*100;
  // Wastage loss (Excel F12): (bareWaste%×baseRate×0.5 + (totalWaste%-K10)×(baseRate+5))/100
  // K10 = bareWaste% - metProcessLoss%, where metProcessLoss = (1-metOut/metIn)*100
  const metProcLossPct=metSlitIn>0?(1-metSlitOut/metSlitIn)*100:0;
  const K10val=Math.max(0,bareWastePct-metProcLossPct);
  const wasteLoss=(bareWastePct*rates.baseFilmRate*0.5+(wastePct-K10val)*(rates.baseFilmRate+5))/100;
  const bGradeLoss=bGradePct*10/100;
  const mpKg=mpTotal/denom;
  const pwrKg=pwrCost/denom,consKg=consAmt/denom;
  const convC=wasteLoss+bGradeLoss+mpKg+pwrKg+consKg+rates.indirectExpense;
  const totalC=rmC+convC,totalWP=totalC+rates.packingFreight;
  // Scrap sale (by-product, deducted from cost)
  const scrapWireSale=scrapWireAmt/denom;
  const scrapDustSale=scrapDustAmt/denom;
  const totalAfterScrap=totalWP-scrapWireSale-scrapDustSale;

  // ═══ EQUIVALENT cost ₹/Kg (Excel-exact formulas) ═══
  // Only compute equiv if we have valid ZSLIT equivalence data
  const hasEquivData=validNwSum>0&&equivKg>0&&(odEq22+odEq25+odEq28)>0;
  console.log(`[MetCost] ${monthKey}: hasEquiv=${hasEquivData}, validNw=${validNwSum.toFixed(0)}, equivKg=${equivKg.toFixed(0)}, avgOD=${validNwSum>0?(odEqWtSum/validNwSum).toFixed(4):'N/A'}, avgMic=${validNwSum>0?(micEqWtSum/validNwSum).toFixed(4):'N/A'}, odEq22=${(odEq22/1000).toFixed(1)}MT`);
  let eqWirePerMT=wireCKg, eqBoatPerMT=boatCKg; // default: equiv = actual
  if(hasEquivData){
    // Wire G8 = (8.6 + (wireKgs - J18) * 1000 / (avgMicFactor * avgODfactor) / F3) * N8 / 1000
    const eqFactor=1/(avgMicFactor*avgODfactor);
    eqWirePerMT=(rates.wireOD22+(wireKgsTotal-targetWireForMix)*1000*eqFactor/denom)*(rates.wireRate||355)/1000;
    eqBoatPerMT=(rates.boatOD22+(boatPcsTotal-targetBoatForMix)*1000*eqFactor/denom)*(rates.boatRate||1087)/1000;
  }
  const ratio=hasEquivData&&equivKg>0?denom/equivKg:1;
  // Equivalent wastage (Excel-exact formulas)
  const widthRatio=avgWidth/3000;
  // G4: equiv waste% = wastePct * (0.5 + 0.5 * avgWidth/3000)
  const eqWastePct=wastePct*(0.5+0.5*widthRatio);
  // G5: equiv B-grade% = bGradePct * avgWidth/3000
  const eqBGradePct=bGradePct*widthRatio;
  // G6: equiv bare waste% = bareWastePct (same as actual)
  // G12: (bareWaste%*baseRate*0.5 + (eqWastePct-K10)*(baseRate+5))/100
  const eqWasteLoss=(bareWastePct*rates.baseFilmRate*0.5+(eqWastePct-K10val)*(rates.baseFilmRate+5))/100;
  // G13: B-grade loss
  const eqBGradeLoss=eqBGradePct*10/100;
  // G14/G15/G16: Manpower/Power/Cons equiv = actual × (prodKg/equivKg)
  const eqMpKg=mpKg*ratio;
  const eqPwrKg=pwrKg*ratio;
  const eqConsKg=consKg*ratio;
  const eqRM=eqWirePerMT+eqBoatPerMT;
  const eqConvC=eqWasteLoss+eqBGradeLoss+eqMpKg+eqPwrKg+eqConsKg+rates.indirectExpense;
  const eqTotalC=eqRM+eqConvC,eqTotalWP=eqTotalC+rates.packingFreight;
  const eqTotalAfterScrap=eqTotalWP-scrapWireSale-scrapDustSale;

  return{month:monthKey,prodKg,effectiveProd,equivKg,eqRatio:equivKg/denom,metJumboKg,prodMT:denom/1000,slitAKg,slitBKg,grade5Kg,grade6Kg,wasteKg,
    bareWasteKg,metWasteKg,bareWastePct,metWastePct,bareIn,bareOut,metSlitIn,metSlitOut,K10val,
    exportKg,domesticKg,heatSealKg,
    wireAmt,wireKgsTotal,boatAmt,boatPcsTotal,wireN,boatN,boatTypes,
    wireCKg,boatCKg,rmC,wastePct,bGradePct,wasteLoss,bGradeLoss,mpKg,mpTotal,mpTotalFull,pwrKg,pwrU,pwrCost,consKg,consAmt,convC,totalC,totalWP,
    scrapWireKg,scrapDustKg,scrapWireAmt,scrapDustAmt,scrapWireSale,scrapDustSale,totalAfterScrap,
    scrapWireKg,scrapDustKg,scrapWireSale,scrapDustSale,totalAfterScrap,
    runDays:{m1:m1RunDays,m2:m2RunDays,m1Stop:daysInMonth-m1RunDays,m2Stop:daysInMonth-m2RunDays,m1GapStop:daysInMonth-m1RunDays-m1PwrStopDays,m2GapStop:daysInMonth-m2RunDays-m2PwrStopDays,m1PwrStop:m1PwrStopDays,m2PwrStop:m2PwrStopDays,m1PwrEvents,m2PwrEvents,avg:avgRunDays,total:daysInMonth,ratio:mpRunRatio,m1Rolls:m1Rolls.length,m2Rolls:m2Rolls.length},
    odEq:{od22:odEq22,od25:odEq25,od28:odEq28,avgWidth,avgOD,avgMic,avgODfactor,avgMicFactor},
    eq:{wire:eqWirePerMT,boat:eqBoatPerMT,rm:eqRM,wastePct:eqWastePct,bGradePct:eqBGradePct,wasteLoss:eqWasteLoss,bGradeLoss:eqBGradeLoss,mp:eqMpKg,pwr:eqPwrKg,cons:eqConsKg,convC:eqConvC,totalC:eqTotalC,totalWP:eqTotalWP,totalAfterScrap:eqTotalAfterScrap},
    mpData,rates:{...rates}};
}

// Compute ALL months found in uploaded data and auto-save
function computeAndSaveAll(){
  const months=findAllMonths();
  let computed=0;
  months.forEach(mk=>{
    const result=computeMonth(mk);
    if(result){
      // MERGE with existing saved data — don't lose previously computed values
      const existing=savedMonths[mk]||{};
      savedMonths[mk]={...existing,...result,savedAt:new Date().toISOString()};
      computed++;
    }
  });
  // Also update existing saved months with partial data (e.g. only electricity uploaded)
  // If a saved month has production data but we have new rawData for power/cons/manpower
  Object.keys(savedMonths).forEach(mk=>{
    if(months.includes(mk)) return; // already computed above
    const existing=savedMonths[mk];
    if(!existing||!existing.effectiveProd) return;
    const denom=existing.effectiveProd;
    let updated=false;
    // Update power if electricity data available for this month
    const{electricity,consSpares}=rawData;
    if(electricity){
      const ms=new Date(mk+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      let pwrU=0;
      electricity.filter(r=>inM(r.Date||r.date||r['Posting Date']||null)).forEach(r=>{
        pwrU+=Number(r['Met+%Utility Share']||r['Met+% Utility Share']||r['Total Met']||0);
      });
      if(pwrU>0){
        const pwrCost=pwrU*rates.electricityRate;
        existing.pwrU=pwrU;existing.pwrCost=pwrCost;existing.pwrKg=pwrCost/denom;
        updated=true;
      }
    }
    // Update cons & spares if available
    if(consSpares){
      const ms=new Date(mk+'-01'),me=new Date(ms.getFullYear(),ms.getMonth()+1,0,23,59,59);
      const inM=v=>{const d=parseDate(v);return d&&d>=ms&&d<=me};
      let consAmt=0;
      consSpares.filter(r=>{
        const cc=String(r['Cost Center']||r['Cost center']||'').trim();
        return(cc==='3030010082'||cc==='3030010083')&&inM(r['Posting Date']||r.Date||r['date']);
      }).forEach(r=>{consAmt+=-(Number(r['Amt.in Loc.Cur.']||r['Amt.in loc.cur.']||0))});
      if(consAmt!==0){
        existing.consAmt=consAmt;existing.consKg=consAmt/denom;
        updated=true;
      }
    }
    // Recalculate totals if anything updated
    if(updated){
      existing.convC=(existing.wasteLoss||0)+(existing.bGradeLoss||0)+(existing.mpKg||0)+(existing.pwrKg||0)+(existing.consKg||0)+(existing.rates||rates).indirectExpense;
      existing.totalC=(existing.rmC||0)+existing.convC;
      existing.totalWP=existing.totalC+(existing.rates||rates).packingFreight;
      existing.totalAfterScrap=existing.totalWP-(existing.scrapWireSale||0)-(existing.scrapDustSale||0);
      if(existing.eq){
        existing.eq.pwr=(existing.pwrKg||0)*(existing.effectiveProd/(existing.equivKg||existing.effectiveProd));
        existing.eq.cons=(existing.consKg||0)*(existing.effectiveProd/(existing.equivKg||existing.effectiveProd));
        existing.eq.convC=(existing.eq.wasteLoss||0)+(existing.eq.bGradeLoss||0)+(existing.eq.mp||0)+existing.eq.pwr+existing.eq.cons+(existing.rates||rates).indirectExpense;
        existing.eq.totalC=(existing.eq.rm||0)+existing.eq.convC;
        existing.eq.totalWP=existing.eq.totalC+(existing.rates||rates).packingFreight;
        existing.eq.totalAfterScrap=existing.eq.totalWP-(existing.scrapWireSale||0)-(existing.scrapDustSale||0);
      }
      existing.savedAt=new Date().toISOString();
      computed++;
    }
  });
  if(computed)saveToStorage();
  return{months:[...new Set([...months,...Object.keys(savedMonths)])].sort(),computed};
}

let trendFrom='',trendTo='',trendMetric='totalC';

function openTrend(metricKey){
  trendMetric=metricKey||'totalC';
  const all=Object.keys(savedMonths).sort();
  if(!trendFrom||!all.includes(trendFrom)) trendFrom=all.length>5?all[all.length-6]:all[0]||'';
  if(!trendTo||!all.includes(trendTo)) trendTo=all[all.length-1]||'';
  renderTrendModal();
}

function renderTrendModal(){
  const all=Object.keys(savedMonths).sort();
  if(!all.length) return;
  const metric=TREND_METRICS.find(m=>m.key===trendMetric)||TREND_METRICS[0];
  const fromIdx=Math.max(0,all.indexOf(trendFrom));
  const toIdx=Math.min(all.length-1,all.indexOf(trendTo));
  const months=all.slice(fromIdx,toIdx+1);
  const vals=months.map(m=>{const d=savedMonths[m];return d?Number(d[metric.key])||0:0});
  const tgtVal=metric.target?rates[metric.target]:0;
  const maxV=Math.max(...vals,tgtVal||0)*1.2||1;
  const minV=Math.min(...vals,tgtVal||maxV)*0.9;

  // Build SVG chart
  const w=600,h=280,padL=48,padR=12,padT=24,padB=44;
  const cw=w-padL-padR,ch=h-padT-padB;
  const barW=Math.min(36,Math.floor(cw/months.length*0.7));
  const gap=(cw-barW*months.length)/(months.length+1);
  let svg='';

  // Grid lines
  const steps=5;
  for(let i=0;i<=steps;i++){
    const y=padT+ch-ch/steps*i;
    const v=(maxV/steps*i).toFixed(maxV>10?1:2);
    svg+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e2e8f0" stroke-width="0.5"/>`;
    svg+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#94a3b8">${v}</text>`;
  }

  // Target line
  if(tgtVal>0){
    const ty=padT+ch-((tgtVal/maxV)*ch);
    svg+=`<line x1="${padL}" y1="${ty}" x2="${w-padR}" y2="${ty}" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>`;
    svg+=`<text x="${w-padR+2}" y="${ty-4}" font-size="9" fill="#ef4444" font-weight="700">Target ${tgtVal}</text>`;
  }

  // Bars + values
  months.forEach((m,i)=>{
    const x=padL+gap+(gap+barW)*i;
    const v=vals[i];
    const bh=Math.max(2,(v/maxV)*ch);
    const y=padT+ch-bh;
    const isOver=tgtVal>0&&v>tgtVal;
    svg+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3" fill="${isOver?'#ef4444':metric.color}" opacity=".8"/>`;
    svg+=`<text x="${x+barW/2}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="${isOver?'#ef4444':'#1e293b'}">${v>=100?Math.round(v):v.toFixed(2)}</text>`;
    // Month label
    const ml=m.split('-');
    const lbl=MN[parseInt(ml[1])-1].slice(0,3)+" '"+ml[0].slice(2);
    svg+=`<text x="${x+barW/2}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="#64748b">${lbl}</text>`;
    // Highlight selected month
    if(m===selMonth) svg+=`<rect x="${x-2}" y="${padT}" width="${barW+4}" height="${ch}" rx="4" fill="rgba(15,82,186,.06)" stroke="#0f52ba" stroke-width="1" stroke-dasharray="3,3"/>`;
  });

  // Metric selector buttons
  let metricBtns='';
  TREND_METRICS.forEach(mt=>{
    const isOn=mt.key===trendMetric;
    metricBtns+=`<button onclick="trendMetric='${mt.key}';renderTrendModal()" style="padding:5px 10px;border-radius:6px;border:1.5px solid ${isOn?mt.color:'var(--bd)'};background:${isOn?mt.color+'18':'var(--sf)'};color:${isOn?mt.color:'var(--tx3)'};font-size:10px;font-weight:${isOn?'700':'500'};cursor:pointer;font-family:var(--fn);white-space:nowrap">${mt.label}</button>`;
  });

  // Month range selectors
  let fromOpts='',toOpts='';
  all.forEach(m=>{
    fromOpts+=`<option value="${m}"${m===trendFrom?' selected':''}>${monthLabel(m)}</option>`;
    toOpts+=`<option value="${m}"${m===trendTo?' selected':''}>${monthLabel(m)}</option>`;
  });

  // Stats
  const avg=vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0;
  const best=Math.min(...vals);
  const worst=Math.max(...vals);

  document.getElementById('trendModal').innerHTML=`<div class="mo" onclick="document.getElementById('trendModal').innerHTML=''">
    <div style="background:var(--sf);width:100%;max-width:700px;max-height:95vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:18px;font-weight:700;color:${metric.color}">${metric.label}</div>

      <div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;border-top:1px solid var(--bd)">${metricBtns}</div>
    </div>
  </div>`;
}

function render(){

  ).join('');

  const liveC=(Object.keys(rawData).length>0)?computeMonth(selMonth):null;
  const saved=getSaved(selMonth);
  let c=liveC||saved;
  // Ensure all new fields exist (backward compat with old saved data)

  const ct=document.getElementById('content');

  // Helper: cost breakdown table used in both dash and cost tabs

        <tr><td>Boat (${fmt(d.boatPcsTotal||0,0)} Pcs)</td><td class="n">${fmt(d.boatCKg)}</td><td class="n">${fmt(e.boat)}</td><td class="n">${fmt(d.boatCKg/d.totalC*100,1)}%</td></tr>

        <tr><td>Wastage loss</td><td class="n">${fmt(d.wasteLoss)}</td><td class="n">${fmt(e.wasteLoss)}</td><td class="n">${fmt(d.wasteLoss/d.totalC*100,1)}%</td></tr>
        <tr><td>B-grade loss</td><td class="n">${fmt(d.bGradeLoss)}</td><td class="n">${fmt(e.bGradeLoss)}</td><td class="n">${fmt(d.bGradeLoss/d.totalC*100,1)}%</td></tr>

        <tr><td>Indirect</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense/d.totalC*100,1)}%</td></tr>
        <tr class="st"><td>Conversion cost</td><td class="n">${fmt(d.convC)}</td><td class="n">${fmt(e.convC)}</td><td class="n">${fmt(d.convC/d.totalC*100,1)}%</td></tr>
        <tr class="tt"><td>Total cost</td><td class="n">₹${fmt(d.totalC)}</td><td class="n">₹${fmt(e.totalC)}</td><td class="n">100%</td></tr>
        <tr><td>+ Packing+Freight</td><td class="n">${fmt(r.packingFreight)}</td><td class="n">${fmt(r.packingFreight)}</td><td class="n"></td></tr>
        <tr class="tt"><td>Total with P+F</td><td class="n">₹${fmt(d.totalWP)}</td><td class="n">₹${fmt(e.totalWP)}</td><td class="n"></td></tr>
        <tr style="color:var(--gn)"><td>− Scrap Wire (3SC-ALWW)</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n"></td></tr>
        <tr style="color:var(--gn)"><td>− Al Dust (3SC-AD)</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n">−${fmt(d.scrapDustSale)}</td><td class="n"></td></tr>
        <tr class="tt"><td>Net cost after scrap</td><td class="n">₹${fmt(d.totalAfterScrap)}</td><td class="n">₹${fmt(e.totalAfterScrap)}</td><td class="n"></td></tr>
      </tbody></table>`;

    // With targets: Actual | Equivalent | Target | Variance
    // Variance = Target - Equivalent (positive=good/savings, negative=over target)
    const tg=(eq,t)=>{const v=t-eq;return `<span class="tg ${v<0?'tg-r':'tg-g'}">${v>=0?'+':''}${fmt(v)}</span>`};
    // Computed targets from rates
    const tRM=r.tWire+r.tBoat;
    const tConvC=r.tWaste+0+r.tManpower+r.tPower+r.tCons+r.indirectExpense;
    const tTotal=tRM+tConvC;
    const tTotalWP=tTotal+r.packingFreight;
    return `<table class="tb">
      <thead><tr><th>Component</th><th class="n">Actual</th><th class="n">Eqv.</th><th class="n">Target</th><th class="n">Var</th></tr></thead><tbody>

      <tr><td>Boat (${fmt(d.boatPcsTotal||0,0)} Pcs)</td><td class="n">${fmt(d.boatCKg)}</td><td class="n">${fmt(e.boat)}</td><td class="n">${fmt(r.tBoat)}</td><td class="n">${tg(e.boat,r.tBoat)}</td></tr>
      <tr class="st"><td>Raw material</td><td class="n">${fmt(d.rmC)}</td><td class="n">${fmt(e.rm)}</td><td class="n">${fmt(tRM)}</td><td class="n">${tg(e.rm,tRM)}</td></tr>
      <tr><td>Wastage loss</td><td class="n">${fmt(d.wasteLoss)}</td><td class="n">${fmt(e.wasteLoss)}</td><td class="n">${fmt(r.tWaste)}</td><td class="n">${tg(e.wasteLoss,r.tWaste)}</td></tr>
      <tr><td>B-grade loss</td><td class="n">${fmt(d.bGradeLoss)}</td><td class="n">${fmt(e.bGradeLoss)}</td><td class="n">0.00</td><td class="n">${tg(e.bGradeLoss,0)}</td></tr>
      <tr><td>Manpower</td><td class="n">${fmt(d.mpKg)}</td><td class="n">${fmt(e.mp)}</td><td class="n">${fmt(r.tManpower)}</td><td class="n">${tg(e.mp,r.tManpower)}</td></tr>
      <tr><td>Power</td><td class="n">${fmt(d.pwrKg)}</td><td class="n">${fmt(e.pwr)}</td><td class="n">${fmt(r.tPower)}</td><td class="n">${tg(e.pwr,r.tPower)}</td></tr>
      <tr><td>Cons & spares</td><td class="n">${fmt(d.consKg)}</td><td class="n">${fmt(e.cons)}</td><td class="n">${fmt(r.tCons)}</td><td class="n">${tg(e.cons,r.tCons)}</td></tr>
      <tr><td>Indirect</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n">${fmt(r.indirectExpense)}</td><td class="n"><span class="tg tg-g">+0.00</span></td></tr>
      <tr class="st"><td>Conversion cost</td><td class="n">${fmt(d.convC)}</td><td class="n">${fmt(e.convC)}</td><td class="n">${fmt(tConvC)}</td><td class="n">${tg(e.convC,tConvC)}</td></tr>
      <tr class="tt"><td>Total cost</td><td class="n">₹${fmt(d.totalC)}</td><td class="n">₹${fmt(e.totalC)}</td><td class="n">₹${fmt(tTotal)}</td><td class="n">${tg(e.totalC,tTotal)}</td></tr>

      <tr style="color:var(--gn)"><td>− Scrap Al Wire (3SC-ALWW)</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n">−${fmt(d.scrapWireSale)}</td><td class="n"></td><td class="n"></td></tr>

      <tr class="tt"><td>Net cost after scrap sale</td><td class="n">₹${fmt(d.totalAfterScrap)}</td><td class="n">₹${fmt(e.totalAfterScrap)}</td><td class="n"></td><td class="n"></td></tr>
    </tbody></table>`;

  // Helper: save button + download image button
  function saveBtn(d){

    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">

    </div>`;

  // Helper: history cards
  function historySection(){

      const d=savedMonths[m];
      const isActive=m===selMonth;
      html+=`<div style="background:var(--sf);border:1px solid ${isActive?'var(--ac)':'var(--bd)'};border-radius:var(--r);padding:12px;margin-bottom:8px;${isActive?'border-left:3px solid var(--ac)':''}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

        </div>
      </div>`;
    });
    return html;

  if(tab==='dash'){
    // Show last compute summary if just uploaded
    let computeMsg='';

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">

        <div class="mc" style="border-left-color:${c&&c.bareWastePct>2?'var(--rd)':'var(--gn)'}"><div class="ml">Bare waste</div><div class="mv">${c?fmt(c.bareWastePct,2)+'%':'—'}</div><div class="ms">${c?fmt(c.bareWasteKg,0)+' Kg':'—'}</div></div>

      ${c?'<div class="cd"><div class="ct2">Cost breakdown — '+monthLabel(selMonth)+'</div><div class="sx">'+costTable(c,true)+'</div></div>':''}

      </div>
      <div class="cd"><div class="ct2">Employee details</div><div class="sx"><table class="tb">
        <thead><tr><th>#</th><th>Name</th><th>Sec</th><th class="n">Salary</th><th class="n">Ab</th><th class="n">Net</th></tr></thead><tbody>
        ${emps.map((e,i)=>`<tr>
          <td><span class="er${i<3?' e'+(i+1):''}">${i+1}</span></td>
          <td style="font-weight:600;font-size:11px">${e.name}</td>
          <td><span class="tg tg-a" style="font-size:9px">${e.section}</span></td>
          <td class="n" style="font-size:11px">₹${Number(e.monthlySalary).toLocaleString('en-IN')}</td>
          <td class="n">${e.absentDays>0?'<span class="tg tg-r">'+e.absentDays+'</span>':'<span style="color:var(--tx3)">0</span>'}</td>
          <td class="n" style="font-weight:700;font-size:11px;color:var(--gn)">₹${Number(e.netSalary).toLocaleString('en-IN')}</td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
  }

  else if(tab==='target'){
    const filtered=targets.filter(t=>{
      if(!tgtSearch)return true;
      const q=tgtSearch.toLowerCase();
      return t.c.toLowerCase().includes(q)||t.d.toLowerCase().includes(q);
    });

    // 1440 min bifurcation
    const cy=MACHINE_DATA.met1.cycle;
    const oneRoll=cy.setup+cy.vacuum+cy.heating+cy.running+cy.vent;
    const bc=MACHINE_DATA.met1.boatChange;
    const sc=MACHINE_DATA.met1.sourceCleaning;
    const rollsPerDay=Math.floor((1440-bc-sc)/(oneRoll));
    const runMin=rollsPerDay*cy.running;
    const setupMin=rollsPerDay*cy.setup;
    const vacMin=rollsPerDay*(cy.vacuum+cy.heating);
    const ventMin=rollsPerDay*cy.vent;
    const totalUsed=rollsPerDay*oneRoll+bc+sc;
    const idle=1440-totalUsed;

    // 1440 bar segments
    const pcts=[
      {l:'Running',m:runMin,col:'var(--gn)'},
      {l:'Setup',m:setupMin,col:'var(--am)'},
      {l:'Vacuum+Heat',m:vacMin,col:'var(--ac)'},
      {l:'Vent',m:ventMin,col:'var(--tl)'},
      {l:'Boat change',m:bc,col:'var(--pp)'},
      {l:'Source clean',m:sc,col:'var(--rd)'},
      {l:'Idle/buffer',m:idle,col:'var(--bd)'},
    ];

    let barHtml='<div style="display:flex;height:20px;border-radius:6px;overflow:hidden;margin:10px 0">';
    pcts.forEach(p=>{ barHtml+=`<div style="width:${(p.m/1440*100).toFixed(1)}%;background:${p.col}" title="${p.l}: ${p.m} min"></div>`; });
    barHtml+='</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px">';
    pcts.forEach(p=>{ barHtml+=`<span style="font-size:10px;display:flex;align-items:center;gap:3px"><span style="width:8px;height:8px;border-radius:2px;background:${p.col};display:inline-block"></span>${p.l} ${p.m}m</span>`; });
    barHtml+='</div>';

    // Capacity table
    let capHtml='<div class="sx"><table class="tb"><thead><tr><th>Mic</th><th>OD</th><th class="n">M-1 MT</th><th class="n">M-2 MT</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">Waste%</th></tr></thead><tbody>';
    MACHINE_DATA.capacity.forEach(r=>{
      capHtml+=`<tr><td>${r.mic}µ</td><td>${r.od}</td><td class="n">${r.m1}</td><td class="n">${r.m2}</td><td class="n">${r.wire}</td><td class="n">${r.boat}</td><td class="n">${r.waste}%</td></tr>`;
    });
    capHtml+='</tbody></table></div>';

    // BOM table
    let bomHtml='<div class="sx"><table class="tb"><thead><tr><th>Code</th><th>Description</th><th class="n">Wire</th><th class="n">Boat</th><th class="n">BOM</th><th></th></tr></thead><tbody>';
    filtered.forEach(t=>{
      bomHtml+=`<tr><td style="font-family:var(--mn);font-size:11px;font-weight:600;color:var(--ac)">${t.c}</td><td style="font-size:11px">${t.d}</td><td class="n">${t.w}</td><td class="n">${t.b}</td><td class="n">${fmt(t.bom,1)}</td><td><button onclick="removeTarget(${t.id})" style="background:none;border:none;color:var(--tx3);cursor:pointer;font-size:14px;padding:2px">×</button></td></tr>`;
    });
    bomHtml+='</tbody></table></div>';

    ct.innerHTML=`
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">Machine & targets</div>

      <div class="cd">
        <div class="ct2">1440 minutes — 24 hour cycle (Met-1)</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px">
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn);color:var(--gn)">${rollsPerDay}</div><div style="font-size:10px;color:var(--tx2)">Rolls/day</div></div>
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn)">${oneRoll}</div><div style="font-size:10px;color:var(--tx2)">Min/roll</div></div>
          <div style="text-align:center;padding:8px;background:var(--bg);border-radius:8px"><div style="font-size:18px;font-weight:700;font-family:var(--mn);color:var(--ac)">${runMin}</div><div style="font-size:10px;color:var(--tx2)">Running min</div></div>
        </div>
        ${barHtml}
        <div class="sx" style="margin-top:8px"><table class="tb"><thead><tr><th>Process</th><th class="n">Per roll</th><th class="n">×${rollsPerDay} rolls</th><th class="n">% of day</th></tr></thead><tbody>
          <tr><td>Setup time</td><td class="n">${cy.setup} min</td><td class="n">${setupMin} min</td><td class="n">${fmt(setupMin/1440*100,1)}%</td></tr>
          <tr><td>Vacuum + heating</td><td class="n">${cy.vacuum+cy.heating} min</td><td class="n">${vacMin} min</td><td class="n">${fmt(vacMin/1440*100,1)}%</td></tr>
          <tr><td>Running</td><td class="n">${cy.running} min</td><td class="n">${runMin} min</td><td class="n">${fmt(runMin/1440*100,1)}%</td></tr>
          <tr><td>Vent</td><td class="n">${cy.vent} min</td><td class="n">${ventMin} min</td><td class="n">${fmt(ventMin/1440*100,1)}%</td></tr>
          <tr><td>Boat change</td><td class="n">—</td><td class="n">${bc} min</td><td class="n">${fmt(bc/1440*100,1)}%</td></tr>
          <tr><td>Source cleaning</td><td class="n">—</td><td class="n">${sc} min</td><td class="n">${fmt(sc/1440*100,1)}%</td></tr>
          <tr class="tt"><td>Total</td><td class="n">${oneRoll} min</td><td class="n">${totalUsed} min</td><td class="n">${fmt(totalUsed/1440*100,1)}%</td></tr>
        </tbody></table></div>
      </div>

      <div class="cd">
        <div class="ct2">Machine capacity — daily output targets</div>
        <div style="font-size:11px;color:var(--tx2);margin-bottom:8px">M-1 width: ${MACHINE_DATA.met1.width}mm (met: ${MACHINE_DATA.met1.metWidth}mm) · M-2 width: ${MACHINE_DATA.met2.width}mm (met: ${MACHINE_DATA.met2.metWidth}mm)</div>
        ${capHtml}
      </div>

      <div class="cd">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="ct2" style="margin:0">BOM — all ${targets.length} film types</div>
          <button class="btn bp" onclick="showAddTarget()" style="font-size:10px;padding:5px 10px">+ Add</button>
        </div>
        <input id="tgtSearch" type="text" placeholder="Search film code or description..." value="${tgtSearch||''}" oninput="tgtSearch=this.value;render()" style="width:100%;padding:7px 10px;border:1.5px solid var(--bd);border-radius:7px;font-size:12px;font-family:var(--fn);margin-bottom:8px;background:var(--bg)">
        <div style="font-size:11px;color:var(--tx3);margin-bottom:6px">Showing ${filtered.length} of ${targets.length} · Wire Kg/MT · Boat Pcs/MT · BOM Qty/MT</div>
        ${bomHtml}
      </div>
      <div id="addModal"></div>
      <div id="trendModal"></div>`;

    if(tgtSearch){const el=document.getElementById('tgtSearch');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  }

  else if(tab==='set'){
    const rateField=(k,l,u)=>`<div class="rc"><div><div class="rn">${l}</div><div class="ru">${u}</div></div>
      <input class="ri" type="number" step="0.01" value="${rates[k]}" onchange="rates['${k}']=Number(this.value)||0;render()"></div>`;

    ct.innerHTML=`<div style="font-size:16px;font-weight:700;margin-bottom:4px">Settings</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">All values are editable. Changes reflect in calculations instantly.</p>

      <div class="cd"><div class="ct2">Targets ₹/Kg <span style="font-size:10px;font-weight:400;color:var(--tx3)">— Base: 12µ · OD 2.2</span></div>
        <div class="sx" style="margin-bottom:10px"><table class="tb" style="font-size:12px">
          <thead><tr><th>Component</th><th class="n">Value</th><th class="n">Rate (₹)</th><th class="n">Cost ₹/Kg</th></tr></thead>
          <tbody>
          <tr><td>Wire (Al)</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.wireOD22}" onchange="rates.wireOD22=parseFloat(this.value)||8.6;saveRates();render()"> Kg/MT</td>
            <td class="n"><input class="ri" style="width:60px;text-align:center" value="${rates.wireRate}" onchange="rates.wireRate=parseFloat(this.value)||355;saveRates();render()"> /Kg</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tWire}" onchange="rates.tWire=parseFloat(this.value)||3.05;saveRates();render()"></td>
          </tr>
          <tr><td>Boat (EVB)</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.boatOD22}" onchange="rates.boatOD22=parseFloat(this.value)||1.7;saveRates();render()"> Pcs/MT</td>
            <td class="n"><input class="ri" style="width:60px;text-align:center" value="${rates.boatRate}" onchange="rates.boatRate=parseFloat(this.value)||1087;saveRates();render()"> /Pc</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tBoat}" onchange="rates.tBoat=parseFloat(this.value)||1.87;saveRates();render()"></td>
          </tr>
          <tr class="st"><td>Raw material</td><td class="n" colspan="2"></td><td class="n" style="font-weight:700">${fmt(rates.tWire+rates.tBoat)}</td></tr>
          <tr><td>Wastage loss</td><td class="n" colspan="2" style="font-size:10px;color:var(--tx3)">Bare+Met waste</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tWaste}" onchange="rates.tWaste=parseFloat(this.value)||1;saveRates();render()"></td></tr>
          <tr><td>B-grade loss</td><td class="n" colspan="2"></td><td class="n" style="color:var(--tx3)">0.00</td></tr>
          <tr><td>Manpower</td><td class="n" colspan="2" style="font-size:10px;color:var(--tx3)">Salary ÷ Production</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tManpower}" onchange="rates.tManpower=parseFloat(this.value)||0.8;saveRates();render()"></td></tr>
          <tr><td>Power</td><td class="n" colspan="2"><input class="ri" style="width:55px;text-align:center" value="${rates.electricityRate}" onchange="rates.electricityRate=parseFloat(this.value)||8.25;saveRates();render()"> ₹/unit</td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tPower}" onchange="rates.tPower=parseFloat(this.value)||3.56;saveRates();render()"></td></tr>
          <tr><td>Cons & spares</td><td class="n" colspan="2"></td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.tCons}" onchange="rates.tCons=parseFloat(this.value)||0.3;saveRates();render()"></td></tr>
          <tr><td>Indirect</td><td class="n" colspan="2"></td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.indirectExpense}" onchange="rates.indirectExpense=parseFloat(this.value)||0.26;saveRates();render()"></td></tr>
          <tr class="st"><td>Conversion cost</td><td class="n" colspan="2"></td><td class="n" style="font-weight:700">${fmt(rates.tWaste+0+rates.tManpower+rates.tPower+rates.tCons+rates.indirectExpense)}</td></tr>
          <tr class="tt"><td>Total cost</td><td class="n" colspan="2"></td><td class="n" style="font-weight:700">₹${fmt(rates.tWire+rates.tBoat+rates.tWaste+rates.tManpower+rates.tPower+rates.tCons+rates.indirectExpense)}</td></tr>
          <tr><td>+ Packing+Freight</td><td class="n" colspan="2"></td>
            <td class="n"><input class="ri" style="width:55px;text-align:center" value="${rates.packingFreight}" onchange="rates.packingFreight=parseFloat(this.value)||1.67;saveRates();render()"></td></tr>
          <tr class="tt"><td>Total with P+F</td><td class="n" colspan="2"></td><td class="n" style="font-weight:700">₹${fmt(rates.tWire+rates.tBoat+rates.tWaste+rates.tManpower+rates.tPower+rates.tCons+rates.indirectExpense+rates.packingFreight)}</td></tr>
          </tbody></table></div>
      </div>

      <div class="cd"><div class="ct2">OD-wise Wire & Boat base <span style="font-size:10px;font-weight:400;color:var(--tx3)">for equivalent target calculation</span></div>
        <div class="sx"><table class="tb" style="font-size:11px">
          <thead><tr><th></th><th class="n">OD 2.2</th><th class="n">OD 2.5</th><th class="n">OD 2.8</th></tr></thead>
          <tbody>
          <tr><td>Wire Kg/MT</td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.wireOD22}" onchange="rates.wireOD22=parseFloat(this.value)||8.6;saveRates();render()"></td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.wireOD25}" onchange="rates.wireOD25=parseFloat(this.value)||10.4;saveRates();render()"></td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.wireOD28}" onchange="rates.wireOD28=parseFloat(this.value)||11.8;saveRates();render()"></td></tr>
          <tr><td>Boat Pcs/MT</td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.boatOD22}" onchange="rates.boatOD22=parseFloat(this.value)||1.7;saveRates();render()"></td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.boatOD25}" onchange="rates.boatOD25=parseFloat(this.value)||2.9;saveRates();render()"></td>
            <td class="n"><input class="ri" style="width:48px;text-align:center" value="${rates.boatOD28}" onchange="rates.boatOD28=parseFloat(this.value)||3.3;saveRates();render()"></td></tr>
          </tbody></table></div>
      </div>

      <div class="cd"><div class="ct2">Other rates</div>
        ${rateField('baseFilmRate','Base film rate','₹ per Kg (for wastage calc)')}
      </div>

      <div class="cd"><div class="ct2">ℹ️ Equivalence factors</div>
        <div style="font-size:11px;color:var(--tx2);line-height:1.6">
          Micron, OD, Material, and Width equivalence are read <b>directly from ZSLIT</b> columns (OD Eqv, Mic Eqv, Material Equiv, Width Equiv) — no manual multipliers needed.
          <br>Avg Width comes from <b>ZJUMBO</b> (jumbo rolls ~2900mm).
          <br>Target wire/boat uses OD-wise Mic Eqv*Weight from ZSLIT grouped by OD (2.2/2.5/2.8) × base Kg/MT.
        </div>
      </div>

      <div class="cd"><div class="ct2">Data management</div>
        <p style="font-size:12px;color:var(--tx2);margin-bottom:10px">Uploaded data is held in browser memory for this session.</p>
        <button class="btn bo" onclick="uploads={};rawData={};uploadLog=[];lastComputeResult=null;render()" style="font-size:11px">Clear all uploads</button>
        <button class="btn bo" onclick="if(confirm('Delete ALL saved months?')){savedMonths={};saveToStorage();render()}" style="font-size:11px;margin-left:6px;color:var(--rd)">Clear saved data</button>
      </div>`;
  }
  }catch(err){
    console.error('[MetCost] Render error:',err);
    const ct=document.getElementById('content');
    if(ct) ct.innerHTML='<div class="cd" style="text-align:center;padding:20px"><div style="font-size:16px;font-weight:700;color:var(--rd);margin-bottom:8px">⚠️ Render error</div><div style="font-size:12px;color:var(--tx2)">'+err.message+'</div><button class="btn bp" onclick="savedMonths={};localStorage.removeItem(\'metcost_saved_months\');render()" style="margin-top:12px;font-size:11px">🗑️ Clear old data & retry</button></div>';
  }
}

function showAddTarget(){
  const m=document.getElementById('addModal');
  if(!m)return;
  m.innerHTML=`<div class="mo" onclick="document.getElementById('addModal').innerHTML=''">
    <div class="mx" onclick="event.stopPropagation()">
      <h3>Add film type target</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fg"><label>Film code</label><input id="nc" placeholder="G15301M22"></div>
        <div class="fg"><label>Description</label><input id="nd" placeholder="15µ Met 2.2OD"></div>
        <div class="fg"><label>Wire Kg/MT</label><input id="nw" type="number" step="0.01"></div>
        <div class="fg"><label>Boat Pcs/MT</label><input id="nb" type="number" step="0.01"></div>
        <div class="fg" style="grid-column:span 2"><label>BOM Qty/MT</label><input id="nbom" type="number" step="0.01" value="1005"></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">
        <button class="btn bo" onclick="document.getElementById('addModal').innerHTML=''">Cancel</button>
        <button class="btn bp" onclick="addTarget()">Add target</button>
      </div>
    </div></div>`;
}

function addTarget(){
  const c=document.getElementById('nc').value,d=document.getElementById('nd').value;
  if(!c||!d)return;
  targets.push({id:Date.now(),c,d,w:Number(document.getElementById('nw').value)||0,b:Number(document.getElementById('nb').value)||0,bom:Number(document.getElementById('nbom').value)||1005});
  document.getElementById('addModal').innerHTML='';
  render();
}
function removeTarget(id){targets=targets.filter(t=>t.id!==id);render()}

// Download cost sheet as image
function downloadCostImage(){
  const el=document.getElementById('costPrintArea');
  if(!el){alert('No cost data to download');return}
  const btn=document.getElementById('dlBtn');
  if(btn){btn.textContent='⏳ Generating...';btn.disabled=true}
  html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(canvas=>{
    const link=document.createElement('a');
    link.download='MetCost_'+selMonth+'.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
    if(btn){btn.textContent='📷 Download as Image';btn.disabled=false}
  }).catch(e=>{
    console.error(e);
    if(btn){btn.textContent='📷 Download as Image';btn.disabled=false}
    alert('Download failed');
  });
}

// Request manpower data from parent app
function requestManpower(){
  try{window.parent.postMessage({type:'REQUEST_MANPOWER'},'*')}catch(e){}
}

initMonths();
render();

// Request data from parent on load
setTimeout(requestManpower,500);
setTimeout(()=>{try{window.parent.postMessage({type:'METCOST_REQUEST_LOAD'},'*')}catch(e){}},600);
</script>
</body>
</html>
