<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MRM Presentation</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--sf:#111825;--tx:#e2e8f0;--tx2:#94a3b8;--bd:rgba(255,255,255,.08);--ac:#ef4444;--gn:#22c55e;--r:12px;--fn:'DM Sans',sans-serif;--mn:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh}
.hd{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 16px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:18px;font-weight:800;background:linear-gradient(90deg,#ef4444,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd p{font-size:11px;color:var(--tx2)}
.ct{padding:16px;max-width:600px;margin:0 auto}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px}
.ct2{font-size:14px;font-weight:700;margin-bottom:10px}
select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:8px 12px;border-radius:8px;font-family:var(--fn);font-size:13px;width:100%}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--r);font-family:var(--fn);font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.bp{background:linear-gradient(135deg,#ef4444,#f59e0b);color:#fff}
.bp:disabled{opacity:.5}
.status{font-size:12px;color:var(--tx2);margin-top:8px;text-align:center}
.months{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.months span{padding:4px 10px;border-radius:6px;font-size:11px;font-family:var(--mn);background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
</style>
</head>
<body>
<div class="hd">
  <div style="font-size:28px">📊</div>
  <div><h1>MRM Presentation</h1><p>Monthly Review Meeting · Auto-generated from MetCost Pro data</p></div>
</div>
<div class="ct" id="app"></div>

const ML=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ml(mk){const [y,m]=mk.split('-');return ML[parseInt(m)-1]+' '+y}
function fmt(v,d){return(typeof v==='number')?v.toFixed(d===undefined?2:d):'—'}

// ═══ READ DIRECTLY FROM LOCALSTORAGE — same domain as MetCost Pro ═══
let metData={}, metSettings={};
function loadFromStorage(){
  try{
    const s=localStorage.getItem('metcost_saved_months');
    if(s) metData=JSON.parse(s);
  }catch(e){console.warn('[MRM] localStorage months error:',e)}
  try{
    const s=localStorage.getItem('metcost_allSettings');
    if(s) metSettings=JSON.parse(s);
    else{
      const r=localStorage.getItem('metcost_rates');
      if(r) metSettings={rates:JSON.parse(r)};
    }
  }catch(e){console.warn('[MRM] localStorage settings error:',e)}
  console.log('[MRM] Loaded from localStorage: '+Object.keys(metData).length+' months');
}
loadFromStorage();
renderApp();

function renderApp(){
  const months=Object.keys(metData).sort().reverse();
  const app=document.getElementById('app');
  if(!months.length){
    app.innerHTML=`<div class="cd">
      <div class="ct2">❌ No data found</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">Open <b>MetCost Pro</b> first → upload files → Sync to Cloud → then come back here.</p>
      <button onclick="loadFromStorage();renderApp()" class="btn" style="background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)">🔄 Retry</button>
    </div>`;
    return;
  }
  const r=metSettings.rates||{};
  app.innerHTML=`
    <div class="cd">
      <div class="ct2">📊 Generate MRM Presentation</div>
      <p style="font-size:12px;color:var(--tx2);margin-bottom:12px">${months.length} months available. Select month and generate PPT.</p>
      <label style="font-size:11px;color:var(--tx2);display:block;margin-bottom:4px">Select Month</label>
      <select id="selMonth">${months.map(m=>'<option value="'+m+'">'+ml(m)+'</option>').join('')}</select>
      <div style="margin-top:14px">
        <button class="btn bp" onclick="generatePPT()" id="genBtn">📊 Generate MRM Presentation</button>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="cd">
      <div class="ct2" style="font-size:12px">Available Months (${months.length})</div>
      <div class="months">${months.slice(0,24).map(m=>'<span>'+ml(m)+'</span>').join('')}</div>
    </div>`;
}

async function generatePPT(){
  const mk=document.getElementById('selMonth').value;
  const btn=document.getElementById('genBtn');
  const stat=document.getElementById('status');
  btn.disabled=true;btn.textContent='⏳ Generating...';stat.textContent='';
  try{
    await _buildPPT(mk);
    stat.textContent='✅ PPT downloaded!';stat.style.color='#22c55e';
  }catch(err){
    stat.textContent='❌ '+err.message;stat.style.color='#ef4444';console.error(err);
  }
  btn.disabled=false;btn.textContent='📊 Generate MRM Presentation';
}

async function _buildPPT(mk){
  const d=metData[mk];if(!d) throw new Error('No data for '+mk);
  const r=(metSettings.rates)||{};
  const months=Object.keys(metData).sort();
  const mkIdx=months.indexOf(mk);
  const m3=[months[mkIdx-2],months[mkIdx-1],mk].filter(Boolean);
  const m13=months.slice(Math.max(0,mkIdx-12),mkIdx+1);
  const [yr,mo]=mk.split('-');
  const monthName=ML[parseInt(mo)-1]+'-'+yr.slice(2);
  const fullMonth=ML[parseInt(mo)-1]+' '+yr;

  const pres=new PptxGenJS();
  pres.layout='LAYOUT_WIDE';
  pres.author='MetCost Pro';
  pres.title='Metallizer Performance Review '+fullMonth;
  const C={dk:'1E2761',tl:'0D6E6E',wh:'FFFFFF',gy:'F2F2F2',rd:'DC2626',gn:'22C55E',am:'F59E0B',tx:'2D3748'};
  const hF='Calibri',bF='Calibri';
  const tb={pt:0.5,color:'CBD5E1'};
  const hdr=(cols)=>cols.map(t=>({text:t,options:{fill:{color:C.dk},color:C.wh,bold:true,fontSize:11,align:'center'}}));

  // ══ S1: Title ══
  let s=pres.addSlide();
  s.background={color:C.dk};
  s.addShape(pres.shapes.RECTANGLE,{x:0,y:6.8,w:13.3,h:0.7,fill:{color:'0D9488'}});
  s.addImage({data:GLS_LOGO,x:0.5,y:0.4,w:1.2,h:0.8});
  s.addText('Metallizer Performance Review',{x:2,y:1.8,w:9.5,h:1.5,fontSize:36,fontFace:hF,color:C.wh,bold:true});
  s.addText(fullMonth.toUpperCase(),{x:2,y:3.3,w:9.5,h:0.8,fontSize:28,fontFace:hF,color:'0D9488',bold:true});
  s.addText('GLS Polyfilms · Metallizer Department',{x:2,y:5,w:9.5,h:0.5,fontSize:14,fontFace:bF,color:'94A3B8'});

  // ══ S2: Contents ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0.3,y:0.2,w:1.2,h:0.8});
  s.addShape(pres.shapes.RECTANGLE,{x:2.7,y:0.5,w:8,h:0.6,fill:{color:C.dk}});
  s.addText('Contents',{x:3,y:0.5,w:7,h:0.6,fontSize:20,fontFace:hF,color:C.wh,bold:true});
  ['Mixed Product Details','SB and Wastages','Monthly Performance Tracking','Wastage Trend','Down gradation Trend','Downtime Summary','Conversion Cost Analysis','Target for Next Month'].forEach((c,i)=>{
    s.addText((i+1)+'. '+c,{x:3.2,y:1.5+i*0.65,w:7,h:0.5,fontSize:16,fontFace:bF,color:C.tx});
  });

  // ══ S3: Mixed Product ══
  const za=d.zsAgg||{};const byMat=za.byMaterial||[];
  s=pres.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0,y:0,w:1.2,h:0.8});
  s.addText('Mixed Product Details',{x:1.7,y:0.1,w:10,h:0.7,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  const micRows={'8':{},'10':{},'12':{},'15':{},'19':{},'23':{},'AlOx':{},'RC':{}};
  byMat.forEach(m=>{const c=(m.code||'').toUpperCase(),ds=m.desc||m.code||'';
    const mm=ds.match(/(\d+)µ/);let mic=mm?mm[1]:'12';
    if(c.includes('AL')&&c.match(/AL\d/))mic='AlOx';else if(c.includes('RC'))mic='RC';
    const om=ds.match(/([\d.]+)OD/);const od=om?om[1]:'2.2';
    if(!micRows[mic])micRows[mic]={};micRows[mic][od]=(micRows[mic][od]||0)+(m.kg||0)/1000;
  });
  const mixData=[hdr(['Micron/OD','2.2','2.5','2.8','Total (MT)','Equiv. (MT)'])];
  let gt=0;
  Object.entries(micRows).forEach(([mic,ods])=>{
    const tot=['2.2','2.5','2.8'].reduce((s,od)=>s+(ods[od]||0),0);
    if(tot<0.01)return;gt+=tot;
    mixData.push([mic==='AlOx'?'12µ AlOx':mic==='RC'?'12µ Release':mic,...['2.2','2.5','2.8'].map(od=>fmt(ods[od]||0,1)),fmt(tot,1),'—'].map((t,i)=>({text:t,options:{fontSize:10,align:i>0?'right':'left',bold:i===0}})));
  });
  mixData.push(['Total','','','',fmt(gt,1),fmt(d.equivKg?d.equivKg/1000:gt,0)].map((t,i)=>({text:t,options:{fill:{color:'E2E8F0'},bold:true,fontSize:11,align:i>0?'right':'left'}})));
  s.addTable(mixData,{x:0.5,y:1,w:12.3,border:tb,colW:[2.5,1.8,1.8,1.8,2.2,2.2],rowH:0.5});

  // ══ S4: Wastages ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addImage({data:GLS_LOGO,x:0,y:0,w:1.2,h:0.8});
  s.addText('SB and Wastages',{x:1.7,y:0,w:10,h:0.9,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  const wRows=[hdr(['Wastages-SAP','MTD (MT)','MTD%','Target %','Deviation%']),
    ['Met Sheet Waste',fmt((d.metWasteKg||0)/1000,1),fmt(d.metWastePct,1),'1.0',fmt(-(d.metWastePct-1),1)],
    ['B Grade',fmt((d.slitBKg||0)/1000,1),fmt(d.bGradePct,1),'0',fmt(-d.bGradePct,1)],
  ].map((r,ri)=>ri===0?r:r.map((t,i)=>({text:t,options:{fontSize:11,align:i>0?'right':'left',color:i===4&&parseFloat(t)<0?C.rd:C.tx}})));
  s.addTable(wRows,{x:0.3,y:1.7,w:12.7,border:tb,colW:[3.5,2.3,2.3,2.3,2.3],rowH:0.55});

  // ══ S5: Monthly Tracking ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addText('Monthly Performance Tracking',{x:1.2,y:0.1,w:10.9,h:0.5,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  const pf=[
    {l:'Met Feed/Input (MT)',f:dd=>(dd.prodKg||0)/1000,dp:1},
    {l:'Slitting Output(MT)',f:dd=>(dd.effectiveProd||0)/1000,dp:1},
    {l:'Met Waste Produced(%)',f:dd=>dd.metWastePct||0,dp:2},
    {l:'B Grade Generated(%)',f:dd=>dd.bGradePct||0,dp:1},
    {l:'Eqv. Output(MT)',f:dd=>(dd.equivKg||0)/1000,dp:1},
    {l:'Run Days',f:dd=>dd.runDays?dd.runDays.avg:0,dp:1},
    {l:'Al Wire(Kg/MT)',f:dd=>dd.prodMT?(dd.wireKgsTotal||0)/dd.prodMT:0,dp:1},
    {l:'Boat(Pc/MT)',f:dd=>dd.prodMT?(dd.boatPcsTotal||0)/dd.prodMT:0,dp:1},
    {l:'Power(UPT)',f:dd=>dd.prodMT?(dd.pwrU||0)/dd.prodMT:0,dp:1},
    {l:'Avg Width(MM)',f:dd=>dd.odEq?dd.odEq.avgWidth:0,dp:0},
  ];
  const pRows=[hdr(['Month',...m3.map(m=>ml(m).replace(' 20','-'))])];
  pf.forEach(pm=>{
    const row=[{text:pm.l,options:{fontSize:10}}];
    m3.forEach(m=>{const dd=metData[m]||{};row.push({text:fmt(pm.f(dd),pm.dp),options:{align:'right',fontSize:10,fontFace:'JetBrains Mono'}})});
    pRows.push(row);
  });
  s.addTable(pRows,{x:0.3,y:0.8,w:12.4,border:tb,colW:[5,...m3.map(()=>(12.4-5)/m3.length)],rowH:0.42});

  // ══ S6: Waste Trend ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addText('Wastage-Trend',{x:0.9,y:0.1,w:11.5,h:0.7,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  s.addChart(pres.charts.BAR,[{name:'% Waste',labels:m13.map(m=>ml(m).split(' ')[0]),values:m13.map(m=>(metData[m]||{}).metWastePct||0)}],
    {x:0.3,y:1.2,w:12.7,h:5.5,barDir:'col',showValue:true,valueFontSize:9,catAxisLabelFontSize:9,chartColors:['0D9488'],showTitle:true,title:'% Non Usable Waste Generated',titleFontSize:12,titleColor:C.tx});

  // ══ S7: B-Grade Trend ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addText('Down gradation Trend',{x:0.9,y:0.2,w:11.5,h:0.8,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  s.addChart(pres.charts.BAR,[{name:'% B Grade',labels:m13.map(m=>ml(m).split(' ')[0]),values:m13.map(m=>(metData[m]||{}).bGradePct||0)}],
    {x:0.3,y:1.2,w:12.7,h:5.5,barDir:'col',showValue:true,valueFontSize:9,catAxisLabelFontSize:9,chartColors:[C.rd],showTitle:true,title:'% Down Gradation (B + 3rd Grade)',titleFontSize:12,titleColor:C.tx});

  // ══ S8: Downtime ══
  s=pres.addSlide();s.background={color:C.wh};
  s.addText('Downtime Summary in Hours',{x:3.3,y:0,w:6.7,h:0.8,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  const rd=d.runDays||{};
  const dtRows=[hdr(['Machine','Met-1','Met-2','Total']),
    ['Total Stop (hrs)',((rd.m1Stop||0)*24).toFixed(1),((rd.m2Stop||0)*24).toFixed(1),(((rd.m1Stop||0)+(rd.m2Stop||0))*24).toFixed(1)],
    ['Power Downtime',((rd.m1PwrStop||0)*24).toFixed(1),((rd.m2PwrStop||0)*24).toFixed(1),(((rd.m1PwrStop||0)+(rd.m2PwrStop||0))*24).toFixed(1)],
    ['Run Days',fmt(rd.m1||0,1),fmt(rd.m2||0,1),fmt(rd.avg||0,1)],
    ['Rolls/Day',fmt(rd.m1RollsPerDay||0,1),fmt(rd.m2RollsPerDay||0,1),fmt(rd.avgRollsPerDay||0,1)],
  ].map((r,ri)=>ri===0?r:r.map((t,i)=>({text:String(t),options:{fontSize:11,align:i>0?'right':'left',bold:i===0}})));
  s.addTable(dtRows,{x:0.4,y:0.8,w:12.5,border:tb,colW:[4,2.8,2.8,2.8],rowH:0.55});

  // ══ S9: Conversion Cost ══
  s=pres.addSlide();s.background={color:C.wh};
  const e=d.eq||{};const tRM=(r.tWire||3.05)+(r.tBoat||1.87);
  const tConv=(r.tWaste||1)+(r.tManpower||0.8)+(r.tPower||3.56)+(r.tCons||0.3)+(r.indirectExpense||0.26);
  const ccRows=[
    hdr(['Conversion Cost:','Actual','Equivalent','Target '+(r.targetDate||'')]),
    ['Slit Production (Kg)',fmt(d.effectiveProd||0,0),fmt(d.equivKg||0,0),''],
    ['Wastage % (Inc. 6 Grade)',fmt(d.metWastePct,2),fmt(e.metWPct||d.metWastePct,2),'1.00'],
    ['B Grade %',fmt(d.bGradePct,2),fmt(e.bGradePct||d.bGradePct,2),'0.00'],
    ['Bare Film Waste %',fmt(d.bareWastePct,2),fmt(e.bareWPct||d.bareWastePct,2),''],
    ['','Cost ₹/Kg','Cost ₹/Kg','Cost ₹/Kg'],
    ['Wire ('+fmt((d.wireKgsTotal||0)/(d.prodMT||1),1)+' Kg/MT)',fmt(d.wireCKg),fmt(e.wire),fmt(r.tWire||3.05)],
    ['Boat ('+fmt((d.boatPcsTotal||0)/(d.prodMT||1),1)+' Pc/MT)',fmt(d.boatCKg),fmt(e.boat),fmt(r.tBoat||1.87)],
    ['\u2003Raw Material Cost:',fmt(d.rmC),fmt(e.rm),fmt(tRM)],
    ['','','',''],
    ['Wastage Loss',fmt(d.wasteLoss),fmt(e.wasteLoss),fmt(r.tWaste||1)],
    ['B Grade Loss',fmt(d.bGradeLoss),fmt(e.bGradeLoss),'0.00'],
    ['Manpower',fmt(d.mpKg),fmt(e.mp),fmt(r.tManpower||0.8)],
    ['Power',fmt(d.pwrKg),fmt(e.pwr),fmt(r.tPower||3.56)],
    ['Cons & Spares',fmt(d.consKg),fmt(e.cons),fmt(r.tCons||0.3)],
    ['Indirect',fmt(r.indirectExpense||0.26),fmt(r.indirectExpense||0.26),fmt(r.indirectExpense||0.26)],
    ['\u2003Conversion Cost',fmt(d.convC),fmt(e.convC),fmt(tConv)],
    ['\u2003Total Cost',fmt(d.totalC),fmt(e.totalC),fmt(tRM+tConv)],
    ['Packing & Freight',fmt(r.packingFreight||1.67),fmt(r.packingFreight||1.67),fmt(r.packingFreight||1.67)],
    ['\u2003Total with Packing','₹'+fmt(d.totalWP),'₹'+fmt(e.totalWP),'₹'+fmt(tRM+tConv+(r.packingFreight||1.67))],
  ].map((row,ri)=>{
    if(ri===0)return row;
    const isBold=row[0].startsWith('\u2003');
    const label=row[0].replace('\u2003','');
    return row.map((t,i)=>({text:i===0?label:t,options:{fontSize:10,align:i>0?'right':'left',bold:isBold&&i===0,
      fill:ri===8||ri===16?{color:'E8F0FE'}:ri===19?{color:'FEF3C7'}:undefined,
      fontFace:i>0?'JetBrains Mono':bF}}));
  });
  s.addTable(ccRows,{x:0.1,y:0.1,w:13,border:tb,colW:[4.5,2.8,2.8,2.8],rowH:0.35});

  // ══ S10: Target ══
  s=pres.addSlide();s.background={color:C.wh};
  const nextMo=parseInt(mo)>=12?ML[0]+'-'+(parseInt(yr)+1):ML[parseInt(mo)]+'-'+yr;
  s.addText('Target for the Next Month of '+nextMo,{x:0.7,y:0,w:12,h:0.9,fontSize:28,fontFace:hF,color:C.dk,bold:true});
  [['Slitting Output(MT) (Equiv 12µ 2.2OD)','1875'],['Number of Run Days','25'],['Running Time (Hrs/Machine/Day)','15.5'],['Met Waste(%)','1.0'],['B Grade Generation(%)','0.1'],['Overall Efficiency(%)','98.9']].forEach((row,i)=>{});
  s.addTable([['Slitting Output(MT) (Equiv 12µ 2.2OD)','1875'],['Number of Run Days','25'],['Running Time (Hrs/Machine/Day)','15.5'],['Met Waste(%)','1.0'],['B Grade Generation(%)','0.1'],['Overall Efficiency(%)','98.9']].map(r=>[{text:r[0],options:{fontSize:13,bold:true}},{text:r[1],options:{fontSize:13,align:'right',fontFace:'JetBrains Mono',bold:true,color:C.dk}}]),
    {x:0.4,y:1.2,w:12.5,border:tb,colW:[8.5,4],rowH:0.7});

  // ══ S11: Thanks ══
  s=pres.addSlide();s.background={color:C.dk};
  s.addImage({data:GLS_LOGO,x:5.7,y:1.5,w:2.1,h:1.4});
  s.addText('Thanks',{x:2,y:4.5,w:9.3,h:1.5,fontSize:48,fontFace:hF,color:C.wh,bold:true,align:'center'});

  await pres.writeFile({fileName:'Met_Presentation_'+fullMonth.replace(' ','_')+'.pptx'});
}
